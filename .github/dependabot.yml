version: 2
updates:
  # RAG サービスの Python 依存を週次で自動更新
  - package-ecosystem: pip
    directory: /rag
    # 既定は「リポジトリのデフォルトブランチ」= main。main への push は
    # 本番(ECS on Fargate)への自動デプロイを引くため、依存更新が develop・release の
    # ゲートを通らずに本番へ出てしまう。ブランチフローに合わせて develop 宛にする。
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # メジャーバージョンアップは手動で判断するため対象外
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions のバージョンを週次で自動更新
  - package-ecosystem: github-actions
    directory: /
    # pip と同じ理由で develop 宛にする（既定の main だと本番へ直行する）
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # メジャーバージョンアップは手動で判断するため対象外（pip と揃える）。
    # 自動マージの対象が minor/patch だけでも、major PR が自動で開くと
    # 「緑だから」で通してしまいやすい。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # frontend の npm 依存を週次で自動更新
  - package-ecosystem: npm
    directory: /frontend
    # ここにエントリが無いと、セキュリティ更新も含めて既定ブランチ(main)宛に出る。
    # 実際 #1685 / #1686 / #1687 は main 宛で作られ、develop・release を飛ばして
    # 本番(ECS on Fargate)へ直行する形になっていた。pip と同じく develop 宛にする。
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    # メジャーバージョンアップは手動で判断するため対象外（pip と揃える）。
    # Next.js は AGENTS.md のとおり訓練データと挙動が違うので、
    # 版上げは必ず build と E2E を通してから入れる。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend の Go 依存を週次で自動更新
  - package-ecosystem: gomod
    directory: /Backend
    # npm と同じ理由。エントリが無いと既定ブランチ(main)宛になる。
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # sentry-go/echo は 0.x なので、0.36.0 以降への更新も dependabot からは
      # semver-minor に見え、major 除外にも自動マージ除外にも引っかからない。
      # 実際 0.50.0 は Echo v5 へ移行しており、Echo v4 の本体はビルド不能になる
      # (internal/middleware/error_handler.go の sentryecho.GetHubFromContext)。
      # #1804 がこれで develop に入ってビルドを壊したため明示的に除外する。
      # Echo v5 へ移行するときに、この行を消して手動で上げる。
      - dependency-name: "github.com/getsentry/sentry-go/echo"
