name: RAG Python Tests

on:
  push:
    paths:
      - 'rag/**'
  pull_request:
    paths:
      - 'rag/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies if present
        run: |
          # テスト用ツールを先に入れる。requirements.txt より後ろに置くと
          # バージョン無指定の pytest が ==ピンを上書きし、宣言と実インストールが
          # 乖離した状態でテストが走る（#1159 の全件検証が落ちる）
          pip install coverage pytest-cov
          if [ -f rag/requirements.txt ]; then pip install -r rag/requirements.txt; fi
          if [ -f rag/constraints.txt ]; then pip install -r rag/constraints.txt || true; fi

      - name: Run tests with coverage
        working-directory: rag
        run: |
          python -m pytest tests -q --maxfail=1 --disable-warnings --cov=.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-test-coverage
          path: rag/coverage.xml || coverage.xml || ''
