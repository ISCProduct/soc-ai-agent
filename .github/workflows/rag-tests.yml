name: RAG Python Tests

on:
  push:
    paths:
      - 'rag/**'
  pull_request:
    paths:
      - 'rag/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          # rag/Dockerfile と同じ正規手順。constraints.txt は -c で渡す（#1159）。
          # 旧: `pip install -r rag/constraints.txt || true` は constraints を
          # requirements として入れるため、litellm 等の推移的要求が pydantic /
          # tiktoken の ==ピンを超えて解決しても `|| true` で失敗が隠れ、
          # 宣言と実インストールが乖離した状態でテストが走りえた。
          # テスト用ツールも既存のピンを崩さないよう -c で縛る。
          pip install -r rag/requirements.txt -c rag/constraints.txt
          pip install coverage pytest-cov -c rag/requirements.txt -c rag/constraints.txt

      - name: Run tests with coverage
        working-directory: rag
        run: |
          python -m pytest tests -q --maxfail=1 --disable-warnings --cov=.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-test-coverage
          path: rag/coverage.xml || coverage.xml || ''
