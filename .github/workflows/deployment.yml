name: Deploy

# develop -> staging（IAMロール無しEC2 + Docker Compose、SSHでpull/up）
# main    -> production（ECS on Fargate、展示会時起動。desired_countは変更しない）
# 本体は deploy-staging-job.yml と deploy-production-job.yml。ここは起動条件とジョブの並びだけ持つ。
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref_name == 'develop'
    name: Deploy to staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-staging-job.yml
    secrets: inherit

  deploy-staging-smoke:
    needs: deploy-staging
    if: github.ref_name == 'develop' && success()
    uses: ./.github/workflows/deploy-smoke.yml
    with:
      environment: staging
    secrets: inherit

  # Discord Interactions Endpoint の受け口(Lambda)。
  #
  # deploy-staging には依存させない。この受け口を staging から Lambda へ移したのは
  # 「staging が止まっていても /prod を受けられるようにする」ためで、staging の
  # デプロイ結果に更新が引きずられては意味が無い。
  #
  # 関数の箱と環境変数は terraform 側(infra/terraform/environments/staging/
  # discord_lambda.tf)が持ち、ここではコードだけ差し替える。
  deploy-discord-lambda:
    if: github.ref_name == 'develop'
    name: Deploy Discord Lambda
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    concurrency:
      group: deploy-discord-lambda
      cancel-in-progress: true

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      FUNCTION_NAME: ${{ vars.PROJECT_NAME || 'soc-stg' }}-discord

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ./Backend/go.mod
          cache-dependency-path: ./Backend/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and deploy
        working-directory: ./Backend
        run: |
          set -e
          # provided.al2023 のカスタムランタイムは bootstrap という名前の実行ファイルを探す。
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o bootstrap ./cmd/discord-lambda
          zip -j discord-lambda.zip bootstrap

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://discord-lambda.zip \
            --query 'LastUpdateStatus' --output text

          # 更新の反映を待たずに次のリクエストが来ると、古いコードで応答することがある。
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "$FUNCTION_NAME を更新しました"

  # 本番の受け口は terraform の discord_bot_enabled で作るまで存在しない。
  # 関数が無い間はこのジョブを失敗にしない（SOCAIAGENT-512）。
  deploy-discord-lambda-prod:
    if: github.ref_name == 'main'
    name: Deploy Discord Lambda (production)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-discord-lambda-prod
      cancel-in-progress: true

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      FUNCTION_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}-discord

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ./Backend/go.mod
          cache-dependency-path: ./Backend/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and deploy
        working-directory: ./Backend
        run: |
          set -e
          # 関数が無い（ResourceNotFoundException）ときだけスキップする。
          # 権限不足・スロットリング・ネットワーク断などは握りつぶさず失敗させる。
          if ! GET_OUT=$(aws lambda get-function --function-name "$FUNCTION_NAME" 2>&1); then
            if echo "$GET_OUT" | grep -q "ResourceNotFoundException"; then
              echo "本番の Discord Lambda は未作成です。discord_bot_enabled を有効にするまでスキップします"
              exit 0
            fi
            echo "::error::aws lambda get-function が ResourceNotFoundException 以外で失敗しました"
            echo "$GET_OUT" >&2
            exit 1
          fi
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o bootstrap ./cmd/discord-lambda
          zip -j discord-lambda.zip bootstrap
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://discord-lambda.zip \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "$FUNCTION_NAME を更新しました"

  deploy-production:
    if: github.ref_name == 'main'
    name: Deploy to production
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-production-job.yml
    secrets: inherit

  # 更新情報(#861): mainへの直近マージPRをAI要約してDBへ取り込む。
  # 本番(Fargate)は展示会時のみ起動(desired_countは変更しない)のため、
  # デプロイ直後に到達できない場合がある。pr_numberでべき等なので、
  # 失敗しても後続の実行(展示会起動時など)で取りこぼしなく再取り込みされる。
  #
  # staging への取り込みは sync-whats-new-staging へ分けてある。こちらは
  # environment: production を宣言しており、GitHub では environment secret が
  # 同名のリポジトリシークレットを上書きするため、将来 production 環境に
  # SERVICE_SECRET が登録されると staging へ本番の値を送って黙って止まる(#1158)。
  sync-whats-new:
    needs: deploy-production
    if: github.ref_name == 'main' && always() && needs.deploy-production.result == 'success'
    name: Sync whats-new from merged PRs (production)
    runs-on: ubuntu-latest
    continue-on-error: true
    # 本番の service_secret を Secrets Manager から読むため、production の認証情報を使う(#1158)。
    # リポジトリ既定の認証情報はECSクラスタ作成前の古い値で、本番リソースを引けない。
    environment: production
    steps:
      # collect_whats_new_sources.py と、それが読む resolve_deployed_issues.py を使う。
      # squash マージのコミット題名から元PR番号を辿るため、履歴も要る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 認証に失敗しても後続は続ける。ここで止めると、リポジトリシークレットへの
      # フォールバックが効かないだけでなく、これまで確実に動いていた staging への
      # 取り込みまで丸ごとスキップされる(ジョブは continue-on-error で緑のまま)。
      - name: Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      # このジョブは environment: production なので、リポジトリシークレットを
      # 参照してはいけない(同名の environment secret に上書きされる)。
      # 本番の鍵は Secrets Manager から読む。staging の鍵はこのジョブでは使わない。
      - name: Fetch recently merged PRs and ingest
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}
          PROD_API_BASE: https://${{ vars.PROD_API_DOMAIN || 'api.shukatsu-ai.jp' }}
        run: |
          # 本番の service_secret は Secrets Manager(soc-app/service-secret)が正(#1158)。
          # リポジトリシークレットへのフォールバックは持たない。本番の値は Terraform の
          # random_password で自動生成されるので、GitHub 側に同じ値は存在し得ない。
          # 失敗理由(AccessDenied / ResourceNotFound / ExpiredToken)が分からないと
          # 警告を見ても何を直せばよいか判断できない。stderr は残す(値は stdout 側)。
          sm_err=$(mktemp)
          PROD_SERVICE_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${PROJECT_NAME:-soc-app}/service-secret" --query SecretString --output text 2>"$sm_err" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('service_secret',''))" 2>>"$sm_err" || true)
          lookup_failed=0
          if [ -n "$PROD_SERVICE_SECRET" ]; then
            echo "::add-mask::$PROD_SERVICE_SECRET"
          else
            # 「停止中で届かない」と違い、IAM権限不足やシークレット未作成は放っておいても
            # 直らない。回収経路(prod-uptime-scheduler)も同じ値を読むので、警告で流すと
            # 誰も気づかないまま更新情報が永久に反映されない(#1290 と同じ症状)。
            echo "::error::Secrets Manager から service_secret を読めませんでした。本番への取り込みができません(IAMに secretsmanager:GetSecretValue があるか、soc-app/service-secret が存在するかを確認してください)"
            sed 's/^/  aws: /' "$sm_err"
            lookup_failed=1
          fi
          rm -f "$sm_err"

          # main へ直接マージされるのは release 傘PRだけで、その本文は
          # 「起動ジョブの失敗通知が初めて有効になる」のような運用担当者向けの記述になる。
          # 傘PRをそのまま要約させると、中身に混ざった運用作業がユーザー向け更新情報として
          # 出てしまう（実際に出た）。傘PRは要約対象にせず、中身の個別PRを送る。
          sources=$(python3 .github/scripts/collect_whats_new_sources.py)

          # ペイロードは argv に乗せない。PR本文を含むと ARG_MAX を超え、
          # 「curl: Argument list too long」で curl 自体が起動しない。空の HTTP
          # コードが下の *) に落ちて「停止中の可能性」という無関係な警告に化け、
          # 本番・staging とも取り込みが黙って飛ぶ(60件で実際に踏んだ)。
          payload=$(mktemp)
          printf '{"sources": %s}' "$sources" > "$payload"

          # 本番が停止していると必ず失敗する(既定停止の運用)。ここで失敗させるとデプロイが
          # 落ちてしまうため続行はするが、黙って握りつぶすと「反映されていない」ことに
          # 気づけない。実際にそれで、運用作業がユーザー向け更新情報に出たまま残った(#1290)。
          # 取りこぼしは prod-uptime-scheduler.yml が本番起動時に回収する。
          # 「停止中で届かない」と「鍵が違って拒否された」は対処が別物。
          # 後者を warning で流すと、service_secret のローテーション後に更新情報が
          # 反映されないまま誰も気づかない(#1290 と同じ症状)。
          #
          # 503 は本文で切り分ける。api.* は CloudFront を経由せず ALB 直結
          # (infra/terraform/environments/prod/main.tf の aws_route53_record.backend が
          # module.alb.alb_dns_name を alias にしている。CloudFront が噛むのはフロント側だけ)。
          # ただし ALB も healthy target がゼロなら自分で 503 を返すので、
          # ステータスだけでは「停止中」と「SERVICE_SECRET 未設定」が区別できない。
          # 後者は EchoStaticSecretAuth が本文に SERVICE_SECRET_NOT_CONFIGURED を入れるので
          # (Backend/internal/routes/echo_adapter.go)、それが有るときだけ落とす。
          # 一律で落とすと、ローリング更新中やタスク停止中の 503 で正常なデプロイが
          # 赤くなる(実際に本番デプロイで踏んだ)。
          #
          # service_secret が読めなかった場合は叩かない。値が無いまま送ると必ず 403 になり、
          # 「鍵の不一致」と「鍵が読めない」を区別できなくなる。上で error を出してあり、
          # prod_rejected を立てたまま最後にジョブを落とす。
          prod_rejected=$lookup_failed
          if [ "$lookup_failed" = "0" ]; then
            prod_resp=$(mktemp)
            prod_code=$(curl -s -o "$prod_resp" -w '%{http_code}' -X POST "$PROD_API_BASE/api/admin/whats-new/ingest" \
              -H "Content-Type: application/json" \
              -H "X-Admin-Secret: $PROD_SERVICE_SECRET" \
              -d @"$payload" \
              --max-time 60 || true)
            case "$prod_code" in
              2*) ;;
              401|403)
                echo "::error::本番への更新情報の取り込みが $prod_code で拒否されました。service_secret が本番の値と一致していません(SERVICE_SECRET の注入とローテーション後の CI 設定を確認してください)"
                prod_rejected=1
                ;;
              503)
                if grep -q SERVICE_SECRET_NOT_CONFIGURED "$prod_resp"; then
                  echo "::error::本番の SERVICE_SECRET が未設定です(503)。terraform apply でタスク定義へ注入してからデプロイし直してください"
                  prod_rejected=1
                else
                  echo "::warning::本番への更新情報の取り込みに失敗しました(HTTP 503 / 停止中・ローリング更新中の可能性)。本番起動時に回収されます。"
                fi
                ;;
              *)
                echo "::warning::本番への更新情報の取り込みに失敗しました(HTTP $prod_code / 停止中の可能性)。本番起動時に回収されます。"
                ;;
            esac
            rm -f "$prod_resp"
          fi

          [ "$prod_rejected" = "0" ]

  # main 由来の更新情報を staging にも反映し、本番が停止中でも staging で確認できるようにする。
  #
  # sync-whats-new から分けてあるのは、あちらが environment: production を宣言して
  # いるため。GitHub では environment secret が同名のリポジトリシークレットを
  # 上書きするので、同じジョブで staging 用の secrets.SERVICE_SECRET を読むと、
  # production 環境に SERVICE_SECRET が登録された時点で staging へ本番の値を送って
  # しまい、403 で黙って止まる(#1158)。「production 環境に登録しない」という運用
  # ルールに頼るのではなく、ジョブの境界で踏めないようにする。
  #
  # 実行順は本番側と独立でよい。ingest は pr_number でべき等なので、どちらが先でも
  # 結果は変わらない。それぞれのジョブが自分の失敗を自分で報告する。
  sync-whats-new-staging:
    needs: deploy-production
    if: github.ref_name == 'main' && always() && needs.deploy-production.result == 'success'
    name: Sync whats-new from merged PRs (staging)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # collect_whats_new_sources.py と、それが読む resolve_deployed_issues.py を使う。
      # squash マージのコミット題名から元PR番号を辿るため、履歴も要る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch recently merged PRs and ingest into staging
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}
          STAGING_API_BASE: https://${{ vars.STAGING_API_DOMAIN || 'api-stg.shukatsu-ai.jp' }}
        run: |
          # 未登録だと staging が停止中のとき警告だけで終わり、設定漏れに気づけない。
          # 「届かなかった」のではなく「鍵を持っていない」ので、先に落とす。
          if [ -z "$SERVICE_SECRET" ]; then
            echo "::error::リポジトリシークレット SERVICE_SECRET が未登録です。staging の service_secret_plain と同じ値を登録してください(#1158)"
            exit 1
          fi

          # 傘PRは要約対象にせず、中身の個別PRを送る(sync-whats-new と同じ理由)。
          sources=$(python3 .github/scripts/collect_whats_new_sources.py)

          # ペイロードは argv に乗せない。PR本文を含むと ARG_MAX を超える。
          payload=$(mktemp)
          printf '{"sources": %s}' "$sources" > "$payload"

          # 「停止中で届かない」と「鍵が違う/未登録」は対処が別物。後者を warning で
          # 流すと設定漏れに気づけない。staging の api も ALB 直結(edge nginx が噛むのは
          # frontend だけ)なので、設定不備の503は本文で見分けられる。
          stg_resp=$(mktemp)
          stg_code=$(curl -s -o "$stg_resp" -w '%{http_code}' -X POST "$STAGING_API_BASE/api/admin/whats-new/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $SERVICE_SECRET" \
            -d @"$payload" \
            --max-time 60 || true)
          stg_rejected=0
          case "$stg_code" in
            2*) ;;
            401|403)
              echo "::error::stagingへの更新情報の取り込みが $stg_code で拒否されました。リポジトリシークレット SERVICE_SECRET が staging の値と一致していません"
              stg_rejected=1
              ;;
            503)
              if grep -q SERVICE_SECRET_NOT_CONFIGURED "$stg_resp"; then
                echo "::error::staging の SERVICE_SECRET が未設定です(503)。staging の terraform apply とデプロイ(.env の継ぎ足し)を確認してください"
                stg_rejected=1
              else
                echo "::warning::stagingへの更新情報の取り込みに失敗しました(HTTP 503 / 停止中の可能性)。"
              fi
              ;;
            *)
              echo "::warning::stagingへの更新情報の取り込みに失敗しました(HTTP $stg_code / 停止中の可能性)。"
              ;;
          esac
          rm -f "$stg_resp"
          [ "$stg_rejected" = "0" ]

  # 本番へ反映された issue を閉じる。
  #
  # feature/* -> develop -> release -> main のフローでは GitHub の
  # `Closes #123` が発火しない。close キーワードは**デフォルトブランチへ
  # マージされたPR**の本文でのみ効くが、feature PR の base は develop であり、
  # プロモーションPRの本文には issue 番号が書かれないため。
  # 結果、本番反映済みの issue が開いたまま溜まる（2026-09-10 時点で16件）。
  #
  # squash マージのコミット題名に残る元PR番号 `(#1234)` を辿り、
  # そのPR本文の close キーワードから issue を解決して閉じる。
  close-deployed-issues:
    needs: deploy-production
    if: github.ref_name == 'main' && needs.deploy-production.result == 'success'
    name: Close issues deployed to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 閉じられなくてもデプロイは成功として扱う。
    # issue の開閉は運用の都合であり、本番の稼働とは独立している。
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 直前のリリース範囲を見るため履歴が要る
          fetch-depth: 0

      - name: 本番へ反映されたPRから issue を解決して閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          sys.path.insert(0, ".github/scripts")
          from resolve_deployed_issues import extract_pr_numbers, resolve_issues

          REPO = os.environ["GH_REPO"]

          def gh(args):
              r = subprocess.run(["gh", *args, "--repo", REPO],
                                 capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else ""

          # 直近のリリースマージ（HEAD）に含まれるコミット題名を集める。
          # 1つ前のmainのコミットとの差分を取る。
          subjects = subprocess.run(
              ["git", "log", "--format=%s", "HEAD~1..HEAD", "--no-merges"],
              capture_output=True, text=True).stdout.splitlines()
          if not subjects:
              # マージコミット自体しか無い場合は、マージした側の履歴を辿る
              subjects = subprocess.run(
                  ["git", "log", "--format=%s", "HEAD^1..HEAD^2"],
                  capture_output=True, text=True).stdout.splitlines()

          prs = extract_pr_numbers(subjects)
          print(f"コミット {len(subjects)} 件から 元PR {len(prs)} 件を検出")

          def body_of(pr):
              return gh(["pr", "view", str(pr), "--json", "body", "-q", ".body"])

          def commits_of(pr):
              return gh(["pr", "view", str(pr), "--json", "commits",
                         "-q", "[.commits[].messageHeadline]|.[]"]).splitlines()

          # 本文に close キーワードが無いPRは1段掘る。release→main が squash
          # マージだと範囲にはリリースPR1件しか現れず、各 feature PR の
          # Closes #N まで届かないため(詳細は resolve_issues のコメント)。
          issues = resolve_issues(prs, body_of, commits_of)

          if not issues:
              print("閉じる対象の issue はありません。")
              sys.exit(0)

          closed, skipped, failed = 0, 0, 0
          for issue in sorted(issues):
              state = gh(["issue", "view", str(issue), "--json", "state", "-q", ".state"]).strip()
              if state != "OPEN":
                  print(f"  #{issue}: 既に {state or '取得不可'} のためスキップ")
                  skipped += 1
                  continue
              pr_list = ", ".join(f"#{p}" for p in issues[issue])
              r = subprocess.run(
                  ["gh", "issue", "close", str(issue), "--repo", REPO,
                   "--comment", f"本番へ反映されたため自動でクローズしました（{pr_list}）。"],
                  capture_output=True, text=True)
              if r.returncode == 0:
                  print(f"  #{issue}: クローズしました（{pr_list}）")
                  closed += 1
              else:
                  print(f"  #{issue}: クローズに失敗 {r.stderr.strip()[:120]}", file=sys.stderr)
                  failed += 1

          print(f"クローズ {closed} 件 / スキップ {skipped} 件 / 失敗 {failed} 件")
          PYEOF

  # PRイベント時の一時的な失敗や、プロモーションPRの課題キー解決漏れがあっても、
  # 本番Deploy成功後にBacklogの状態を「完了」へ補正する。
  # pr-to-backlog.yml の既存ロジック（中間PRを辿る再帰解決）を再利用し、
  # 各workflow_dispatchの完了まで待つことで、Deployジョブ成功だけを先に返さない。
  sync-backlog-after-deploy:
    needs: deploy-production
    if: github.ref_name == 'main' && needs.deploy-production.result == 'success'
    name: Sync Backlog statuses after production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Reconcile recently deployed PRs with Backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t prs < <(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state merged \
              --base main \
              --limit 20 \
              --json number \
              --jq '.[].number'
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "mainへマージ済みのPRがありません。"
            exit 0
          fi

          # gh run watch は監視中に GitHub API が 500 を返すとその場で落ちる。
          # 2026-10-08 の本番デプロイがこれで failure になった（同期ワークフロー
          # 自体は起動も完了もしていた）。デプロイ本体が終わったあとの後処理で、
          # API の一時障害のためにデプロイ全体が赤くなるのは割に合わない。
          #
          # watch を数回やり直し、それでも読めなければ結果だけ問い合わせる。
          # 結果が読めなかった場合は警告にとどめて続行し、失敗が確定した場合だけ
          # ジョブを失敗させる。conclusion が空のときは API 障害のほか、run が実行中
          # のこともあり区別できない。実行中だった run がのちに失敗しても、このジョブ
          # では検知できない（警告の run を後から確認する）。
          # 1件ずつ起動して完了を待つと、20件で15分のタイムアウトを超える
          # （2026-10-19・10-30・10-31 のデプロイが cancelled になった）。
          # 先に全部起動してから、順に結果を待つ。同期ワークフロー同士は独立している。
          run_ids=()
          run_prs=()
          for pr in "${prs[@]}"; do
            echo "Backlog同期を起動します: PR #$pr"
            run_url="$(gh workflow run pr-to-backlog.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f pr_number="$pr")"
            run_ids+=("${run_url##*/}")
            run_prs+=("$pr")
          done

          unreadable=()
          for i in "${!run_ids[@]}"; do
            run_id="${run_ids[$i]}"
            pr="${run_prs[$i]}"
            echo "Backlog同期の完了を待ちます: PR #$pr / run $run_id"

            watched=0
            for attempt in 1 2 3; do
              if gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status; then
                watched=1
                break
              fi
              echo "run watch が失敗しました（$attempt 回目）。10秒後にやり直します: run $run_id" >&2
              sleep 10
            done

            if [ "$watched" != "1" ]; then
              # watch が通らなくても、run の結果そのものは取れることが多い。
              conclusion="$(gh run view "$run_id" --repo "${{ github.repository }}" \
                --json conclusion --jq '.conclusion' 2>/dev/null || echo "")"
              echo "run watch を諦め、結果を直接確認しました: ${conclusion:-取得できず}" >&2
              if [ -z "$conclusion" ]; then
                # 結果が読めなかっただけ（同期が失敗したとは限らない）。デプロイは
                # 成功しているので赤くせず、後から確認できるよう run を控えておく。
                echo "::warning::Backlog同期の結果を確認できませんでした（取得失敗または実行中）: PR #$pr / run $run_id"
                unreadable+=("PR #$pr / run $run_id")
              elif [ "$conclusion" != "success" ]; then
                echo "Backlog同期が成功していません: PR #$pr / run $run_id ($conclusion)" >&2
                exit 1
              fi
            fi
          done

          if [ "${#unreadable[@]}" -gt 0 ]; then
            for u in "${unreadable[@]}"; do
              echo "::warning::結果未確認の同期run（Actionsで確認し、必要なら pr-to-backlog.yml を再実行してください）: $u"
            done
          fi

  # developへのマージPRもstagingでは即時確認できるようにする（本番には反映しない）。
  # pr_numberでべき等のため、後日releaseブランチ経由でmainへ入った際に
  # sync-whats-new(main)が別途取り込んでも問題ない。ただしmain側のマージPR番号は
  # develop側の個別PR番号とは別物になるため、同一変更が粒度違いで2件表示される
  # ことがある（許容: 実害は軽微、必要になれば重複排除を後日検討）。
  sync-whats-new-develop:
    needs: deploy-staging
    if: github.ref_name == 'develop' && always() && needs.deploy-staging.result == 'success'
    name: Sync whats-new from merged PRs (develop → staging)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Fetch recently merged PRs (base develop) and ingest into staging
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}
          STAGING_API_BASE: https://${{ vars.STAGING_API_DOMAIN || 'api-stg.shukatsu-ai.jp' }}
        run: |
          # 未登録だと staging が停止中のとき警告だけで終わり、設定漏れに気づけない。
          if [ -z "$SERVICE_SECRET" ]; then
            echo "::error::リポジトリシークレット SERVICE_SECRET が未登録です。staging の service_secret_plain と同じ値を登録してください(#1158)"
            exit 1
          fi

          sources=$(gh pr list --repo "${{ github.repository }}" --state merged --base develop --limit 20 \
            --json number,title,body,mergedAt \
            --jq '[.[] | {pr_number: .number, title: .title, body: .body, merged_at: .mergedAt}]')

          # ペイロードは argv に乗せない。PR本文を含むと ARG_MAX を超え、
          # 「curl: Argument list too long」で curl 自体が起動しない。空の HTTP
          # コードが下の *) に落ちて「停止中の可能性」という無関係な警告に化け、
          # 本番・staging とも取り込みが黙って飛ぶ(60件で実際に踏んだ)。
          payload=$(mktemp)
          printf '{"sources": %s}' "$sources" > "$payload"

          # 「停止中で届かない」と「鍵が違う/未登録」は対処が別物。後者を握りつぶすと
          # リポジトリシークレット SERVICE_SECRET の設定漏れに気づけない。
          stg_resp=$(mktemp)
          stg_code=$(curl -s -o "$stg_resp" -w '%{http_code}' -X POST "$STAGING_API_BASE/api/admin/whats-new/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $SERVICE_SECRET" \
            -d @"$payload" \
            --max-time 60 || true)
          case "$stg_code" in
            2*) ;;
            401|403)
              echo "::error::stagingへの更新情報の取り込みが $stg_code で拒否されました。リポジトリシークレット SERVICE_SECRET が staging の値と一致していません"
              exit 1
              ;;
            503)
              # ALB の 503(停止中)と区別する。設定不備は本文で名乗る。
              if grep -q SERVICE_SECRET_NOT_CONFIGURED "$stg_resp"; then
                echo "::error::staging の SERVICE_SECRET が未設定です(503)。staging の terraform apply とデプロイ(.env の継ぎ足し)を確認してください"
                exit 1
              fi
              echo "::warning::stagingへの取り込みに失敗しました(HTTP 503 / 停止中の可能性)。スキップします。"
              ;;
            *)
              echo "::warning::stagingへの取り込みに失敗しました(HTTP $stg_code / 停止中の可能性)。スキップします。"
              ;;
          esac
