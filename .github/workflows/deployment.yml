name: Deploy

# develop -> staging（IAMロール無しEC2 + Docker Compose、SSHでpull/up）
# main    -> production（ECS on Fargate、展示会時起動。desired_countは変更しない）
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref_name == 'develop'
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    # staging-auto-stopジョブ(最大1時間スリープ)は別concurrency groupなので、
    # ここをジョブ単位にしないとワークフロー全体のrunが1時間ブロックされ、
    # 次のデプロイが開始できなくなる
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      # staging EC2上のdocker-compose.ymlはこのタグを固定で参照しているため、
      # SHAタグではなく固定タグにする（pull => 中身が更新される）
      IMAGE_TAG: staging
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 変更検知(git diff)で前回pushからの差分を見るためフル履歴を取得する
          fetch-depth: 0

      # Dockerfile/依存関係に変更が無いサービスまでビルド・ECRへpushしてしまうと、
      # ビルド時間とECRストレージの両方が無駄になる。前回push(github.event.before)
      # からの変更パスを見て、サービスごとにビルドが必要かどうかを判定する。
      # before が取れない場合(workflow_dispatch手動実行・force push直後等)は
      # 安全側に倒して全サービスをビルドする。
      - name: Detect changed services
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || \
             [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "before commit unavailable; building all services"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "rag=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD)
            echo "changed files:"
            echo "$CHANGED"
            echo "frontend=$(echo "$CHANGED" | grep -q '^frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "backend=$(echo "$CHANGED" | grep -q '^Backend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "rag=$(echo "$CHANGED" | grep -q '^rag/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # デプロイ後1時間で自動停止する運用のため、止まっていたら起動をキックする
      # (完了は待たない。この後のDockerビルド時間と起動時間を並行させるため)
      - name: Start staging infra if stopped
        run: |
          RDS_STATUS=$(aws rds describe-db-instances --db-instance-identifier ${PROJECT_NAME}-mysql \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "unknown")
          if [ "$RDS_STATUS" == "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier ${PROJECT_NAME}-mysql
          fi

          DESIRED=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "${PROJECT_NAME}-app" \
            --query 'AutoScalingGroups[0].DesiredCapacity' --output text 2>/dev/null || echo "0")
          if [ "$DESIRED" == "0" ]; then
            aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${PROJECT_NAME}-app" \
              --min-size 1 --desired-capacity 1
          fi

      # デプロイ中はASGのヘルスチェックによる置換を止める(#828)。
      # デプロイは稼働中インスタンス上で down → prune → pull → up を行い、
      # アプリが数分間停止する。インスタンスは既に InService なので
      # health_check_grace_period は効かず、ALB は30秒で unhealthy と判定する。
      # 止めないとデプロイ中にインスタンスが置換され、デプロイ自体が壊れる。
      #
      # HealthCheck も一緒に止める。ReplaceUnhealthy だけを止めても ASG は
      # ヘルス判定自体は続けており、一度 Unhealthy と記録したインスタンスは
      # ALB が healthy に戻っても Healthy へは戻らない。結果 Resume した瞬間に
      # 置換が走り、直後のスモークが起動途中の新インスタンスを叩いて落ちる。
      - name: Suspend ASG health check replacement
        run: |
          aws autoscaling suspend-processes \
            --auto-scaling-group-name "${PROJECT_NAME}-app" \
            --scaling-processes HealthCheck ReplaceUnhealthy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # レイヤーキャッシュはECRへ保存するtype=registryを使う(type=ghaはリポジトリ全体で
      # 10GB共有・LRU退避されるため、他イメージのビルドで頻繁に追い出されて無関係な変更でも
      # apt-get等の重いレイヤーから毎回リビルドされてしまう)。3イメージを並列ビルドする。
      # staging EC2はamd64（instance_type変更済み、旧t4g.small/ARM64からの移行に伴う）。
      #
      # --provenance=false: 既定のbuildxは1タグにつき image index + プラットフォーム
      # manifest + attestation の3件をECRへ積む。ECRのライフサイクルは manifest 単位で
      # 数えるため、この2件の余分が本番イメージの保持枠を食い潰していた（#1518）。
      # provenance は誰も参照していないので止める（ECRは staging と本番で共用）。
      - name: Build and push images (frontend/backend/rag-review, parallel)
        run: |
          set -e
          pids=()

          # NEXT_PUBLIC_* はビルド時にバンドルへ焼き込まれる。DSN を staging と本番で
          # 同じシークレットから渡すと、staging を有効化した瞬間に次の本番デプロイでも
          # 有効になってしまい、環境ごとに段階導入できない。シークレットを分ける。
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            (cd frontend && docker buildx build --platform linux/amd64 --provenance=false \
              --build-arg NODE_ENV=production \
              --build-arg NEXT_PUBLIC_BACKEND_URL=https://${{ vars.STAGING_API_DOMAIN || 'api-stg.shukatsu-ai.jp' }} \
              --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND_STAGING }} \
              --build-arg NEXT_PUBLIC_APP_ENV=staging \
              --build-arg NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }} \
              --cache-from type=registry,ref=$ECR_REGISTRY/soc-frontend:buildcache-staging \
              --cache-to type=registry,ref=$ECR_REGISTRY/soc-frontend:buildcache-staging,mode=max \
              -t $ECR_REGISTRY/soc-frontend:$IMAGE_TAG --push .) &
            pids+=($!)
          else
            echo "frontend unchanged, skip build/push"
          fi

          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            (cd Backend && docker buildx build --platform linux/amd64 --provenance=false \
              --cache-from type=registry,ref=$ECR_REGISTRY/soc-backend:buildcache-staging \
              --cache-to type=registry,ref=$ECR_REGISTRY/soc-backend:buildcache-staging,mode=max \
              -t $ECR_REGISTRY/soc-backend:$IMAGE_TAG --push .) &
            pids+=($!)
          else
            echo "backend unchanged, skip build/push"
          fi

          if [ "${{ steps.changes.outputs.rag }}" = "true" ]; then
            (cd rag && docker buildx build --platform linux/amd64 --provenance=false \
              --cache-from type=registry,ref=$ECR_REGISTRY/soc-rag-review:buildcache-staging \
              --cache-to type=registry,ref=$ECR_REGISTRY/soc-rag-review:buildcache-staging,mode=max \
              -t $ECR_REGISTRY/soc-rag-review:$IMAGE_TAG --push .) &
            pids+=($!)
          else
            echo "rag-review unchanged, skip build/push"
          fi

          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit $fail

      # ビルド中に裏で進めた起動を待ち合わせる（RDSは停止からだと最大10分程度かかる）。
      # 直前のauto-stopとレースして"stopping"の間は起動キックが素通りすることがあるため、
      # ここでも stopped を検知したら都度start-db-instanceを呼び直す（自己修復）。
      #
      # 待ち時間は20分。auto-stop の直後にデプロイが始まると
      #   stopping(数分) -> stopped -> start -> available(5〜10分)
      # を通ることになり、10分では足りずタイムアウトした実績がある。
      - name: Wait for staging infra ready
        run: |
          for i in $(seq 1 80); do
            STATUS=$(aws rds describe-db-instances --db-instance-identifier ${PROJECT_NAME}-mysql \
              --query 'DBInstances[0].DBInstanceStatus' --output text)
            [ "$STATUS" == "available" ] && break
            if [ "$STATUS" == "stopped" ]; then
              aws rds start-db-instance --db-instance-identifier ${PROJECT_NAME}-mysql || true
            fi
            echo "RDS status: $STATUS (waiting...)"
            sleep 15
          done
          if [ "$STATUS" != "available" ]; then
            echo "RDS did not become available in time" >&2
            exit 1
          fi

          for i in $(seq 1 20); do
            STATE=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${PROJECT_NAME}-app" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)
            [ "$STATE" == "running" ] && break
            echo "EC2 state: $STATE (waiting...)"
            sleep 15
          done
          if [ "$STATE" != "running" ]; then
            echo "staging instance did not become running in time" >&2
            exit 1
          fi

      # 先頭1台だけに配ってはいけない。ASGは負荷試験で最大3台まで増え、frontend は
      # ALB 配下の任意のインスタンスの backend を叩く。配り漏れた台に振られると
      # BFF_INTERNAL_TOKEN が未設定/旧値のままで X-Client-IP が捨てられ、
      # 全利用者が frontend の出口IP1つへ再集約される(#1407)。
      # 全 running インスタンスを列挙し、以降のSSH/SCPへカンマ区切りで渡す。
      - name: Resolve staging instance IPs
        id: instance
        run: |
          IPS=""
          IDS=""
          while read -r ID IP; do
            if [ -z "$IP" ] || [ "$IP" == "None" ]; then
              echo "WARN: $ID にパブリックIPが無いのでスキップします" >&2
              continue
            fi
            IPS="${IPS:+$IPS,}$IP"
            IDS="${IDS:+$IDS }$ID"
          done < <(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].[InstanceId,PublicIpAddress]' --output text)
          if [ -z "$IPS" ]; then
            echo "staging instance not found (ASG未起動、またはタグ不一致)" >&2
            exit 1
          fi
          echo "対象インスタンス: $IDS"
          echo "ips=$IPS" >> "$GITHUB_OUTPUT"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${PROJECT_NAME}-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      # GitHub Actionsランナーは固定IPを持たないため、SSHステップの前後だけ
      # ランナー自身のIPをSGへ動的に許可する（常時0.0.0.0/0で開けない）
      - name: Allow runner IP for SSH
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.instance.outputs.sg_id }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      # 新規起動直後はuser_data(docker/compose導入)完了前でSSHはできてもcomposeが
      # 無いことがあるため、ポート疎通だけでなく/opt/appの準備も待つ
      - name: Wait for instance SSH/docker-compose ready
        run: |
          for ip in $(echo "${{ steps.instance.outputs.ips }}" | tr ',' ' '); do
            for i in $(seq 1 20); do
              timeout 5 bash -c "cat < /dev/null > /dev/tcp/$ip/22" 2>/dev/null && break
              echo "waiting for SSH port ($ip)..."
              sleep 15
            done
          done

      - name: Sync edge nginx (503 時の OGP 付き静的 HTML)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.instance.outputs.ips }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          source: "infra/nginx/staging-edge.conf,infra/static/service-unavailable.html,infra/static/service-starting.html,infra/staging/ensure-edge-compose.sh"
          target: /tmp/edge-sync
          strip_components: 2

      - name: Deploy via SSH (docker compose pull && up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.instance.outputs.ips }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script_stop: true
          # 複数台のときは1台ずつ順番に流す(並列だと全台同時に compose down して全断する)
          sync: true
          script: |
            set -e
            sudo bash -c '
              for i in $(seq 1 20); do
                [ -f /opt/app/docker-compose.yml ] && command -v docker >/dev/null && break
                echo "waiting for user_data (docker/compose) to finish..."
                sleep 15
              done
              aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
              mkdir -p /opt/app/nginx/static
              cp /tmp/edge-sync/staging-edge.conf /opt/app/nginx/staging-edge.conf
              cp /tmp/edge-sync/service-unavailable.html /opt/app/nginx/static/service-unavailable.html
              cp /tmp/edge-sync/service-starting.html /opt/app/nginx/static/service-starting.html
              chmod +x /tmp/edge-sync/ensure-edge-compose.sh
              /tmp/edge-sync/ensure-edge-compose.sh /opt/app/docker-compose.yml
              cd /opt/app
              # 既存インスタンスの .env は S3_BUCKET のみ。アプリは AWS_S3_BUCKET を読む。
              if [ -f .env ] && grep -q '^S3_BUCKET=' .env && ! grep -q '^AWS_S3_BUCKET=' .env; then
                echo "AWS_S3_BUCKET=$(grep '^S3_BUCKET=' .env | cut -d= -f2-)" >> .env
              fi
              # 実クライアントIP転送の2変数(#1407)。user_data は新規インスタンスでしか
              # 走らず、ASG は version=$Latest なので LT を更新しても既存インスタンスは
              # 置換されない。無ければここで足さないと、稼働中のstagingは転送が無効のまま
              # 全利用者が同じ出口IPでレート制限される。
              #
              # トークンはこの場で生成してはいけない。frontend は ALB 配下の任意の
              # インスタンスの backend を叩くため、インスタンス毎に違う値になると
              # 検証に失敗して X-Client-IP が捨てられる（負荷試験でASGが3台まで増えると顕在化）。
              # terraform が作った SSM パラメータ(= user_data が新規インスタンスへ配るのと
              # 同じ値)を読み、既存の値があっても上書きして全台を揃える。
              BFF_TOKEN=$(aws ssm get-parameter --region ${{ env.AWS_REGION }} --name /${{ env.PROJECT_NAME }}/bff-internal-token --query Parameter.Value --output text 2>/dev/null || true)
              if [ -n "$BFF_TOKEN" ] && [ "$BFF_TOKEN" != None ]; then
                if [ -f .env ]; then
                  sed -i /^BFF_INTERNAL_TOKEN=/d .env
                  echo BFF_INTERNAL_TOKEN=$BFF_TOKEN >> .env
                fi
              else
                # 新規インスタンスは user_data が同じ値を既に書いているので .env は触らない。
                # 黙って進むと不一致に気付けないため、理由をログへ残す。
                echo "WARN: SSM /${{ env.PROJECT_NAME }}/bff-internal-token を読めませんでした（terraform apply 未実施の可能性）。.env は変更しません" >&2
              fi
              # staging は常に ALB -> edge nginx -> frontend の2段(terraform と同値)
              if [ -f .env ] && ! grep -q ^TRUSTED_PROXY_HOPS= .env; then
                echo TRUSTED_PROXY_HOPS=2 >> .env
              fi
              df -h /
              # 稼働中イメージは prune できない。先に down してから空ける。
              # named volume(chroma_data)は --volumes を付けない限り残る。
              docker compose down --remove-orphans || true
              docker system prune -af
              docker compose pull
              docker compose up -d
              df -h /
              # up -d の直後はまだ running になっていないことがある。特に新規インスタンスの
              # 初回起動(イメージpull+ネットワーク/ボリューム作成から)は遅く、即座に判定すると
              # 起動しているのに "is not running" で落ちる。最大60秒待つ。
              for s in frontend backend edge; do
                for _ in $(seq 1 20); do
                  docker compose ps --status running --services | grep -qx "$s" && break
                  sleep 3
                done
                docker compose ps --status running --services | grep -qx "$s" || {
                  echo "service $s is not running" >&2
                  docker compose ps -a
                  docker compose logs --tail 50 "$s" || true
                  exit 1
                }
              done

              # DBマイグレーション適用(#618)。backend起動直後はDB接続が間に合わない
              # ことがあるためリトライする。
              MIGRATE_OK=0
              for i in $(seq 1 10); do
                docker compose exec -T backend /bin/migrate up && { MIGRATE_OK=1; break; }
                echo "migrate retry ($i)..."
                sleep 5
              done
              if [ "$MIGRATE_OK" != "1" ]; then
                echo "migration failed" >&2
                exit 1
              fi
            '

      - name: Revoke runner IP for SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.instance.outputs.sg_id }} \
            --protocol tcp --port 22 --cidr "${{ env.runner_ip }}/32" || true

      # デプロイ中の docker compose down で ALB は30秒でこのインスタンスを
      # unhealthy と判定する。Suspend が止めるのは「置換」だけで判定自体は残るため、
      # healthy に戻る前に Resume するとその場でインスタンスが置換される。
      # 直後のスモークが起動途中の新インスタンスを叩いて必ず落ちるので、
      # 先に in-service を待つ。
      - name: Wait for ALB targets healthy
        run: |
          for name in be fe; do
            TG=$(aws elbv2 describe-target-groups --names "${PROJECT_NAME}-$name-tg" \
              --query 'TargetGroups[0].TargetGroupArn' --output text)
            TARGETS=""
            for id in ${{ steps.instance.outputs.ids }}; do
              TARGETS="$TARGETS Id=$id"
            done
            # shellcheck disable=SC2086
            aws elbv2 wait target-in-service --target-group-arn "$TG" --targets $TARGETS
          done

      # 失敗しても必ず戻す。停止したままだと、以後アプリが落ちても
      # ASGが置換しなくなり ELB ヘルスチェックにした意味が無くなる。
      - name: Resume ASG health check replacement
        if: always()
        run: |
          aws autoscaling resume-processes \
            --auto-scaling-group-name "${PROJECT_NAME}-app" \
            --scaling-processes HealthCheck ReplaceUnhealthy || true

  deploy-staging-smoke:
    needs: deploy-staging
    if: github.ref_name == 'develop' && success()
    uses: ./.github/workflows/deploy-smoke.yml
    with:
      environment: staging
    secrets: inherit

  # Discord Interactions Endpoint の受け口(Lambda)。
  #
  # deploy-staging には依存させない。この受け口を staging から Lambda へ移したのは
  # 「staging が止まっていても /prod を受けられるようにする」ためで、staging の
  # デプロイ結果に更新が引きずられては意味が無い。
  #
  # 関数の箱と環境変数は terraform 側(infra/terraform/environments/staging/
  # discord_lambda.tf)が持ち、ここではコードだけ差し替える。
  deploy-discord-lambda:
    if: github.ref_name == 'develop'
    name: Deploy Discord Lambda
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-discord-lambda
      cancel-in-progress: true

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      FUNCTION_NAME: ${{ vars.PROJECT_NAME || 'soc-stg' }}-discord

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ./Backend/go.mod
          cache-dependency-path: ./Backend/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and deploy
        working-directory: ./Backend
        run: |
          set -e
          # provided.al2023 のカスタムランタイムは bootstrap という名前の実行ファイルを探す。
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o bootstrap ./cmd/discord-lambda
          zip -j discord-lambda.zip bootstrap

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://discord-lambda.zip \
            --query 'LastUpdateStatus' --output text

          # 更新の反映を待たずに次のリクエストが来ると、古いコードで応答することがある。
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "$FUNCTION_NAME を更新しました"

  # デプロイから1時間、新たなデプロイが無ければstagingを自動停止する（コスト削減）。
  # 1時間以内に次のdeploy-staging(→本ジョブ)が走ると、同じconcurrency groupで
  # 前回分がキャンセルされ、実質タイマーがリセットされる。
  staging-auto-stop:
    needs: deploy-staging
    if: github.ref_name == 'develop'
    name: Auto-stop staging after 1h
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-auto-stop
      cancel-in-progress: true

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait 1 hour (cancelled if a new deploy arrives)
        run: sleep 3600

      - name: Stop staging infra (EC2 + RDS)
        run: |
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${PROJECT_NAME}-app" \
            --min-size 0 --desired-capacity 0
          aws rds stop-db-instance --db-instance-identifier ${PROJECT_NAME}-mysql || true

  deploy-production:
    if: github.ref_name == 'main'
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    # checkout と Notify Discord release の gh pr 参照に必要な分だけ与える。
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
      # ECSクラスタ名・タスク定義family接頭辞はともにTerraformのproject_name（既定soc-app）由来
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 変更検知(git diff)で前回pushからの差分を見るためフル履歴を取得する
          fetch-depth: 0

      # Dockerfile/依存関係に変更が無いサービスまでビルド・ECRへpushしてしまうと、
      # ビルド時間とECRストレージの両方が無駄になる。前回push(github.event.before)
      # からの変更パスを見て、サービスごとにビルド・デプロイが必要かどうかを判定する。
      # before が取れない場合(workflow_dispatch手動実行・force push直後等)は
      # 安全側に倒して全サービスをビルド・デプロイする。
      - name: Detect changed services
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || \
             [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "before commit unavailable; building all services"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "rag=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD)
            echo "changed files:"
            echo "$CHANGED"
            echo "frontend=$(echo "$CHANGED" | grep -q '^frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "backend=$(echo "$CHANGED" | grep -q '^Backend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "rag=$(echo "$CHANGED" | grep -q '^rag/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      # スモーク(Playwright)の準備は「本番AWS認証情報を入れる前」に済ませる。
      # このジョブの認証情報は ECS/RDS/ECR を操作できる長期キーで、
      # configure-aws-credentials 以降はジョブ全体の環境変数として残る。
      # そのあとで npm ci を走らせると、依存パッケージの install/postinstall
      # スクリプトからその認証情報とECRのDocker認証を読めてしまう。
      # 侵害された推移的依存1つで本番を触られるため、認証より前に置く。
      #
      # 本番を起動する前に終わらせる意味もある（npm ci とブラウザ取得で数分かかり、
      # 起動後にやるとその分だけ停止日の一時起動が延びる）。
      - name: Set up Node.js (smoke)
        uses: actions/setup-node@v7
        with:
          node-version-file: ./frontend/.nvmrc
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install smoke test dependencies
        working-directory: ./frontend
        # ハングしたまま既定上限(6時間)まで concurrency と起動済みRDSを占有しないよう
        # 上限を切る。ジョブ全体ではなくステップに付けるのは、ジョブのタイムアウトだと
        # 後段の always()（desired=0 へ戻す / RDS停止）まで打ち切られ、
        # 停止日の本番が起動したまま残るため（deploy-smoke.yml の15分と同水準）。
        timeout-minutes: 15
        # --with-deps は内部で apt-get update を実行し、ミラーへの接続がハングして
        # タイムアウトまで進まない事象が頻発したため外す（deploy-smoke.yml と同じ）。
        run: |
          npm ci
          npx playwright install chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # レイヤーキャッシュはECRへ保存するtype=registryを使う(type=ghaはリポジトリ全体で
      # 10GB共有・LRU退避されるため、他イメージのビルドで頻繁に追い出されて無関係な変更でも
      # apt-get等の重いレイヤーから毎回リビルドされてしまう)。3イメージを並列ビルドする
      # --provenance=false の理由は staging 側のビルドステップのコメントを参照（#1518）。
      - name: Build and push images (frontend/backend/rag-review, parallel)
        run: |
          set -e
          pids=()

          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            (cd frontend && docker buildx build --platform linux/amd64 --provenance=false \
              --build-arg NODE_ENV=production \
              --build-arg NEXT_PUBLIC_BACKEND_URL=https://${{ vars.PROD_API_DOMAIN || 'api.shukatsu-ai.jp' }} \
              --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND_PROD }} \
              --build-arg NEXT_PUBLIC_APP_ENV=production \
              --build-arg NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }} \
              --cache-from type=registry,ref=$ECR_REGISTRY/soc-frontend:buildcache-production \
              --cache-to type=registry,ref=$ECR_REGISTRY/soc-frontend:buildcache-production,mode=max \
              -t $ECR_REGISTRY/soc-frontend:$IMAGE_TAG --push .) &
            pids+=($!)
          else
            echo "frontend unchanged, skip build/push"
          fi

          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            (cd Backend && docker buildx build --platform linux/amd64 --provenance=false \
              --cache-from type=registry,ref=$ECR_REGISTRY/soc-backend:buildcache-production \
              --cache-to type=registry,ref=$ECR_REGISTRY/soc-backend:buildcache-production,mode=max \
              -t $ECR_REGISTRY/soc-backend:$IMAGE_TAG --push .) &
            pids+=($!)
          else
            echo "backend unchanged, skip build/push"
          fi

          if [ "${{ steps.changes.outputs.rag }}" = "true" ]; then
            (cd rag && docker buildx build --platform linux/amd64 --provenance=false \
              --cache-from type=registry,ref=$ECR_REGISTRY/soc-rag-review:buildcache-production \
              --cache-to type=registry,ref=$ECR_REGISTRY/soc-rag-review:buildcache-production,mode=max \
              -t $ECR_REGISTRY/soc-rag-review:$IMAGE_TAG --push .) &
            pids+=($!)
          else
            echo "rag-review unchanged, skip build/push"
          fi

          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit $fail

      # ECS Fargateのタスク定義はTerraformが管理する。CIはTerraform applyを
      # 行わず、現在のタスク定義のimageだけ差し替えて新リビジョンを登録する
      # （実行/タスクロールのIAM操作が不要なため、デプロイ用の最小権限で完結する）。
      - name: Fetch current backend task definition
        if: steps.changes.outputs.backend == 'true'
        run: |
          aws ecs describe-task-definition --task-definition "${PROJECT_NAME}-backend" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > backend-task-def.json

      - name: Render backend task definition
        if: steps.changes.outputs.backend == 'true'
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: soc-backend
          image: ${{ env.ECR_REGISTRY }}/soc-backend:${{ env.IMAGE_TAG }}

      # DBマイグレーション適用(#618)。新イメージのタスク定義を先に登録し、
      # backendサービスと同じネットワーク設定でワンオフタスクとしてmigrateを
      # 実行する。失敗したらここでジョブを止め、サービスは更新しない。
      - name: Register backend task definition (for migration)
        if: steps.changes.outputs.backend == 'true'
        id: register-backend
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-backend.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      # 本番は「指定日のみ終日起動」ポリシー(prod-uptime-scheduler)のため、通常日はRDSが停止している。
      # 停止中はマイグレーションがDBへ到達できず必ず失敗する(実際に #1488 のデプロイが
      # "no route to host" で落ちた)ので、この工程だけ一時的にRDSを起動する。
      # ECSサービスは起動しない。desired=0 のままでもタスク定義の差し替えは反映され、
      # 稼働日にスケジューラが立ち上げた時点で新しい定義が使われる。ここでECSまで上げると
      # 毎時5分のスケジューラが desired=0 に戻すため、起動と停止の往復になる。
      # ponytail: prod-uptime-scheduler との排他は未実装。毎時5分の実行と重なると
      # マイグレーション中にRDSを停止されうる（その場合はデプロイが失敗するので再実行する）。
      # 起動待ちループは stopped を見るたびに start を打ち直すため、起動段階では自己修復する。
      # 実運用で再実行が続くようなら、SSM にメンテナンスフラグを置いて相互に見る形へ上げる。
      # 本番が停止状態(全サービス desired=0)だったかを先に記録する。
      # 停止日にデプロイした場合だけ、検証のために一時起動して、終わったら0へ戻す。
      - name: Record production service state
        id: prod-svc
        run: |
          set -uo pipefail
          # 取得失敗を「停止中」に倒さない。`|| echo "0"` で 0 に化けると、稼働中の
          # 本番を was_down=true と記録し、後段の always() クリーンアップが
          # 全サービスを停止する。スロットリングや一時的な通信障害で起こりうる。
          if ! DESIRED_TOTAL=$(aws ecs describe-services --cluster "${PROJECT_NAME}" \
            --services chroma rag-review backend frontend \
            --query 'sum(services[].desiredCount)' --output text); then
            echo "::error::本番サービスの状態を取得できませんでした。起動状態が不明なままでは停止判断ができないため中断します" >&2
            exit 1
          fi
          if [ -z "$DESIRED_TOTAL" ] || [ "$DESIRED_TOTAL" = "None" ]; then
            echo "::error::本番サービスの desired_count を取得できませんでした(値='$DESIRED_TOTAL')" >&2
            exit 1
          fi

          # デプロイ中に /prod で運用指示が変わったかを後で見るため、開始時点の値を控える。
          # 読めなかった場合は空にしておき、復元時は「変わっていない」とは見なさない。
          OVERRIDE_AT_START=$(aws ssm get-parameter --name "/${PROJECT_NAME}/prod-uptime-override" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "__unreadable__")
          echo "override_at_start=$OVERRIDE_AT_START" >> "$GITHUB_OUTPUT"

          if [ "$DESIRED_TOTAL" = "0" ]; then
            echo "本番は停止状態。デプロイ後に一時起動して確認する (override=$OVERRIDE_AT_START)"
            echo "was_down=true" >> "$GITHUB_OUTPUT"
          else
            echo "本番は稼働中(desired合計=$DESIRED_TOTAL)。起動状態には触らない"
            echo "was_down=false" >> "$GITHUB_OUTPUT"
          fi

      # backend を変更していなくても、停止日の一時検証では backend を含む全サービスを
      # 起動する(prod-scale.sh)。RDS が停止のままだと backend は DB 接続に失敗して
      # 終了し、安定待ちは変更サービスだけを見るため「起動できないまま検証成功」になる。
      - name: Start production RDS if stopped (for migration)
        if: steps.changes.outputs.backend == 'true' || steps.prod-svc.outputs.was_down == 'true'
        id: prod-db
        run: |
          DB_ID="${PROJECT_NAME}-mysql"
          started=false
          # stopping(数分) -> stopped -> start -> starting -> available で最大10分程度かかる。
          for _ in $(seq 1 40); do
            STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
              --query 'DBInstances[0].DBInstanceStatus' --output text)
            if [ "$STATUS" = "available" ]; then
              echo "RDS available (started_by_deploy=$started)"
              if [ "$started" = "false" ]; then echo "started_by_deploy=false" >> "$GITHUB_OUTPUT"; fi
              exit 0
            fi
            # stopped を見るたびに start を打ち直す。prod-uptime-scheduler が
            # 毎時5分に desired=0 を見て停止しうるため、1回きりだと再起動されず
            # このループがタイムアウトする。start が成功したときだけ所有フラグを立て、
            # スロットリング等で失敗した回は false のままにして次のループで再試行する。
            if [ "$STATUS" = "stopped" ]; then
              if aws rds start-db-instance --db-instance-identifier "$DB_ID" > /dev/null; then
                if [ "$started" = "false" ]; then
                  started=true
                  # available を待てずタイムアウトしても起動しっぱなしにしないよう、
                  # ここで出力しておく（後段の停止ステップが拾う）。
                  echo "started_by_deploy=true" >> "$GITHUB_OUTPUT"
                fi
              else
                echo "start-db-instance に失敗。次のループで再試行する" >&2
              fi
            fi
            echo "RDS status: $STATUS (waiting...)"
            sleep 30
          done
          echo "RDS did not become available in time" >&2
          exit 1

      - name: Run DB migration (production)
        if: steps.changes.outputs.backend == 'true'
        id: migrate
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services --cluster "${PROJECT_NAME}" --services backend \
            --query 'services[0].networkConfiguration' --output json)
          TASK_ARN=$(aws ecs run-task \
            --cluster "${PROJECT_NAME}" \
            --task-definition "${{ steps.register-backend.outputs.task_def_arn }}" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"soc-backend","command":["/bin/migrate","up"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          # 後段のRDS停止が「タスクが本当に止まったか」を確認できるようにARNを残す。
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          aws ecs wait tasks-stopped --cluster "${PROJECT_NAME}" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "${PROJECT_NAME}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed (exit code: $EXIT_CODE)" >&2
            aws ecs describe-tasks --cluster "${PROJECT_NAME}" --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[0].reason' --output text >&2
            exit 1
          fi
          echo "✓ Migration applied successfully"

      - name: Deploy backend service
        if: steps.changes.outputs.backend == 'true'
        # 後段の「ECRにイメージが在るか」検査で、サーキットブレーカーに戻された場合の
        # 復帰先として今回登録したリビジョンを使う（#1518）。
        id: deploy-backend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: backend
          cluster: ${{ env.PROJECT_NAME }}
          # 3サービスを同時に走らせ、安定待ちは後段でまとめて行う（直列だと合計待ちが積み上がる）
          wait-for-service-stability: false

      - name: Fetch current frontend task definition
        if: steps.changes.outputs.frontend == 'true'
        run: |
          aws ecs describe-task-definition --task-definition "${PROJECT_NAME}-frontend" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > frontend-task-def.json

      - name: Render frontend task definition
        if: steps.changes.outputs.frontend == 'true'
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: soc-frontend
          image: ${{ env.ECR_REGISTRY }}/soc-frontend:${{ env.IMAGE_TAG }}

      - name: Deploy frontend service
        if: steps.changes.outputs.frontend == 'true'
        id: deploy-frontend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: frontend
          cluster: ${{ env.PROJECT_NAME }}
          # 3サービスを同時に走らせ、安定待ちは後段でまとめて行う（直列だと合計待ちが積み上がる）
          wait-for-service-stability: false

      # rag-reviewはchroma(ベクトルDB)とのサイドカー構成で、DBを持たないため
      # マイグレーション相当のステップは無い。差し替えるのはrag-reviewコンテナの
      # イメージのみで、chromaコンテナはタスク定義上そのまま維持される。
      - name: Fetch current rag-review task definition
        if: steps.changes.outputs.rag == 'true'
        run: |
          aws ecs describe-task-definition --task-definition "${PROJECT_NAME}-rag-review" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > rag-review-task-def.json

      - name: Render rag-review task definition
        if: steps.changes.outputs.rag == 'true'
        id: render-rag-review
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: rag-review-task-def.json
          container-name: rag-review
          image: ${{ env.ECR_REGISTRY }}/soc-rag-review:${{ env.IMAGE_TAG }}

      - name: Deploy rag-review service
        if: steps.changes.outputs.rag == 'true'
        id: deploy-rag-review
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-rag-review.outputs.task-definition }}
          service: rag-review
          cluster: ${{ env.PROJECT_NAME }}
          # 3サービスを同時に走らせ、安定待ちは後段でまとめて行う（直列だと合計待ちが積み上がる）
          wait-for-service-stability: false

      # backend/frontend/rag-review全てのECSデプロイが安定するまで待った後(=本番反映が実際に完了した後)に通知する。
      # DISCORD_RELEASE_WEBHOOK_URL未設定でもデプロイ自体は失敗させない(automation/deploy-smoke/notify-discord.shと同じ方針)。
      # 直列に待つと 588s + 302s + 88s と積み上がるため、3サービスの安定待ちを並列化する。
      # 二重稼働は発生しない（デプロイ方式は従来どおり minimumHealthyPercent=0 のまま）。
      # 停止日のデプロイでは、新しいタスク定義が実際に起動するかをここで確認する。
      # 確認できないまま稼働日を迎えると、展示会当日に起動しないイメージが出てくる。
      # 後段で必ず0へ戻すため、立ち上がっているのはこのジョブの間だけ。
      # 変更のあったサービスだけを起動しても確認にならない。rag-review は chroma が居ないと
      # ヘルスチェックが503を返し、backend も RAG を同期で呼ぶ。本番と同じ組み合わせで起動する。
      # desired と min_capacity を揃えるのも必須（揃えないとターゲット追跡が0へ縮退する）。
      # 起動できたかの先は Playwright スモーク（後段）で画面とAPIまで見る。
      - name: Start production services for verification
        if: steps.prod-svc.outputs.was_down == 'true'
        run: ./automation/ops/prod-scale.sh 1

      - name: Wait for services to stabilize (parallel)
        run: |
          set -e
          # 一時起動した場合は、変更の有無に関わらず起動した全サービス(chroma込み)を待つ。
          # 変更のあったサービスだけ待つと、ドキュメント/Terraformのみのデプロイや
          # backend だけの変更で frontend が cold start 中のままスモークが走り、
          # 503 や接続失敗で正常なデプロイが失敗扱いになる。
          # prod-scale.sh が起動する対象と同じ並びにする（片方だけ増えると待ち漏れる）。
          if [ "${{ steps.prod-svc.outputs.was_down }}" = "true" ]; then
            services="chroma rag-review backend frontend"
          else
            services=""
            if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then services="$services backend"; fi
            if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then services="$services frontend"; fi
            if [ "${{ steps.changes.outputs.rag }}" = "true" ]; then services="$services rag-review"; fi
          fi
          if [ -z "$services" ]; then
            echo "no service deployed; nothing to wait for"
            exit 0
          fi

          pids=()
          for s in $services; do
            (
              started=$(date +%s)
              aws ecs wait services-stable --cluster "$PROJECT_NAME" --services "$s"
              echo "$s stable in $(( $(date +%s) - started ))s"
            ) &
            pids+=($!)
          done

          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "one or more services did not reach a stable state" >&2
          fi
          exit $fail

      # 本番の反映確認を人の目視に頼らないようにする。ECSの安定待ちは「タスクが立った」
      # までしか見ておらず、画面が出ているか・APIが応答するかは分からない。
      #
      # 停止日は後段で desired=0 へ戻すため、スモークはこの一時起動の最中でなければ
      # 実行できない。deploy-smoke.yml（workflow_call）は同じ concurrency group
      # `deploy-production` を使うので、このジョブが走っている間は開始できず、
      # ここから呼ぶとデッドロックする。そのため設定ファイル
      # (playwright.smoke.config.ts) と通知スクリプトは共用したまま、実行だけを
      # このジョブ内で行う。staging 側は従来どおり deploy-smoke.yml を使う。
      - name: Run Playwright smoke (production)
        id: smoke
        working-directory: ./frontend
        # インストールと同じ理由でステップ側に上限を置く（ジョブ側だと always() の
        # 後片付けまで打ち切られる）。deploy-smoke.yml のスモークジョブと同水準。
        timeout-minutes: 15
        env:
          CI: true
          # スモークは公開URLしか見ない。node_modules 由来のコードに本番AWS認証を
          # 渡さないため、このステップでは空にして上書きする（configure-aws-credentials
          # はジョブ全体の環境変数として認証情報を残す）。
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          PLAYWRIGHT_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://shukatsu-ai.jp' }}
          PLAYWRIGHT_API_BASE_URL: ${{ vars.PROD_API_BASE_URL || 'https://api.shukatsu-ai.jp' }}
        run: npx playwright test --config=playwright.smoke.config.ts

      - name: Upload Playwright report
        if: always() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: frontend/playwright-report/
          retention-days: 7

      # 通知は deploy-smoke.yml と同じスクリプトを使う（文面・メンション解決を二重に持たない）。
      # スモークを実行していない場合（安定待ちで落ちた等）は鳴らさない。`!= 'skipped'` ではなく
      # success/failure を明示するのは、実行されなかったステップの outcome を空文字で
      # 受け取った場合でも「失敗」を送りつけないため。
      - name: Notify Discord (production smoke)
        if: always() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure')
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          STATUS=failure
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            STATUS=success
          fi
          chmod +x automation/deploy-smoke/notify-discord.sh
          automation/deploy-smoke/notify-discord.sh \
            "$STATUS" \
            "production" \
            "${{ vars.PROD_BASE_URL || 'https://shukatsu-ai.jp' }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.actor }}"

      # ECSのデプロイサーキットブレーカーは失敗すると「直前の安定デプロイ」へ戻すが、
      # そのタスク定義のイメージがECRに残っているかは見ない。2026-09-25 はそれで
      # backend が起動不能なリビジョン(:86)を指したまま残った(#1518)。
      # 停止日は desired=0 なので誰も気づけず、次の稼働日に本番が上がらない。
      #
      # 失敗した経路でも必ず通す(always)。イメージが無ければ今回のリビジョンへ戻し、
      # そのうえでジョブは失敗させる(黙って直すと「ロールバックが起きた」事実が消える)。
      - name: Verify task definition images exist in ECR
        if: always()
        run: |
          ./automation/ops/verify-task-def-images.sh \
            "backend=${{ steps.deploy-backend.outputs.task-definition-arn }}" \
            "frontend=${{ steps.deploy-frontend.outputs.task-definition-arn }}" \
            "rag-review=${{ steps.deploy-rag-review.outputs.task-definition-arn }}" \
            "chroma="

      # merge commit 件名（Merge pull request #N）ではなく、マージPRのタイトル
      # （Release to production: ...）と本文の機能一覧を通知に使う。
      # 確認が済んだ（または失敗した）ら0へ戻す。always() が無いと、
      # 安定待ちで落ちたときにタスクが起動したまま課金され続ける。
      #
      # ただし「開始時に停止していた」だけで機械的に落とすと、デプロイ中に
      # /prod on やスケジューラが本番を起動した場合にそれを打ち消してしまう。
      # deployment.yml と prod-uptime-scheduler.yml は concurrency group が別で
      # 排他されないため、次の毎時実行まで本番が落ちたままになりうる。
      # 復元前に運用指示を読み直し、起動すべき状態なら触らない。
      - name: Scale production services back to zero
        if: always() && steps.prod-svc.outputs.was_down == 'true'
        run: |
          set -uo pipefail
          TODAY_JST=$(TZ=Asia/Tokyo date +%F)

          OVERRIDE_NOW=$(aws ssm get-parameter --name "/${PROJECT_NAME}/prod-uptime-override" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "__unreadable__")
          OVERRIDE_AT_START="${{ steps.prod-svc.outputs.override_at_start }}"
          if [ "$OVERRIDE_NOW" != "$OVERRIDE_AT_START" ]; then
            echo "デプロイ中に運用指示が変わった($OVERRIDE_AT_START -> $OVERRIDE_NOW)ため、起動状態には触らない"
            exit 0
          fi
          if [ "$OVERRIDE_NOW" = "__unreadable__" ]; then
            echo "運用指示(override)を読めないため、起動状態には触らない。停止は prod-uptime-scheduler に任せる" >&2
            exit 0
          fi
          # /prod on は日付リストを無視して起動させる指示。日付リストに今日が無くても止めない。
          # ここを見落とすと、手動で起動させた本番をデプロイが落とす。
          if [ "${OVERRIDE_NOW%%:*}" = "on" ]; then
            echo "override=$OVERRIDE_NOW（起動指示）のため、起動状態には触らない"
            exit 0
          fi

          # 日付リストは JST の暦日で判定する。デプロイが日付をまたぐと、
          # 開始時は停止日でも終了時には起動日になっていることがある。
          DATES=$(aws ssm get-parameter --name "/${PROJECT_NAME}/prod-uptime-dates" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if echo ",$DATES," | grep -q ",$TODAY_JST,"; then
            echo "今日($TODAY_JST)は起動日になっているため、起動状態には触らない"
            exit 0
          fi

          ./automation/ops/prod-scale.sh 0

      # デプロイが終わったら、このデプロイが起動したRDSは停止へ戻す。
      # 停止するのは「このデプロイが stopped から起動した」場合だけで、かつ本番が稼働状態でない
      # (全サービス desired=0)ときに限る。稼働日にデプロイした本番は落とさない。
      # 途中で失敗しても課金を残さないため always()。
      #
      # 条件に changes.outputs.backend を入れてはいけない。起動側(Start production RDS)は
      # 「backend変更 または 停止日」で起動するため、停止日に frontend / rag-review だけを
      # 変更したデプロイでは起動だけされて停止されず、RDSが起動したまま残る。
      # started_by_deploy は起動ステップが実際に start-db-instance を打てた時だけ true
      # になるので、これ単独が正しいゲート。
      - name: Stop production RDS if this deploy started it
        if: always() && steps.prod-db.outputs.started_by_deploy == 'true'
        run: |
          set -uo pipefail
          # マイグレーションのワンオフタスクがまだ動いている状態でDBを落とすと、
          # 実行中のDDLが切れて dirty なマイグレーションが残る。
          # wait が一時障害で失敗した場合に備え、STOPPED を確認できたときだけ進む。
          TASK_ARN="${{ steps.migrate.outputs.task_arn }}"
          if [ -n "$TASK_ARN" ]; then
            TASK_STATUS=$(aws ecs describe-tasks --cluster "${PROJECT_NAME}" --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' --output text 2>/dev/null || echo "UNKNOWN")
            if [ "$TASK_STATUS" != "STOPPED" ]; then
              # 放置するとワンオフタスクが残り続け、次のスケジューラがRDSだけ止めて
              # 実行中のDDLから接続を切る。明示的に止めて終了を待つ。
              echo "マイグレーションタスクが $TASK_STATUS のため停止させる" >&2
              aws ecs stop-task --cluster "${PROJECT_NAME}" --task "$TASK_ARN" \
                --reason "deploy cleanup" > /dev/null || true
              if ! aws ecs wait tasks-stopped --cluster "${PROJECT_NAME}" --tasks "$TASK_ARN"; then
                echo "マイグレーションタスクの停止を確認できないためRDSは停止しない" >&2
                exit 1
              fi
            fi
          fi
          # 取得できないまま「停止中」とみなすと、稼働中の本番DBを落としうる。安全側に倒す。
          if ! DESIRED_TOTAL=$(aws ecs describe-services --cluster "${PROJECT_NAME}" \
            --services chroma rag-review backend frontend \
            --query 'sum(services[].desiredCount)' --output text); then
            echo "ECSサービスの状態を取得できないためRDSは停止しない" >&2
            exit 1
          fi
          if [ "$DESIRED_TOTAL" != "0" ]; then
            echo "本番が稼働中(desired合計=$DESIRED_TOTAL)のためRDSは停止しない"
            exit 0
          fi
          # desired=0 にしてもタスクはすぐには消えない。ドレイン中のbackendが残ったまま
          # DBを落とすと、処理中のリクエストが途中で切れる。running が捌けるまで待つ。
          for _ in $(seq 1 20); do
            RUNNING_TOTAL=$(aws ecs describe-services --cluster "${PROJECT_NAME}" \
              --services chroma rag-review backend frontend \
              --query 'sum(services[].runningCount)' --output text 2>/dev/null || echo "unknown")
            [ "$RUNNING_TOTAL" = "0" ] && break
            echo "runningCount=$RUNNING_TOTAL (waiting...)"
            sleep 15
          done
          if [ "$RUNNING_TOTAL" != "0" ]; then
            echo "タスクが残っている(running=$RUNNING_TOTAL)ためRDSは停止しない。スケジューラに任せる" >&2
            exit 1
          fi
          # 停止できなかったことを運用者が検知できるよう、失敗はステップの失敗にする。
          aws rds stop-db-instance --db-instance-identifier "${PROJECT_NAME}-mysql" > /dev/null
          echo "✓ RDSを停止状態へ戻した"

      - name: Notify Discord release
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${DISCORD_RELEASE_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL is not set; skip Discord notify"
            exit 0
          fi
          CONTENT="$(python3 automation/discord/build_release_notify.py \
            --commit-subject "$(git log -1 --format=%s)" \
            --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --actor "${{ github.actor }}" \
            --repo "${{ github.repository }}")"
          PAYLOAD="$(python3 -c "import json,sys; print(json.dumps({'content': sys.argv[1]}))" "$CONTENT")"
          curl -sS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$DISCORD_RELEASE_WEBHOOK_URL"

  # 更新情報(#861): mainへの直近マージPRをAI要約してDBへ取り込む。
  # 本番(Fargate)は展示会時のみ起動(desired_countは変更しない)のため、
  # デプロイ直後に到達できない場合がある。pr_numberでべき等なので、
  # 失敗しても後続の実行(展示会起動時など)で取りこぼしなく再取り込みされる。
  # stagingにも同じmain由来の内容を反映し、本番が停止中でもstagingで確認できるようにする。
  sync-whats-new:
    needs: deploy-production
    if: github.ref_name == 'main' && always() && needs.deploy-production.result == 'success'
    name: Sync whats-new from merged PRs
    runs-on: ubuntu-latest
    continue-on-error: true
    # 本番の admin_secret を Secrets Manager から読むため、production の認証情報を使う(#1158)。
    # リポジトリ既定の認証情報はECSクラスタ作成前の古い値で、本番リソースを引けない。
    environment: production
    steps:
      # collect_whats_new_sources.py と、それが読む resolve_deployed_issues.py を使う。
      # squash マージのコミット題名から元PR番号を辿るため、履歴も要る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 認証に失敗しても後続は続ける。ここで止めると、リポジトリシークレットへの
      # フォールバックが効かないだけでなく、これまで確実に動いていた staging への
      # 取り込みまで丸ごとスキップされる(ジョブは continue-on-error で緑のまま)。
      - name: Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Fetch recently merged PRs and ingest
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}
          # staging 側は引き続きリポジトリシークレットを使う。
          # 本番と staging で別値にするのが #1158 の目的。
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          PROD_API_BASE: https://${{ vars.PROD_API_DOMAIN || 'api.shukatsu-ai.jp' }}
          STAGING_API_BASE: https://${{ vars.STAGING_API_DOMAIN || 'api-stg.shukatsu-ai.jp' }}
        run: |
          # 本番の admin_secret は Secrets Manager を正とする(#1158)。
          # 読めない場合だけリポジトリシークレットへフォールバックする(移行期間の両対応)。
          # 失敗理由(AccessDenied / ResourceNotFound / ExpiredToken)が分からないと
          # 警告を見ても何を直せばよいか判断できない。stderr は残す(値は stdout 側)。
          sm_err=$(mktemp)
          PROD_ADMIN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${PROJECT_NAME:-soc-app}/admin" --query SecretString --output text 2>"$sm_err" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('admin_secret',''))" 2>>"$sm_err" || true)
          if [ -n "$PROD_ADMIN_SECRET" ]; then
            echo "::add-mask::$PROD_ADMIN_SECRET"
          else
            echo "::warning::Secrets Manager から admin_secret を読めませんでした。リポジトリシークレットで続行します(IAMに secretsmanager:GetSecretValue を確認してください)"
            sed 's/^/  aws: /' "$sm_err"
            PROD_ADMIN_SECRET="$ADMIN_SECRET"
          fi
          rm -f "$sm_err"

          # main へ直接マージされるのは release 傘PRだけで、その本文は
          # 「起動ジョブの失敗通知が初めて有効になる」のような運用担当者向けの記述になる。
          # 傘PRをそのまま要約させると、中身に混ざった運用作業がユーザー向け更新情報として
          # 出てしまう（実際に出た）。傘PRは要約対象にせず、中身の個別PRを送る。
          sources=$(python3 .github/scripts/collect_whats_new_sources.py)

          # 本番が停止していると必ず失敗する(既定停止の運用)。ここで失敗させるとデプロイが
          # 落ちてしまうため続行はするが、黙って握りつぶすと「反映されていない」ことに
          # 気づけない。実際にそれで、運用作業がユーザー向け更新情報に出たまま残った(#1290)。
          # 取りこぼしは prod-uptime-scheduler.yml が本番起動時に回収する。
          # 「停止中で届かない」と「鍵が違って拒否された」は対処が別物。
          # 後者を warning で流すと、admin_secret のローテーション後に更新情報が
          # 反映されないまま誰も気づかない(#1290 と同じ症状)。
          #
          # 503 は拾わない。CloudFront が ALB の 500/502/503/504 をすべて 503 へ
          # 差し替えるため(modules/cloudfront_app_proxy)、503 はほぼ「オリジンが
          # 応答しない」を意味する。バックエンドの「ADMIN_SECRET 未設定」も 503 だが、
          # ローリング更新中やタスク停止中に必ず踏むので、ここで落とすと
          # 正常なデプロイが赤くなる(実際に本番デプロイで踏んだ)。
          prod_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PROD_API_BASE/api/admin/whats-new/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $PROD_ADMIN_SECRET" \
            -d "{\"sources\": $sources}" \
            --max-time 60 || true)
          prod_rejected=0
          case "$prod_code" in
            2*) ;;
            401|403)
              echo "::error::本番への更新情報の取り込みが $prod_code で拒否されました。admin_secret が本番の値と一致していません(ローテーション後の CI 設定を確認してください)"
              prod_rejected=1
              ;;
            *)
              echo "::warning::本番への更新情報の取り込みに失敗しました(HTTP $prod_code / 停止中の可能性)。本番起動時に回収されます。"
              ;;
          esac

          curl -sf -X POST "$STAGING_API_BASE/api/admin/whats-new/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $ADMIN_SECRET" \
            -d "{\"sources\": $sources}" \
            --max-time 60 \
            || echo "::warning::stagingへの更新情報の取り込みに失敗しました(停止中の可能性)。"

          # staging まで流し終えてから落とす。先に exit すると staging の取り込みも飛ぶ。
          [ "$prod_rejected" = "0" ]

  # 本番へ反映された issue を閉じる。
  #
  # feature/* -> develop -> release -> main のフローでは GitHub の
  # `Closes #123` が発火しない。close キーワードは**デフォルトブランチへ
  # マージされたPR**の本文でのみ効くが、feature PR の base は develop であり、
  # プロモーションPRの本文には issue 番号が書かれないため。
  # 結果、本番反映済みの issue が開いたまま溜まる（2026-09-10 時点で16件）。
  #
  # squash マージのコミット題名に残る元PR番号 `(#1234)` を辿り、
  # そのPR本文の close キーワードから issue を解決して閉じる。
  close-deployed-issues:
    needs: deploy-production
    if: github.ref_name == 'main' && needs.deploy-production.result == 'success'
    name: Close issues deployed to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 閉じられなくてもデプロイは成功として扱う。
    # issue の開閉は運用の都合であり、本番の稼働とは独立している。
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 直前のリリース範囲を見るため履歴が要る
          fetch-depth: 0

      - name: 本番へ反映されたPRから issue を解決して閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          sys.path.insert(0, ".github/scripts")
          from resolve_deployed_issues import extract_pr_numbers, resolve_issues

          REPO = os.environ["GH_REPO"]

          def gh(args):
              r = subprocess.run(["gh", *args, "--repo", REPO],
                                 capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else ""

          # 直近のリリースマージ（HEAD）に含まれるコミット題名を集める。
          # 1つ前のmainのコミットとの差分を取る。
          subjects = subprocess.run(
              ["git", "log", "--format=%s", "HEAD~1..HEAD", "--no-merges"],
              capture_output=True, text=True).stdout.splitlines()
          if not subjects:
              # マージコミット自体しか無い場合は、マージした側の履歴を辿る
              subjects = subprocess.run(
                  ["git", "log", "--format=%s", "HEAD^1..HEAD^2"],
                  capture_output=True, text=True).stdout.splitlines()

          prs = extract_pr_numbers(subjects)
          print(f"コミット {len(subjects)} 件から 元PR {len(prs)} 件を検出")

          def body_of(pr):
              return gh(["pr", "view", str(pr), "--json", "body", "-q", ".body"])

          def commits_of(pr):
              return gh(["pr", "view", str(pr), "--json", "commits",
                         "-q", "[.commits[].messageHeadline]|.[]"]).splitlines()

          # 本文に close キーワードが無いPRは1段掘る。release→main が squash
          # マージだと範囲にはリリースPR1件しか現れず、各 feature PR の
          # Closes #N まで届かないため(詳細は resolve_issues のコメント)。
          issues = resolve_issues(prs, body_of, commits_of)

          if not issues:
              print("閉じる対象の issue はありません。")
              sys.exit(0)

          closed, skipped, failed = 0, 0, 0
          for issue in sorted(issues):
              state = gh(["issue", "view", str(issue), "--json", "state", "-q", ".state"]).strip()
              if state != "OPEN":
                  print(f"  #{issue}: 既に {state or '取得不可'} のためスキップ")
                  skipped += 1
                  continue
              pr_list = ", ".join(f"#{p}" for p in issues[issue])
              r = subprocess.run(
                  ["gh", "issue", "close", str(issue), "--repo", REPO,
                   "--comment", f"本番へ反映されたため自動でクローズしました（{pr_list}）。"],
                  capture_output=True, text=True)
              if r.returncode == 0:
                  print(f"  #{issue}: クローズしました（{pr_list}）")
                  closed += 1
              else:
                  print(f"  #{issue}: クローズに失敗 {r.stderr.strip()[:120]}", file=sys.stderr)
                  failed += 1

          print(f"クローズ {closed} 件 / スキップ {skipped} 件 / 失敗 {failed} 件")
          PYEOF

  # PRイベント時の一時的な失敗や、プロモーションPRの課題キー解決漏れがあっても、
  # 本番Deploy成功後にBacklogの状態を「完了」へ補正する。
  # pr-to-backlog.yml の既存ロジック（中間PRを辿る再帰解決）を再利用し、
  # 各workflow_dispatchの完了まで待つことで、Deployジョブ成功だけを先に返さない。
  sync-backlog-after-deploy:
    needs: deploy-production
    if: github.ref_name == 'main' && needs.deploy-production.result == 'success'
    name: Sync Backlog statuses after production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Reconcile recently deployed PRs with Backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t prs < <(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state merged \
              --base main \
              --limit 20 \
              --json number \
              --jq '.[].number'
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "mainへマージ済みのPRがありません。"
            exit 0
          fi

          for pr in "${prs[@]}"; do
            echo "Backlog同期を再実行します: PR #$pr"
            run_url="$(gh workflow run pr-to-backlog.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f pr_number="$pr")"
            run_id="${run_url##*/}"
            gh run watch "$run_id" \
              --repo "${{ github.repository }}" \
              --exit-status
          done

  # developへのマージPRもstagingでは即時確認できるようにする（本番には反映しない）。
  # pr_numberでべき等のため、後日releaseブランチ経由でmainへ入った際に
  # sync-whats-new(main)が別途取り込んでも問題ない。ただしmain側のマージPR番号は
  # develop側の個別PR番号とは別物になるため、同一変更が粒度違いで2件表示される
  # ことがある（許容: 実害は軽微、必要になれば重複排除を後日検討）。
  sync-whats-new-develop:
    needs: deploy-staging
    if: github.ref_name == 'develop' && always() && needs.deploy-staging.result == 'success'
    name: Sync whats-new from merged PRs (develop → staging)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Fetch recently merged PRs (base develop) and ingest into staging
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          STAGING_API_BASE: https://${{ vars.STAGING_API_DOMAIN || 'api-stg.shukatsu-ai.jp' }}
        run: |
          sources=$(gh pr list --repo "${{ github.repository }}" --state merged --base develop --limit 20 \
            --json number,title,body,mergedAt \
            --jq '[.[] | {pr_number: .number, title: .title, body: .body, merged_at: .mergedAt}]')

          curl -sf -X POST "$STAGING_API_BASE/api/admin/whats-new/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $ADMIN_SECRET" \
            -d "{\"sources\": $sources}" \
            --max-time 60 \
            || echo "stagingへの取り込みに失敗しました(停止中の可能性)。スキップします。"
