name: Deploy

# develop -> staging（IAMロール無しEC2 + Docker Compose、SSHでpull/up）
# main    -> production（ECS on Fargate、展示会時起動。desired_countは変更しない）
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref_name == 'develop'
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    # staging-auto-stopジョブ(最大1時間スリープ)は別concurrency groupなので、
    # ここをジョブ単位にしないとワークフロー全体のrunが1時間ブロックされ、
    # 次のデプロイが開始できなくなる
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      # staging EC2上のdocker-compose.ymlはこのタグを固定で参照しているため、
      # SHAタグではなく固定タグにする（pull => 中身が更新される）
      IMAGE_TAG: staging
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # デプロイ後1時間で自動停止する運用のため、止まっていたら起動をキックする
      # (完了は待たない。この後のDockerビルド時間と起動時間を並行させるため)
      - name: Start staging infra if stopped
        run: |
          RDS_STATUS=$(aws rds describe-db-instances --db-instance-identifier ${PROJECT_NAME}-mysql \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "unknown")
          if [ "$RDS_STATUS" == "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier ${PROJECT_NAME}-mysql
          fi

          DESIRED=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "${PROJECT_NAME}-app" \
            --query 'AutoScalingGroups[0].DesiredCapacity' --output text 2>/dev/null || echo "0")
          if [ "$DESIRED" == "0" ]; then
            aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${PROJECT_NAME}-app" \
              --min-size 1 --desired-capacity 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub Actionsキャッシュ(type=gha)でレイヤーを再利用しつつ、3イメージを並列ビルドする。
      # staging EC2はamd64（instance_type変更済み、旧t4g.small/ARM64からの移行に伴う）。
      - name: Build and push images (frontend/backend/rag-review, parallel)
        run: |
          set -e
          pids=()

          (cd frontend && docker buildx build --platform linux/amd64 \
            --build-arg NODE_ENV=production \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://${{ vars.STAGING_API_DOMAIN || 'api-stg.shukatsu-ai.jp' }} \
            --cache-from type=gha,scope=frontend-staging \
            --cache-to type=gha,mode=max,scope=frontend-staging \
            -t $ECR_REGISTRY/soc-frontend:$IMAGE_TAG --push .) &
          pids+=($!)

          (cd Backend && docker buildx build --platform linux/amd64 \
            --cache-from type=gha,scope=backend-staging \
            --cache-to type=gha,mode=max,scope=backend-staging \
            -t $ECR_REGISTRY/soc-backend:$IMAGE_TAG --push .) &
          pids+=($!)

          (cd rag && docker buildx build --platform linux/amd64 \
            --cache-from type=gha,scope=rag-staging \
            --cache-to type=gha,mode=max,scope=rag-staging \
            -t $ECR_REGISTRY/soc-rag-review:$IMAGE_TAG --push .) &
          pids+=($!)

          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit $fail

      # ビルド中に裏で進めた起動を待ち合わせる（RDSは停止からだと最大10分程度かかる）。
      # 直前のauto-stopとレースして"stopping"の間は起動キックが素通りすることがあるため、
      # ここでも stopped を検知したら都度start-db-instanceを呼び直す（自己修復）。
      - name: Wait for staging infra ready
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws rds describe-db-instances --db-instance-identifier ${PROJECT_NAME}-mysql \
              --query 'DBInstances[0].DBInstanceStatus' --output text)
            [ "$STATUS" == "available" ] && break
            if [ "$STATUS" == "stopped" ]; then
              aws rds start-db-instance --db-instance-identifier ${PROJECT_NAME}-mysql || true
            fi
            echo "RDS status: $STATUS (waiting...)"
            sleep 15
          done
          if [ "$STATUS" != "available" ]; then
            echo "RDS did not become available in time" >&2
            exit 1
          fi

          for i in $(seq 1 20); do
            STATE=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${PROJECT_NAME}-app" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)
            [ "$STATE" == "running" ] && break
            echo "EC2 state: $STATE (waiting...)"
            sleep 15
          done
          if [ "$STATE" != "running" ]; then
            echo "staging instance did not become running in time" >&2
            exit 1
          fi

      - name: Resolve staging instance IP
        id: instance
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ -z "$IP" ] || [ "$IP" == "None" ]; then
            echo "staging instance not found (ASG未起動、またはタグ不一致)" >&2
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${PROJECT_NAME}-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      # GitHub Actionsランナーは固定IPを持たないため、SSHステップの前後だけ
      # ランナー自身のIPをSGへ動的に許可する（常時0.0.0.0/0で開けない）
      - name: Allow runner IP for SSH
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.instance.outputs.sg_id }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      # 新規起動直後はuser_data(docker/compose導入)完了前でSSHはできてもcomposeが
      # 無いことがあるため、ポート疎通だけでなく/opt/appの準備も待つ
      - name: Wait for instance SSH/docker-compose ready
        run: |
          for i in $(seq 1 20); do
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ steps.instance.outputs.ip }}/22" 2>/dev/null && break
            echo "waiting for SSH port..."
            sleep 15
          done

      - name: Deploy via SSH (docker compose pull && up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.instance.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo bash -c '
              for i in $(seq 1 20); do
                [ -f /opt/app/docker-compose.yml ] && command -v docker >/dev/null && break
                echo "waiting for user_data (docker/compose) to finish..."
                sleep 15
              done
              aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
              cd /opt/app
              docker image prune -af
              docker compose pull
              docker compose up -d
              sleep 15
              echo "=== compose ps ==="
              docker compose ps
              echo "=== backend env (SERVER_PORT check) ==="
              docker exec app-backend-1 env | grep -i server_port || echo "SERVER_PORT not in container env"
              echo "=== backend logs ==="
              docker logs --tail 60 app-backend-1
              echo "=== curl inside instance to backend:8080/healthz ==="
              curl -sv --max-time 5 http://localhost:8080/healthz || true
            '

      - name: Revoke runner IP for SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.instance.outputs.sg_id }} \
            --protocol tcp --port 22 --cidr "${{ env.runner_ip }}/32" || true

  # デプロイから1時間、新たなデプロイが無ければstagingを自動停止する（コスト削減）。
  # 1時間以内に次のdeploy-staging(→本ジョブ)が走ると、同じconcurrency groupで
  # 前回分がキャンセルされ、実質タイマーがリセットされる。
  staging-auto-stop:
    needs: deploy-staging
    if: github.ref_name == 'develop'
    name: Auto-stop staging after 1h
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-auto-stop
      cancel-in-progress: true

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait 1 hour (cancelled if a new deploy arrives)
        run: sleep 3600

      - name: Stop staging infra (EC2 + RDS)
        run: |
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "${PROJECT_NAME}-app" \
            --min-size 0 --desired-capacity 0
          aws rds stop-db-instance --db-instance-identifier ${PROJECT_NAME}-mysql || true

  deploy-production:
    if: github.ref_name == 'main'
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
      # ECSクラスタ名・タスク定義family接頭辞はともにTerraformのproject_name（既定soc-app）由来
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub Actionsキャッシュ(type=gha)でレイヤーを再利用しつつ、2イメージを並列ビルドする
      - name: Build and push images (frontend/backend, parallel)
        run: |
          set -e
          pids=()

          (cd frontend && docker buildx build --platform linux/amd64 \
            --build-arg NODE_ENV=production \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://${{ vars.PROD_API_DOMAIN || 'api.shukatsu-ai.jp' }} \
            --cache-from type=gha,scope=frontend-production \
            --cache-to type=gha,mode=max,scope=frontend-production \
            -t $ECR_REGISTRY/soc-frontend:$IMAGE_TAG --push .) &
          pids+=($!)

          (cd Backend && docker buildx build --platform linux/amd64 \
            --cache-from type=gha,scope=backend-production \
            --cache-to type=gha,mode=max,scope=backend-production \
            -t $ECR_REGISTRY/soc-backend:$IMAGE_TAG --push .) &
          pids+=($!)

          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit $fail

      # ECS Fargateのタスク定義はTerraformが管理する。CIはTerraform applyを
      # 行わず、現在のタスク定義のimageだけ差し替えて新リビジョンを登録する
      # （実行/タスクロールのIAM操作が不要なため、デプロイ用の最小権限で完結する）。
      - name: Fetch current backend task definition
        run: |
          aws ecs describe-task-definition --task-definition "${PROJECT_NAME}-backend" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > backend-task-def.json

      - name: Render backend task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: soc-backend
          image: ${{ env.ECR_REGISTRY }}/soc-backend:${{ env.IMAGE_TAG }}

      - name: Deploy backend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: backend
          cluster: ${{ env.PROJECT_NAME }}
          wait-for-service-stability: true

      - name: Fetch current frontend task definition
        run: |
          aws ecs describe-task-definition --task-definition "${PROJECT_NAME}-frontend" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > frontend-task-def.json

      - name: Render frontend task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: soc-frontend
          image: ${{ env.ECR_REGISTRY }}/soc-frontend:${{ env.IMAGE_TAG }}

      - name: Deploy frontend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: frontend
          cluster: ${{ env.PROJECT_NAME }}
          wait-for-service-stability: true
