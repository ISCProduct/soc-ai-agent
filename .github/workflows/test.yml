name: Test

on:
  push:
    branches:
      - develop
      - release
      - main
  pull_request:
    branches:
      - develop
      - release
      - main

# 本ワークフローはチェックアウトとテスト実行のみで、リポジトリへの書き込みを行わない。
# 既定の GITHUB_TOKEN 権限を継承せず、最小権限を明示する。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./Backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./Backend/go.mod
          check-latest: true
          cache-dependency-path: ./Backend/go.sum

      - name: Download dependencies
        run: go mod download

      # test/ 配下(69ファイル/672テスト)がCI対象外だったため、
      # Responses API移行でモックが腐っていたことに長期間気づけなかった (#1132)
      #
      # -timeout はハング検出が目的であり性能予算ではない。bcrypt(cost=12)を使う
      # ログイン系テストは -race 下で重く、60s ではランナーの状態次第で
      # 偽の失敗になりうるため 300s へ引き上げる。
      - name: Run tests
        run: go test ./internal/... ./migrations/... ./test/... -v -race -timeout 300s

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt が適用されていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build check
        run: go build ./...

      - name: Security scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  audit-frontend:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    # 3ジョブが同時に npm ci を実行するため競合し、npm ci だけで最大3分33秒かかる実測。
    # 5分ではジョブ全体の予算を npm ci が食い潰し、後続ステップが打ち切られていた (#1132)
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./frontend/.nvmrc
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high

  test-frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    # audit-frontend と同じ理由で 5分では不足する
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./frontend/.nvmrc
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --no-coverage

  e2e-frontend:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Playwrightのブラウザインストール(apt-get/ネットワーク)が稀にハングし、
    # デフォルトの6時間上限まで実行され続けてランナー枠を圧迫することがあったため設定
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./frontend/.nvmrc
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # --with-deps は内部でapt-get updateを実行するが、ubuntuパッケージミラーへの
        # 接続がハングし15分タイムアウトに達するまで進まなくなる事象が頻発したため外した。
        # ubuntu-latestランナーには元々Chromiumヘッドレス実行に必要な共有ライブラリが
        # ほぼ揃っており、欠けていれば後続のE2Eテスト実行時に明確なエラーとして検知できる。
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:3000
          E2E_MOCK_AUTH: 'true'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
