name: Backlog 通知 (commit / PR)

# commit メッセージや PR に Backlog 課題キー（例: PROJ-123）が含まれている場合、
# 対応する Backlog 課題へ自動コメント・ステータス更新を行います。
# コミットメッセージに #fixed / #closed を付けると課題をクローズできます。
#
# 必要な GitHub Secrets:
#   BACKLOG_SPACE_ID  : スペースID（例: myspace ← myspace.backlog.jp の場合）
#   BACKLOG_PROJECT_KEY: プロジェクトキー（例: PROJ）
#   BACKLOG_API_KEY   : Backlog のアカウント設定で発行した APIキー
#   BACKLOG_DOMAIN    : 任意。省略時は backlog.jp → backlog.com の順に自動判定
#                       （他の Backlog 連携 WF と同じ。v6 移行時に .jp 固定のまま漏れ、
#                       backlog.com スペースで notify だけ Not Found になっていた）

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    # Dependabot のPRには Backlog 課題キーが無く、
    # かつ Dependabot 起因の実行には通常の secrets が渡らないため
    # 「Input required and not supplied: project_key」で必ず失敗する（GitHubの仕様）。
    # 通知する対象がそもそも無いのでスキップする。
    if: github.actor != 'dependabot[bot]'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/backlog_client.py
          sparse-checkout-cone-mode: false

      - name: Backlog ホスト名を解決
        id: resolve
        env:
          BACKLOG_SPACE_ID: ${{ secrets.BACKLOG_SPACE_ID }}
          BACKLOG_DOMAIN: ${{ secrets.BACKLOG_DOMAIN }}
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          from backlog_client import env_optional, normalize_space_id, resolve_bl_base

          space_id = normalize_space_id(os.environ["BACKLOG_SPACE_ID"])
          api_key = os.environ["BACKLOG_API_KEY"]
          domain = env_optional("BACKLOG_DOMAIN")
          _, resolved = resolve_bl_base(space_id, api_key, domain)
          host = f"{space_id}.{resolved}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"host={host}\n")
          print(f"host={host}", flush=True)
          PYEOF

      - uses: bicstone/backlog-notify@v6
        with:
          project_key: ${{ secrets.BACKLOG_PROJECT_KEY }}
          api_host: ${{ steps.resolve.outputs.host }}
          api_key: ${{ secrets.BACKLOG_API_KEY }}
