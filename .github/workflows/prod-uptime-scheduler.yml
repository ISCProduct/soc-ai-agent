name: Prod uptime scheduler

# 本番(ECS Fargate + RDS)の「指定日は終日起動」ポリシーを毎時照合する。
# docs/architecture/infra-decision-oci-stg-aws-prod.md の (B) 指定日終日起動 を実現する。
# 日付リストはDiscordの /prod-uptime コマンド(Backend: /api/discord/interactions)で
# SSM Parameter Store (/soc-app/prod-uptime-dates, カンマ区切り) に追加される。
#
# Discordの /prod コマンドは手動オーバーライド (/soc-app/prod-uptime-override) を
# on / off / auto で書き込み、このワークフローを workflow_dispatch で即時起動する。
# オーバーライドは日付リストより優先する。これが無いと、手動起動しても次の毎時実行が
# 日付リストどおりに戻してしまい「起動したのに落ちている」状態になる。
#
# ponytail: デプロイ中(deployment.yml)との競合を防ぐロックは未実装。
# 反映作業と本ジョブの実行が重なった場合、一時的にdesired_countが競合する可能性がある。
# 実運用で問題になれば、SSM Parameterへのメンテナンスロックフラグ追加を検討する。

on:
  schedule:
    - cron: "5 * * * *" # 毎時5分(UTC)
  workflow_dispatch:

permissions: {}

# 同時実行を許すと、起動側(RDSのavailable待ちで最大10分ループする)と停止側が
# すれ違い、SSMは off なのに本番が起動したまま次の毎時実行まで課金され続ける。
# cancel-in-progress で「最後の指示が勝つ」ようにする。
concurrency:
  group: prod-uptime-scheduler
  cancel-in-progress: true

jobs:
  sync-prod-uptime:
    runs-on: ubuntu-latest
    # ECS(本番)へのアクセスにはproduction環境のAWS認証情報が必要。
    # 未指定だとリポジトリ既定のAWS_ACCESS_KEY_ID(旧・ECSクラスタ作成前の認証情報)が使われ、
    # ClusterNotFoundExceptionになる(実際に発生した障害)。
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine desired state and apply
        id: apply
        run: |
          set -e

          TODAY_JST=$(TZ=Asia/Tokyo date +%F)

          # パラメータ未作成(初回)のみ空扱いにし、それ以外のAWSエラー(権限/スロットリング/
          # ネットワーク等)は握りつぶさずジョブを失敗させる(誤って両サービスを0にしないため)。
          if DATES=$(aws ssm get-parameter --name "/${PROJECT_NAME}/prod-uptime-dates" \
            --query 'Parameter.Value' --output text 2>/tmp/ssm_get_parameter_err); then
            :
          elif grep -q "ParameterNotFound" /tmp/ssm_get_parameter_err; then
            DATES=""
          else
            cat /tmp/ssm_get_parameter_err >&2
            exit 1
          fi

          # 手動オーバーライド。未作成(初回)は auto 扱い。
          #
          # 読めない場合にここで exit すると、日付リストどおりの起動まで巻き添えで止まり、
          # 指定日に本番が上がらなくなる。IAMに override のARNを足し忘れると必ずこれに当たる
          # (実際、CIのIAMユーザーは prod-uptime-dates だけにリソース限定されていた)。
          # そのため auto へ縮退して日付リストの反映は続け、ジョブは最後に失敗させる。
          # オートスケーリング同期の失敗と同じ扱い。
          OVERRIDE_READ_FAILED=""
          if OVERRIDE=$(aws ssm get-parameter --name "/${PROJECT_NAME}/prod-uptime-override" \
            --query 'Parameter.Value' --output text 2>/tmp/ssm_get_override_err); then
            :
          elif grep -q "ParameterNotFound" /tmp/ssm_get_override_err; then
            OVERRIDE="auto"
          else
            cat /tmp/ssm_get_override_err >&2
            echo "::error::手動オーバーライドを読めませんでした。日付リストのみで判定します(/prod は効きません)。IAMに ${PROJECT_NAME}/prod-uptime-override への ssm:GetParameter を追加してください"
            OVERRIDE="auto"
            OVERRIDE_READ_FAILED=1
          fi

          # Discord側(Go)は大文字と前後空白を無視して受理するため、手でSSMを
          # 書き換えたときに表示と実挙動が食い違わないよう、こちらでも正規化する。
          OVERRIDE=$(echo "$OVERRIDE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          case "$OVERRIDE" in
            on)
              DESIRED=1
              echo "override=on -> desired_count=1 (日付リストは無視)"
              # 戻し忘れると請求で気づくことになるので、実行ログに毎回残す
              echo "::warning::本番は /prod で「常時起動」に固定されています。不要なら /prod state:auto に戻してください"
              ;;
            off)
              DESIRED=0
              echo "override=off -> desired_count=0 (日付リストは無視)"
              ;;
            *)
              # auto、または想定外の値。想定外の値で本番を起動しっぱなしにする/落とすより
              # 日付リストどおりに動く方が安全なので、auto と同じ扱いにする。
              if [ "$OVERRIDE" != "auto" ]; then
                echo "override='$OVERRIDE' は未知の値のため auto として扱う" >&2
              fi
              DESIRED=0
              if echo ",$DATES," | grep -q ",$TODAY_JST,"; then
                DESIRED=1
                echo "today ($TODAY_JST) is an uptime date -> desired_count=1"
              else
                echo "today ($TODAY_JST) is not an uptime date -> desired_count=0"
              fi
              ;;
          esac

          DB_ID="${PROJECT_NAME}-mysql"
          echo "desired=$DESIRED" >> "$GITHUB_OUTPUT"

          if [ "$DESIRED" == "1" ]; then
            # RDSを先に起動し、利用可能になってからECSを起動する
            # (backendがDB未起動のままタスク起動してクラッシュループするのを防ぐ。staging側の
            # deployment.ymlの起動待ちループと同じパターン)
            RDS_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
              --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "unknown")
            if [ "$RDS_STATUS" == "stopped" ]; then
              aws rds start-db-instance --db-instance-identifier "$DB_ID"
            fi
            for i in $(seq 1 40); do
              STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
                --query 'DBInstances[0].DBInstanceStatus' --output text)
              [ "$STATUS" == "available" ] && break
              if [ "$STATUS" == "stopped" ]; then
                aws rds start-db-instance --db-instance-identifier "$DB_ID" || true
              fi
              echo "RDS status: $STATUS (waiting...)"
              sleep 15
            done
            if [ "$STATUS" != "available" ]; then
              echo "RDS did not become available in time" >&2
              exit 1
            fi
          fi

          AUTOSCALING_FAILED=""
          # chroma -> rag-review の順に起動する(rag-reviewはCloud Map経由でchromaに接続する)。
          # RAG(履歴書レビュー/ES添削)はbackendの同期依存であり、ここから漏れると
          # 稼働日でもRAG機能だけ落ちる(実際に発生していた)。
          for SERVICE in chroma rag-review backend frontend; do
            # オートスケーリングの下限を desired と同じ値に合わせる。
            # desired_count だけ更新しても min_capacity=0 のままだと CPU ターゲット追跡が
            # 0 まで縮退させ、タスク0ではCPUメトリクスが出ないため自力復帰できない。
            # 結果として稼働日でも本番APIが断続的に503になる。max は Terraform 側の
            # 値をそのまま引き継ぐため AWS から読み取る(ハードコードすると乖離する)。
            RESOURCE_ID="service/${PROJECT_NAME}/${SERVICE}"
            if MAX=$(aws application-autoscaling describe-scalable-targets \
              --service-namespace ecs --resource-ids "$RESOURCE_ID" \
              --scalable-dimension ecs:service:DesiredCount \
              --query 'ScalableTargets[0].MaxCapacity' --output text 2>/tmp/as_describe_err); then
              if [ -z "$MAX" ] || [ "$MAX" == "None" ]; then
                # スケーラブルターゲット未登録。chroma/rag-reviewはオートスケーリング対象外
                # (Terraform側でも登録していない)ため、desired_countの更新だけで足りる。
                echo "$SERVICE: スケーラブルターゲット未登録、desired_count のみ更新する"
              elif aws application-autoscaling register-scalable-target \
                --service-namespace ecs --resource-id "$RESOURCE_ID" \
                --scalable-dimension ecs:service:DesiredCount \
                --min-capacity "$DESIRED" --max-capacity "$MAX" > /dev/null; then
                echo "$SERVICE min_capacity -> $DESIRED (max=$MAX)"
              else
                echo "$SERVICE: register-scalable-target に失敗(IAM権限を確認: application-autoscaling:RegisterScalableTarget)" >&2
                AUTOSCALING_FAILED=1
              fi
            else
              # API呼び出し自体の失敗(権限/スロットリング等)のみを失敗扱いにする。
              # 「未登録」は上のブランチで正常系として扱う。
              cat /tmp/as_describe_err >&2
              echo "$SERVICE: describe-scalable-targets に失敗(IAM権限を確認: application-autoscaling:DescribeScalableTargets)" >&2
              AUTOSCALING_FAILED=1
            fi

            CURRENT=$(aws ecs describe-services --cluster "$PROJECT_NAME" --services "$SERVICE" \
              --query 'services[0].desiredCount' --output text 2>/dev/null || echo "")
            if [ "$CURRENT" == "$DESIRED" ]; then
              echo "$SERVICE already at desired_count=$DESIRED, skipping"
              continue
            fi
            aws ecs update-service --cluster "$PROJECT_NAME" --service "$SERVICE" \
              --desired-count "$DESIRED" > /dev/null
            echo "$SERVICE updated: $CURRENT -> $DESIRED"
          done

          if [ "$DESIRED" == "0" ]; then
            # ECSを先に0にしてから(上のループで完了済み)RDSを止める。
            # 起動中(available)の時だけ止める。starting/stopping等の遷移中に叩くとエラーになるため
            RDS_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
              --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "unknown")
            if [ "$RDS_STATUS" == "available" ]; then
              aws rds stop-db-instance --db-instance-identifier "$DB_ID"
              echo "RDS stopped"
            else
              echo "RDS status: $RDS_STATUS, skipping stop"
            fi
          fi

          # desired_count の反映は済ませたうえで、オートスケーリング下限の同期に
          # 失敗していればジョブを失敗させる(放置すると稼働日に0へ縮退して気づけない)。
          if [ -n "$AUTOSCALING_FAILED" ]; then
            echo "オートスケーリング下限(min_capacity)の同期に失敗しました" >&2
            exit 1
          fi

          if [ -n "$OVERRIDE_READ_FAILED" ]; then
            echo "手動オーバーライドを読めませんでした(/prod が無効のまま動いています)" >&2
            exit 1
          fi

      # 本番が停止している間に main へデプロイすると、deployment.yml の
      # 「Sync whats-new from merged PRs」は curl に失敗して取り込みをスキップする
      # (|| echo で握りつぶされ、ジョブは success になるので気づけない)。
      # 結果、更新情報の追加・削除が本番へ反映されないまま残る。実際に、運用作業が
      # ユーザー向け更新情報に出たまま消えない状態になった(#1290)。
      #
      # 本番を起動したこのタイミングで取り込み直す。ingest は pr_number で冪等、
      # かつ毎回 purge が走るので、何度呼んでも害はない。
      - name: Sync whats-new (本番起動時の取りこぼしを回収)
        if: steps.apply.outputs.desired == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          PROD_API_BASE: https://${{ vars.PROD_API_DOMAIN || 'api.shukatsu-ai.jp' }}
        run: |
          # backend のタスク起動とヘルスチェック通過を待つ。
          # ここで待たずに叩くと必ず失敗し、取りこぼしを回収できない。
          for _ in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$PROD_API_BASE/health" || echo "000")
            [ "$CODE" = "200" ] && break
            echo "backend health: $CODE (waiting...)"
            sleep 15
          done
          if [ "$CODE" != "200" ]; then
            echo "::warning::本番backendが応答しないため更新情報の取り込みを見送ります(次回起動時に回収されます)"
            exit 0
          fi

          sources=$(gh pr list --repo "${{ github.repository }}" --state merged --base main --limit 20 \
            --json number,title,body,mergedAt \
            --jq '[.[] | {pr_number: .number, title: .title, body: .body, merged_at: .mergedAt}]')

          if curl -sf -X POST "$PROD_API_BASE/api/admin/whats-new/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $ADMIN_SECRET" \
            -d "{\"sources\": $sources}" \
            --max-time 60 > /dev/null; then
            echo "更新情報を取り込みました"
          else
            echo "::warning::更新情報の取り込みに失敗しました(次回起動時に回収されます)"
          fi
