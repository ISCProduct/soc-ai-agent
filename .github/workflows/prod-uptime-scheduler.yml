name: Prod uptime scheduler

# 本番(ECS Fargate + RDS)の「指定日は終日起動」ポリシーを毎時照合する。
# docs/architecture/infra-decision-oci-stg-aws-prod.md の (B) 指定日終日起動 を実現する。
# 日付リストはDiscordの /prod-uptime コマンド(Backend: /api/discord/interactions)で
# SSM Parameter Store (/soc-app/prod-uptime-dates, カンマ区切り) に追加される。
#
# Discordの /prod コマンドは手動オーバーライド (/soc-app/prod-uptime-override) を
# on / off / auto で書き込み、このワークフローを workflow_dispatch で即時起動する。
# オーバーライドは日付リストより優先する。これが無いと、手動起動しても次の毎時実行が
# 日付リストどおりに戻してしまい「起動したのに落ちている」状態になる。
#
# デプロイ中(deployment.yml)の停止処理は gh run list で見送る(#1518)。
# ponytail: GitHub Actions の concurrency を共有する形の厳密な相互排他にはしていない。
# 同じ group にすると、pending のジョブは後から pending になったジョブに
# キャンセルされる仕様のため、毎時のこのジョブが main へのデプロイを取り消しうる。
# 代わりに「停止する直前に毎回見る」+「判定不能なら停止しない」で塞いでいる。

on:
  schedule:
    - cron: "5 * * * *" # 毎時5分(UTC)
  workflow_dispatch:

# checkout(通知スクリプトの取得)と、whats-new 取り込みの gh pr list に必要な分だけ与える。
# 以前は {} だったため、GITHUB_TOKEN で読む経路は権限不足になりうる状態だった。
# actions:read は「本番デプロイが実行中か」を gh run list で見るために必要(#1518)。
permissions:
  contents: read
  pull-requests: read
  actions: read

# 同時実行を許すと、起動側(RDSのavailable待ちで最大10分ループする)と停止側が
# すれ違い、SSMは off なのに本番が起動したまま次の毎時実行まで課金され続ける。
# cancel-in-progress で「最後の指示が勝つ」ようにする。
concurrency:
  group: prod-uptime-scheduler
  cancel-in-progress: true

jobs:
  sync-prod-uptime:
    runs-on: ubuntu-latest
    # ECS(本番)へのアクセスにはproduction環境のAWS認証情報が必要。
    # 未指定だとリポジトリ既定のAWS_ACCESS_KEY_ID(旧・ECSクラスタ作成前の認証情報)が使われ、
    # ClusterNotFoundExceptionになる(実際に発生した障害)。
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'soc-app' }}
    steps:
      # 失敗通知に automation/ops/notify-discord.sh を使うため必須。
      # checkout 漏れは automation/test/workflow-checkout-test.sh が静的に検出する。
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine desired state and apply
        id: apply
        env:
          # 停止処理の前に「本番デプロイが実行中か」を gh run list で確認する(#1518)。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TODAY_JST=$(TZ=Asia/Tokyo date +%F)

          # パラメータ未作成(初回)のみ空扱いにし、それ以外のAWSエラー(権限/スロットリング/
          # ネットワーク等)は握りつぶさずジョブを失敗させる(誤って両サービスを0にしないため)。
          if DATES=$(aws ssm get-parameter --name "/${PROJECT_NAME}/prod-uptime-dates" \
            --query 'Parameter.Value' --output text 2>/tmp/ssm_get_parameter_err); then
            :
          elif grep -q "ParameterNotFound" /tmp/ssm_get_parameter_err; then
            DATES=""
          else
            cat /tmp/ssm_get_parameter_err >&2
            exit 1
          fi

          # 手動オーバーライド。未作成(初回)は auto 扱い。
          #
          # 読めない場合にここで exit すると、日付リストどおりの起動まで巻き添えで止まり、
          # 指定日に本番が上がらなくなる。IAMに override のARNを足し忘れると必ずこれに当たる
          # (実際、CIのIAMユーザーは prod-uptime-dates だけにリソース限定されていた)。
          # そのため auto へ縮退して日付リストの反映は続け、ジョブは最後に失敗させる。
          # オートスケーリング同期の失敗と同じ扱い。
          OVERRIDE_READ_FAILED=""
          if OVERRIDE=$(aws ssm get-parameter --name "/${PROJECT_NAME}/prod-uptime-override" \
            --query 'Parameter.Value' --output text 2>/tmp/ssm_get_override_err); then
            :
          elif grep -q "ParameterNotFound" /tmp/ssm_get_override_err; then
            OVERRIDE="auto"
          else
            cat /tmp/ssm_get_override_err >&2
            echo "::error::手動オーバーライドを読めませんでした。日付リストのみで判定します(/prod は効きません)。IAMに ${PROJECT_NAME}/prod-uptime-override への ssm:GetParameter を追加してください"
            OVERRIDE="auto"
            OVERRIDE_READ_FAILED=1
          fi

          # Discord側(Go)は大文字と前後空白を無視して受理するため、手でSSMを
          # 書き換えたときに表示と実挙動が食い違わないよう、こちらでも正規化する。
          OVERRIDE=$(echo "$OVERRIDE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          # 復帰日つきオーバーライド(on:YYYY-MM-DD / off:YYYY-MM-DD)を解決する。
          # 「この日(JST)になったら auto へ戻す」という意味。
          #
          # 期限の無い off は戻し忘れると起動日が丸ごと潰れる。実際 2026-09-12 に
          # 設定された off が 9/23 まで放置され、9/24 の起動日を潰しかけたうえ、
          # 本番デプロイのマイグレーションが3回失敗していた。
          #
          # 判定は Go 側 (discord.ResolveOverride) と同じ。YYYY-MM-DD は辞書順が
          # 日付順と一致するので、両方とも文字列比較で揃えている。
          #
          # case ではなく if で書くのは、automation/test/prod-uptime-decision-test.sh が
          # 「TODAY_JST= から最初の esac まで」で判定ロジックを抽出しているため。
          # ここに esac を増やすと抽出が途中で切れ、テストが本体を素通しする。
          OVERRIDE_RAW="$OVERRIDE"
          OVERRIDE_EXPIRY=""
          if [ "${OVERRIDE%%:*}" == "on" ] || [ "${OVERRIDE%%:*}" == "off" ]; then
            if [ "$OVERRIDE" != "${OVERRIDE%%:*}" ]; then
              OVERRIDE_EXPIRY="${OVERRIDE#*:}"
              # date は環境差(GNU/BSD)とテストのスタブがあるため使わず、python3 で実在日付を見る。
              if ! echo "$OVERRIDE_EXPIRY" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
                || ! python3 -c 'import sys,datetime; datetime.date.fromisoformat(sys.argv[1])' \
                  "$OVERRIDE_EXPIRY" 2>/dev/null; then
                # 形式だけ見ると 2026-09-31 や 9999-99-99 を通してしまう。
                # 前者は9/30にも停止固定が続き、後者は事実上解除されない。
                # Go 側 (discord.ResolveOverride) は time.Parse で実在日付のみ許すので合わせる。
                echo "override='$OVERRIDE_RAW' の復帰日が不正なため auto として扱う" >&2
                OVERRIDE="auto"
              elif [[ ! "$TODAY_JST" < "$OVERRIDE_EXPIRY" ]]; then
                echo "override='$OVERRIDE_RAW' は復帰日 $OVERRIDE_EXPIRY に達したため auto として扱う (今日=$TODAY_JST)"
                OVERRIDE="auto"
              else
                echo "override='$OVERRIDE_RAW' は $OVERRIDE_EXPIRY まで有効 (今日=$TODAY_JST)"
                OVERRIDE="${OVERRIDE%%:*}"
              fi
            fi
          fi

          case "$OVERRIDE" in
            on)
              DESIRED=1
              echo "override=on -> desired_count=1 (日付リストは無視)"
              # 戻し忘れると請求で気づくことになるので、実行ログに毎回残す。
              # 復帰日つきなら自動で戻るため warning にはしない。
              if [ -n "$OVERRIDE_EXPIRY" ]; then
                echo "本番は $OVERRIDE_EXPIRY まで常時起動に固定されています(その日に auto へ自動復帰)"
              else
                echo "::warning::本番は /prod で「常時起動」に固定されています。不要なら /prod state:auto に戻してください"
              fi
              ;;
            off)
              DESIRED=0
              echo "override=off -> desired_count=0 (日付リストは無視)"
              ;;
            *)
              # auto、または想定外の値。想定外の値で本番を起動しっぱなしにする/落とすより
              # 日付リストどおりに動く方が安全なので、auto と同じ扱いにする。
              if [ "$OVERRIDE" != "auto" ]; then
                echo "override='$OVERRIDE' は未知の値のため auto として扱う" >&2
              fi
              DESIRED=0
              if echo ",$DATES," | grep -q ",$TODAY_JST,"; then
                DESIRED=1
                echo "today ($TODAY_JST) is an uptime date -> desired_count=1"
              else
                echo "today ($TODAY_JST) is not an uptime date -> desired_count=0"
              fi
              ;;
          esac

          DB_ID="${PROJECT_NAME}-mysql"
          echo "desired=$DESIRED" >> "$GITHUB_OUTPUT"

          # 本番デプロイ(deployment.yml)の実行中は「止める側」の処理をしない。
          #
          # 停止日のデプロイは、マイグレーションと反映確認のためにRDSとECSを一時的に
          # 起動する。そこへ毎時5分のこのジョブが重なると、デプロイの途中でRDSを停止し、
          # 起動したばかりの backend が "no route to host" でDBに繋がらずヘルスチェックに
          # 落ちる。3回連続で落ちるとECSのサーキットブレーカーが旧リビジョンへ
          # ロールバックし、そのイメージがECRから失効していると起動不能なタスク定義が
          # 残る。2026-09-25 に実際にこれが起きた(#1518)。
          #   09:05:41 このジョブ開始 -> 09:06:11 RDS停止
          #   09:08:00 デプロイが desired=1 -> 09:11:30 backend がDBに繋がらず
          #   09:15:03 サーキットブレーカーが :86 へロールバック -> pull できず起動不能
          #
          # 起動側(DESIRED=1)は止めない。稼働日の起動が1時間遅れる方が影響が大きく、
          # デプロイ中に起動してもぶつかる処理が無い。
          #
          # 判定できなかった場合は停止しない(fail-closed)。続行すると、上のロールバック
          # 事故をAPI障害のたびに再発させうる。見送りの代償は「本番が最大1時間起動した
          # まま残る」だけなので、ジョブを失敗させてDiscordへ流し、人が気づける形にする。
          prod_deploy_running() {
            local out attempt
            # status は in_progress / queued 以外にも waiting(承認待ち) / pending /
            # requested という未完了状態がある。列挙すると新しい状態が増えたときに
            # 「実行中0件」と誤判定するため、completed 以外を未完了として数える。
            for attempt in 1 2 3; do
              if out=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deployment.yml \
                --branch main --limit 20 --json status \
                --jq '[.[] | select(.status != "completed")] | length' 2>/tmp/gh_run_list_err); then
                # 取得できたのに空なら jq の失敗。0件と読み替えず「実行中」に倒す。
                if [ "$out" == "0" ]; then return 0; fi
                return 1
              fi
              # 一時的な失敗で毎時 @here を鳴らさないための再試行。
              # `[ ... ] && sleep` と書くと最終試行で非0を返し、set -e でステップが落ちる。
              if [ "$attempt" != "3" ]; then sleep 3; fi
            done
            cat /tmp/gh_run_list_err >&2 || true
            return 2
          }

          # 停止処理を進めて良いかを見て、進めてはいけない場合はこのステップを終える。
          # $1 には「何を見送ったか」をログ・通知に出すための名前を渡す。
          guard_stop_against_deploy() {
            # set -e 下では「非0を返す素の呼び出し」でステップが落ちる。
            # || で受けて errexit を抑えつつ戻り値を残す。
            local state=0
            prod_deploy_running || state=$?
            case $state in
              0) return 0 ;;
              1)
                echo "::notice::本番デプロイが実行中のため、$1 は見送ります。次の毎時実行で反映されます"
                exit 0
                ;;
              *)
                echo "本番デプロイの実行状況を取得できず、$1 を見送りました(本番が起動したまま残っています)" \
                  > "$RUNNER_TEMP/alert-reason.txt"
                echo "::error::本番デプロイの実行状況を取得できませんでした。デプロイ中に停止すると本番が起動不能になるため $1 は行いません(permissions の actions:read とGitHub APIの状況を確認してください)"
                exit 1
                ;;
            esac
          }
          # --- デプロイ中ガード ここまで（automation/test/prod-deploy-db-guard-test.sh が抽出する） ---

          if [ "$DESIRED" == "0" ]; then
            guard_stop_against_deploy "停止処理(desired=0 / RDS停止)"
          fi

          if [ "$DESIRED" == "1" ]; then
            # RDSを先に起動し、利用可能になってからECSを起動する
            # (backendがDB未起動のままタスク起動してクラッシュループするのを防ぐ。staging側の
            # deployment.ymlの起動待ちループと同じパターン)
            RDS_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
              --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "unknown")
            if [ "$RDS_STATUS" == "stopped" ]; then
              aws rds start-db-instance --db-instance-identifier "$DB_ID"
            fi
            for i in $(seq 1 40); do
              STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
                --query 'DBInstances[0].DBInstanceStatus' --output text)
              [ "$STATUS" == "available" ] && break
              if [ "$STATUS" == "stopped" ]; then
                aws rds start-db-instance --db-instance-identifier "$DB_ID" || true
              fi
              echo "RDS status: $STATUS (waiting...)"
              sleep 15
            done
            if [ "$STATUS" != "available" ]; then
              echo "RDS did not become available in time" >&2
              exit 1
            fi
          fi

          AUTOSCALING_FAILED=""
          # chroma -> rag-review の順に起動する(rag-reviewはCloud Map経由でchromaに接続する)。
          # RAG(履歴書レビュー/ES添削)はbackendの同期依存であり、ここから漏れると
          # 稼働日でもRAG機能だけ落ちる(実際に発生していた)。
          for SERVICE in chroma rag-review backend frontend; do
            # オートスケーリングの下限を desired と同じ値に合わせる。
            # desired_count だけ更新しても min_capacity=0 のままだと CPU ターゲット追跡が
            # 0 まで縮退させ、タスク0ではCPUメトリクスが出ないため自力復帰できない。
            # 結果として稼働日でも本番APIが断続的に503になる。max は Terraform 側の
            # 値をそのまま引き継ぐため AWS から読み取る(ハードコードすると乖離する)。
            RESOURCE_ID="service/${PROJECT_NAME}/${SERVICE}"
            if MAX=$(aws application-autoscaling describe-scalable-targets \
              --service-namespace ecs --resource-ids "$RESOURCE_ID" \
              --scalable-dimension ecs:service:DesiredCount \
              --query 'ScalableTargets[0].MaxCapacity' --output text 2>/tmp/as_describe_err); then
              if [ -z "$MAX" ] || [ "$MAX" == "None" ]; then
                # スケーラブルターゲット未登録。chroma/rag-reviewはオートスケーリング対象外
                # (Terraform側でも登録していない)ため、desired_countの更新だけで足りる。
                echo "$SERVICE: スケーラブルターゲット未登録、desired_count のみ更新する"
              elif aws application-autoscaling register-scalable-target \
                --service-namespace ecs --resource-id "$RESOURCE_ID" \
                --scalable-dimension ecs:service:DesiredCount \
                --min-capacity "$DESIRED" --max-capacity "$MAX" > /dev/null; then
                echo "$SERVICE min_capacity -> $DESIRED (max=$MAX)"
              else
                echo "$SERVICE: register-scalable-target に失敗(IAM権限を確認: application-autoscaling:RegisterScalableTarget)" >&2
                AUTOSCALING_FAILED=1
              fi
            else
              # API呼び出し自体の失敗(権限/スロットリング等)のみを失敗扱いにする。
              # 「未登録」は上のブランチで正常系として扱う。
              cat /tmp/as_describe_err >&2
              echo "$SERVICE: describe-scalable-targets に失敗(IAM権限を確認: application-autoscaling:DescribeScalableTargets)" >&2
              AUTOSCALING_FAILED=1
            fi

            CURRENT=$(aws ecs describe-services --cluster "$PROJECT_NAME" --services "$SERVICE" \
              --query 'services[0].desiredCount' --output text 2>/dev/null || echo "")
            if [ "$CURRENT" == "$DESIRED" ]; then
              echo "$SERVICE already at desired_count=$DESIRED, skipping"
              continue
            fi
            aws ecs update-service --cluster "$PROJECT_NAME" --service "$SERVICE" \
              --desired-count "$DESIRED" > /dev/null
            echo "$SERVICE updated: $CURRENT -> $DESIRED"
          done

          if [ "$DESIRED" == "0" ]; then
            # 上のECSループ(4サービス×オートスケーリング同期)で1〜2分かかる。その間に
            # デプロイが始まっていないかを、RDSを止める直前にもう一度見る。
            # 確認→停止のあいだに始まったデプロイを取りこぼすと、起動したばかりの
            # backend からDB接続を切ることになる(2026-09-25 の事象そのもの)。
            guard_stop_against_deploy "RDS停止"

            # ECSを先に0にしてから(上のループで完了済み)RDSを止める。
            # 起動中(available)の時だけ止める。starting/stopping等の遷移中に叩くとエラーになるため
            RDS_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" \
              --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "unknown")
            if [ "$RDS_STATUS" == "available" ]; then
              aws rds stop-db-instance --db-instance-identifier "$DB_ID"
              echo "RDS stopped"
            else
              echo "RDS status: $RDS_STATUS, skipping stop"
            fi
          fi

          # desired_count の反映は済ませたうえで、オートスケーリング下限の同期に
          # 失敗していればジョブを失敗させる(放置すると稼働日に0へ縮退して気づけない)。
          if [ -n "$AUTOSCALING_FAILED" ]; then
            echo "オートスケーリング下限(min_capacity)の同期に失敗しました" >&2
            exit 1
          fi

          if [ -n "$OVERRIDE_READ_FAILED" ]; then
            echo "手動オーバーライドを読めませんでした(/prod が無効のまま動いています)" >&2
            exit 1
          fi

      # 本番が停止している間に main へデプロイすると、deployment.yml の
      # 「Sync whats-new from merged PRs」は curl に失敗して取り込みをスキップする
      # (|| echo で握りつぶされ、ジョブは success になるので気づけない)。
      # 結果、更新情報の追加・削除が本番へ反映されないまま残る。実際に、運用作業が
      # ユーザー向け更新情報に出たまま消えない状態になった(#1290)。
      #
      # 本番を起動したこのタイミングで取り込み直す。ingest は pr_number で冪等、
      # かつ毎回 purge が走るので、何度呼んでも害はない。
      - name: Sync whats-new (本番起動時の取りこぼしを回収)
        id: whatsnew
        if: steps.apply.outputs.desired == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          PROD_API_BASE: https://${{ vars.PROD_API_DOMAIN || 'api.shukatsu-ai.jp' }}
        run: |
          # backend のタスク起動とヘルスチェック通過を待つ。
          # ここで待たずに叩くと必ず失敗し、取りこぼしを回収できない。
          for _ in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$PROD_API_BASE/health" || echo "000")
            [ "$CODE" = "200" ] && break
            echo "backend health: $CODE (waiting...)"
            sleep 15
          done
          if [ "$CODE" != "200" ]; then
            echo "healthy=0" >> "$GITHUB_OUTPUT"
            echo "::warning::本番backendが応答しないため更新情報の取り込みを見送ります(次回起動時に回収されます)"
            exit 0
          fi
          echo "healthy=1" >> "$GITHUB_OUTPUT"

          # 本番の admin_secret は Secrets Manager を正とする(#1158)。
          # 読めない場合だけリポジトリシークレットへフォールバックする(移行期間の両対応)。
          # 失敗理由(AccessDenied / ResourceNotFound / ExpiredToken)を残す。値は stdout 側。
          sm_err=$(mktemp)
          PROD_ADMIN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${PROJECT_NAME:-soc-app}/admin" --query SecretString --output text 2>"$sm_err" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('admin_secret',''))" 2>>"$sm_err" || true)
          if [ -n "$PROD_ADMIN_SECRET" ]; then
            echo "::add-mask::$PROD_ADMIN_SECRET"
          else
            echo "::warning::Secrets Manager から admin_secret を読めませんでした。リポジトリシークレットで続行します(IAMに secretsmanager:GetSecretValue を確認してください)"
            sed 's/^/  aws: /' "$sm_err"
            PROD_ADMIN_SECRET="$ADMIN_SECRET"
          fi
          rm -f "$sm_err"

          sources=$(gh pr list --repo "${{ github.repository }}" --state merged --base main --limit 20 \
            --json number,title,body,mergedAt \
            --jq '[.[] | {pr_number: .number, title: .title, body: .body, merged_at: .mergedAt}]')

          # 起動確認済みの状態で 401/403 なら「停止中」ではなく鍵の不一致。
          # ここは最後の回収経路なので、warning で流すと誰も気づけない。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PROD_API_BASE/api/admin/whats-new/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $PROD_ADMIN_SECRET" \
            -d "{\"sources\": $sources}" \
            --max-time 60 || true)
          case "$code" in
            2*)
              echo "更新情報を取り込みました"
              ;;
            401|403)
              # このステップは continue-on-error なので、ここで exit しても
              # ジョブは落ちない。下の「失敗させる」ステップへ出力で伝える。
              echo "rejected=$code" >> "$GITHUB_OUTPUT"
              echo "::error::更新情報の取り込みが $code で拒否されました(admin_secret が本番の値と一致していない、または未設定)"
              ;;
            *)
              echo "::warning::更新情報の取り込みに失敗しました(HTTP $code / 次回起動時に回収されます)"
              ;;
          esac

      # 「起動したのに backend が上がってこない」は最も重要な事象なのに、
      # 上のステップは continue-on-error + warning で成功扱いになっていた(#1354)。
      # ジョブの失敗へ昇格させ、下の通知に乗せる。
      - name: 起動日にbackendが応答しない場合は失敗させる
        if: steps.apply.outputs.desired == '1' && steps.whatsnew.outputs.healthy != '1'
        run: |
          echo "本番を起動しましたが backend の /health が 200 を返しませんでした" > "$RUNNER_TEMP/alert-reason.txt"
          echo "::error::本番を起動しましたが backend の /health が 200 を返しませんでした"
          exit 1

      # 鍵の不一致は「停止中で届かない」と違い、放っておいても直らない。
      # ここが最後の回収経路なので、警告で流すと更新情報が出ないまま気づけない。
      - name: 更新情報の取り込みが拒否されたら失敗させる
        if: steps.whatsnew.outputs.rejected != ''
        run: |
          reason="本番への更新情報の取り込みが HTTP ${{ steps.whatsnew.outputs.rejected }} で拒否されました(admin_secret の不一致または未設定)"
          echo "$reason" > "$RUNNER_TEMP/alert-reason.txt"
          echo "::error::$reason"
          exit 1

      # schedule で動くジョブは誰も結果を見ない。失敗を人へ届ける唯一の経路。
      # concurrency の cancel-in-progress によるキャンセルは failure() に含まれない(通知されない)。
      - name: 失敗をDiscordへ通知
        if: failure()
        env:
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          REASON=""
          if [ -f "$RUNNER_TEMP/alert-reason.txt" ]; then
            REASON=$(cat "$RUNNER_TEMP/alert-reason.txt")
          fi
          ./automation/ops/notify-discord.sh "@here ❌ **本番の起動/停止ジョブが失敗しました**
          ${REASON}
          稼働日であれば本番が起動していない可能性があります。/prod state:on で手動起動できます。
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
