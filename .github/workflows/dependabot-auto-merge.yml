name: Dependabot Auto Merge

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Approve & Merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 自動承認は行わない。
      # このリポジトリでは「Allow GitHub Actions to create and approve pull requests」が
      # 無効なため、gh pr review --approve は必ず
      # 「GitHub Actions is not permitted to approve pull requests」で失敗する。
      # 失敗しても auto-merge の有効化自体は下のステップで行えるので、
      # 承認は人が行う運用にして、通らないAPIを叩き続けるのをやめる。

      # 対象は develop 宛のみ。main 宛で自動マージすると、依存更新が
      # develop・release のゲートを通らずに本番(ECS on Fargate)へ自動デプロイされる。
      # Terraform プロバイダの minor は、本番のインフラへ承認だけで入らないように外す。
      # Docker のベースイメージ更新は semver-minor になりうるが、ここでは従来どおり対象に残す。
      - name: Enable auto-merge for minor/patch updates
        if: |
          steps.metadata.outputs.package-ecosystem != 'terraform' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
