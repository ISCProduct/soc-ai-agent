name: PR → Backlog 同期

# PR に Backlog 課題キー（例: SOCAIAGENT-8）が含まれる場合に Backlog 課題を自動更新します。
#
# 動作:
#   - PR オープン/更新時          : ステータスを「処理中」に変更し、説明に PR URL を追記
#   - PR クローズ（非マージ）      : ステータスを「未対応」に戻す
#   - PR マージ時（マージ先ブランチに応じて切替。develop→release→main の
#     プロモーションPRは複数 feature PR の束ねマージのため、各コミットが
#     参照する元PR番号からも Backlog キーを解決し、まとめて更新する。
#     参照先が feature PR ではなく別のプロモーションPRだった場合（例:
#     release→main のコミットが develop→release プロモーションPR自身を指す）は、
#     そのPRのコミットもさらに辿る（最大3階層）。プロモーションPR自身のタイトル・
#     本文には Backlog キーが無いことが多いため、この再帰が無いと release→main の
#     マージだけキー解決に失敗して更新が漏れる: #recovery-2026-08-23):
#       - develop へマージ : 「ステージング環境反映」
#       - release へマージ : 「リリース待ち」
#       - main    へマージ : 「完了」
#     ※「ステージング環境反映」「リリース待ち」は Backlog 側で事前にカスタム
#       ステータスとして作成しておく必要がある（名前からIDを動的解決するため
#       完全一致必須）。未作成の場合はジョブがエラーで停止し、作成を促すログを出す。
#
# 課題キーの検出場所（優先順）:
#   1. PR タイトルの [PROJ-N] プレフィックス
#   2. PR 本文の <!-- backlog-key:PROJ-N --> マーカー
#   3. PR 本文の「Backlog: PROJ-N」記述
#   4. PR 本文の Closes/Fixes/Resolves #N が指す GitHub Issue から解決
#
# 手動リカバリ（workflow_dispatch）:
#   何らかの理由でマージ時の自動更新が漏れた（例: キー解決の連鎖が当時のロジックの
#   階層上限を超えていた）場合、マージ済みPR番号を指定して再実行できる。
#   マージ時と全く同じロジックで再解決・再更新するだけで、二重副作用は無い
#   （Backlogのステータス更新は冪等）。
#
# 必要な GitHub Secrets:
#   BACKLOG_SPACE_ID    : スペースID（例: myspace ← myspace.backlog.jp の場合）
#   BACKLOG_API_KEY     : Backlog APIキー
#   BACKLOG_PROJECT_KEY : プロジェクトキー（例: SOCAIAGENT）
#   BACKLOG_DOMAIN      : ドメイン（省略時は backlog.jp → backlog.com の順に自動判定）

on:
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'ステータス反映が漏れたマージ済みPRの番号（手動リカバリ用）'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PR を Backlog 課題へ反映
        env:
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
          BACKLOG_SPACE_ID: ${{ secrets.BACKLOG_SPACE_ID }}
          BACKLOG_PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY }}
          BACKLOG_DOMAIN: ${{ secrets.BACKLOG_DOMAIN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          ACTION: ${{ github.event_name == 'workflow_dispatch' && 'closed' || github.event.action }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, json, re, urllib.request

          sys.path.insert(0, ".github/scripts")
          from backlog_client import load_backlog_env, resolve_bl_base, bl_request as _bl_request

          API_KEY, SPACE_ID, PROJ_KEY, DOMAIN = load_backlog_env()
          PR_NUMBER = os.environ.get('PR_NUMBER', '')
          ACTION    = os.environ['ACTION']
          GH_TOKEN  = os.environ.get('GH_TOKEN', '')
          GH_REPO   = os.environ.get('GH_REPO', '')

          # マージ先ブランチ → Backlog ステータス名（このブランチに現れない場合は対象外）
          MERGE_STATUS_NAME_BY_BRANCH = {
              'develop': 'ステージング環境反映',
              'release': 'リリース待ち',
              'main':    '完了',
          }

          BL_BASE, BL_DOMAIN = resolve_bl_base(SPACE_ID, API_KEY, DOMAIN)

          def bl_request(method, path, data=None):
              return _bl_request(BL_BASE, API_KEY, method, path, data, fatal=False)

          def gh_api(path):
              url = f"https://api.github.com/repos/{GH_REPO}{path}"
              req = urllib.request.Request(url)
              req.add_header('Authorization', f'Bearer {GH_TOKEN}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def extract_bl_key(title, body):
              # 1. タイトルの [PROJ-N] プレフィックス
              m = re.search(rf'\[({re.escape(PROJ_KEY)}-\d+)\]', title or '')
              if m:
                  return m.group(1)
              # 2. 本文の <!-- backlog-key:PROJ-N --> マーカー
              m = re.search(r'<!--\s*backlog-key:(\S+?)\s*-->', body or '')
              if m:
                  return m.group(1)
              # 3. 本文の「Backlog: PROJ-N」記述
              m = re.search(rf'[Bb]acklog[：:]\s*({re.escape(PROJ_KEY)}-\d+)', body or '')
              if m:
                  return m.group(1)
              return None

          def resolve_bl_key_from_gh_issue(body):
              """PR 本文の Closes/Fixes/Resolves #N から GitHub Issue を取得し Backlog キーを解決する"""
              if not GH_TOKEN or not GH_REPO:
                  return None
              nums = re.findall(
                  r'(?:closes?|fixes?|resolves?)\s+#(\d+)',
                  body or '', re.IGNORECASE
              )
              for num in nums:
                  try:
                      issue = gh_api(f"/issues/{num}")
                  except Exception:
                      continue
                  bl_key = extract_bl_key(issue.get('title', ''), issue.get('body') or '')
                  if bl_key:
                      print(f"GitHub Issue #{num} から Backlog キーを解決: {bl_key}")
                      return bl_key
              return None

          def gh_get_issue_or_pr(number):
              """PR番号もGitHub上ではIssue番号として扱えるため issues API で取得する。
              戻り値に 'pull_request' キーが含まれていれば、それはPR(issueではない)。"""
              try:
                  return gh_api(f"/issues/{number}")
              except Exception:
                  return None

          def resolve_bl_keys_from_commits(pr_number, depth=3, _seen_numbers=None):
              """プロモーションPRのコミットが参照する番号からBacklogキーを解決する。
              参照先がBacklogキーを持たない別のプロモーションPRだった場合は、
              そのPRのコミットもさらに辿る（depth階層まで）。"""
              if not GH_TOKEN or not GH_REPO or not pr_number or depth <= 0:
                  return set()
              if _seen_numbers is None:
                  _seen_numbers = set()

              try:
                  commits = gh_api(f"/pulls/{pr_number}/commits?per_page=250")
              except Exception as e:
                  print(f"コミット一覧の取得に失敗しました(#{pr_number}): {e}", file=sys.stderr)
                  return set()

              keys = set()
              for c in commits:
                  headline = (c.get('commit', {}).get('message') or '').split('\n', 1)[0]
                  for m in re.finditer(r'#(\d+)', headline):
                      num = m.group(1)
                      if num in _seen_numbers or num == str(pr_number):
                          continue
                      _seen_numbers.add(num)
                      sub = gh_get_issue_or_pr(num)
                      if not sub:
                          continue
                      k = extract_bl_key(sub.get('title', ''), sub.get('body') or '')
                      if k:
                          keys.add(k)
                      elif 'pull_request' in sub:
                          # 参照先も直接キーを持たないPR: さらに1段階そのPRのコミットを辿る
                          keys |= resolve_bl_keys_from_commits(num, depth=depth - 1, _seen_numbers=_seen_numbers)
              return keys

          def load_status_id_map():
              statuses = bl_request('GET', f"/projects/{PROJ_KEY}/statuses")
              return {s['name']: s['id'] for s in (statuses or [])}

          def resolve_merge_status(status_map, base_ref):
              """戻り値: (status_id, status_name)。対象外ブランチなら (None, None)。
              名前解決失敗なら (False, status_name) を返す（「完了」は既定ステータスのため id=4 にフォールバック）"""
              name = MERGE_STATUS_NAME_BY_BRANCH.get(base_ref)
              if name is None:
                  return None, None
              if name in status_map:
                  return status_map[name], name
              if name == '完了':
                  return 4, name
              return False, name

          def update_backlog_status(bl_key, status_id, *, pr_url_section=None):
              data = {'statusId': status_id}
              if pr_url_section:
                  issue = bl_request('GET', f"/issues/{bl_key}")
                  if issue:
                      current_desc = issue.get('description') or ''
                      pr_pattern = r'\n*## GitHub PR\n[^\n]*'
                      if re.search(pr_pattern, current_desc):
                          data['description'] = re.sub(pr_pattern, pr_url_section, current_desc)
                      else:
                          data['description'] = current_desc.rstrip() + pr_url_section
              result = bl_request('PATCH', f"/issues/{bl_key}", data)
              return result is not None

          if not PR_NUMBER:
              print("PR番号が取得できません。スキップします。")
              sys.exit(0)

          pr = gh_api(f"/pulls/{PR_NUMBER}")
          PR_TITLE    = pr.get('title', '')
          PR_BODY     = pr.get('body') or ''
          PR_URL      = pr.get('html_url', '')
          PR_MERGED   = bool(pr.get('merged'))
          PR_BASE_REF = (pr.get('base') or {}).get('ref', '')

          own_key = extract_bl_key(PR_TITLE, PR_BODY)
          if not own_key:
              own_key = resolve_bl_key_from_gh_issue(PR_BODY)

          # ---- PR オープン/更新時: 処理中 ----
          if ACTION != 'closed':
              if not own_key:
                  print("Backlog 課題キーが見つかりません。スキップします。")
                  sys.exit(0)
              pr_section = f'\n\n## GitHub PR\n{PR_URL}'
              if update_backlog_status(own_key, 2, pr_url_section=pr_section):
                  print(f"Backlog 課題を更新しました: {own_key} (ステータス: 処理中、PR URL を追記)")
              sys.exit(0)

          # ---- PR クローズ（非マージ）: 未対応に戻す ----
          if not PR_MERGED:
              if not own_key:
                  print("Backlog 課題キーが見つかりません。スキップします。")
                  sys.exit(0)
              if update_backlog_status(own_key, 1):
                  print(f"Backlog 課題を更新しました: {own_key} (ステータス: 未対応)")
              sys.exit(0)

          # ---- PR マージ時: マージ先ブランチに応じたステータスへ ----
          status_map = load_status_id_map()
          status_id, status_name = resolve_merge_status(status_map, PR_BASE_REF)
          if status_id is None:
              print(f"対象外のマージ先ブランチ '{PR_BASE_REF}' のため Backlog ステータス更新をスキップします。")
              sys.exit(0)
          if status_id is False:
              print(
                  f"エラー: Backlog にステータス '{status_name}' が見つかりません。"
                  f" Backlog のプロジェクト設定でカスタムステータスとして追加してください"
                  f"（既存ステータス: {', '.join(status_map.keys())}）。",
                  file=sys.stderr,
              )
              sys.exit(1)

          keys = set(resolve_bl_keys_from_commits(PR_NUMBER))
          if own_key:
              keys.add(own_key)
          if not keys:
              print("Backlog 課題キーが見つかりません。スキップします。")
              sys.exit(0)

          print(f"検出した Backlog 課題キー: {', '.join(sorted(keys))}")
          pr_section = f'\n\n## GitHub PR\n{PR_URL}'
          for key in sorted(keys):
              ok = update_backlog_status(key, status_id, pr_url_section=pr_section if key == own_key else None)
              if ok:
                  print(f"Backlog 課題を更新しました: {key} (ステータス: {status_name})")
          PYEOF
