# RAG（Python）の型チェック（SOCAIAGENT-575）。CI の rag-lint.yml で走らせる。
[mypy]
python_version = 3.12
ignore_missing_imports = True
# テスト・学習用スクリプト・評価スクリプトは対象外（本番で動くコードだけを見る）
exclude = (^|/)(tests|training|scripts|evaluation)/

# 型エラーが残っているモジュール（導入時点で 15 件）。直したらここから外すこと。
# 一度に直さないのは、ほかの PR が同じファイルを変えていて競合するため。
[mypy-routers.health]
ignore_errors = True
[mypy-services.async_utils]
ignore_errors = True
[mypy-services.es_review]
ignore_errors = True
[mypy-services.langchain_runtime]
ignore_errors = True
[mypy-services.research]
ignore_errors = True
[mypy-services.sentry_setup]
ignore_errors = True
[mypy-vector_store]
ignore_errors = True
