server {
  listen 80;
  server_name _;

  # ALB の idle_timeout(90秒) より長くする。nginx 既定の75秒だと ALB が
  # 再利用しようとした接続を nginx 側が先に閉じ、502 を返しうる
  # (AWS はターゲット側のアイドルタイムアウトを LB より長くすることを推奨)。
  keepalive_timeout 100s;

  # ALB ヘルスチェック用。Next.js が落ちていても EC2+nginx が生きていれば 200 を返す。
  location = /edge-healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /service-unavailable.html {
    root /usr/share/nginx/html/static;
    internal;
  }

  location = /service-starting.html {
    root /usr/share/nginx/html/static;
    internal;
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    # staging は ALB -> この nginx -> frontend の2段。ここが60秒のままだと
    # ALB を90秒にしても実効上限は60秒で、ES添削(#1556)は本番と挙動が違ってしまう。
    proxy_read_timeout 90s;
    proxy_intercept_errors on;
    # 起動直後は frontend が未応答のため OGP 付き起動中ページを返す
    error_page 502 503 504 =503 /service-starting.html;
  }
}
