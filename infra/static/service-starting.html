<!DOCTYPE html>

<head>

  <meta name="twitter:card" content="summary" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f6f6;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 16px;
    }
    main { max-width: 420px; text-align: center; }
    .label { font-size: 13px; font-weight: 700; color: #ec5b13; margin-bottom: 8px; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 12px; }
    p { margin: 0 0 24px; color: #64748b; line-height: 1.6; }
    .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button, a.btn {
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .primary { background: #ec5b13; color: #fff; }
    .secondary { background: transparent; color: #ec5b13; border: 1px solid #ec5b13; }
  </style>
</head>
<body>
  <main>
    <div class="label">起動中</div>
    <h1>サーバーを起動しています</h1>
    <p>アプリケーションの起動処理中です。1〜2分ほどお待ちいただいてから再試行してください。</p>
    <div class="actions">
      <button type="button" class="primary" onclick="location.reload()">再試行</button>
      <a class="btn secondary" href="/">トップへ</a>
    </div>
  </main>
</body>
