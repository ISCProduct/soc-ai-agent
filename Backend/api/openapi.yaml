openapi: 3.0.3

# SOC AI Agent の HTTP API。
#
# これは手で書くファイル。生成しない。
# 実装に登録されている全エンドポイントの一覧は api/routes.txt（自動生成）にある。
#
# 全 252 本を記載済み（網羅率 100%）。
# 実装と spec は双方向で突き合わせており、どちらかに無いものがあると CI が落ちる。
# 網羅率は `cd Backend && go test ./internal/routes/ -v -run TestOpenAPIPaths` で出る。
#
# 実装に無いパスを書く / 実装にあるパスを書き忘れる、どちらも CI で落ちる
# （inventory_test.go の TestOpenAPIPathsExistInImplementation）。
# 体裁（summary・tags・security・responses の有無）は TestOpenAPILint が見る。

info:
  title: SOC AI Agent API
  version: "1.0.0"
  description: |
    採用支援 SaaS のバックエンド API。

    ## 認証

    方式が4つある。どれを使うかはエンドポイントごとの `security` を見ること。

    | 方式 | ヘッダ | 用途 |
    |---|---|---|
    | `userToken` | `X-User-Token` | 学生・教員。ログインで発行される短TTLのJWT |
    | `adminAuth` | `X-Admin-Email` + `X-Admin-Token` | 管理画面。管理者本人の認証 |
    | `serviceSecret` | `X-Admin-Secret` | CI・運用からのマシン間呼び出し。管理者になりすまさない |
    | `companyCookie` | Cookie | 企業ポータル。httpOnly Cookie 3本 |

    テナントの切り替えが必要な場合は `X-Tenant-Slug` を併せて送る。

    ## エラー

    Echo の `HTTPError` をそのまま返すため、本文は `{"message": "..."}` 形式。
    一部の古いエンドポイントは `{"error": "..."}` を返す。統一は未完。

servers:
  - url: http://localhost:8080
    description: ローカル開発
  - url: https://stg.shukatsu-ai.jp
    description: staging

tags:
  - name: auth
    description: 学生・教員の認証とプロフィール
  - name: chat
    description: 診断チャットとスコア
  - name: questions
    description: 質問の生成・管理

  - name: interviews
    description: AI面接のセッション・発話・レポート
  - name: realtime
    description: 面接のリアルタイム音声セッション
  - name: resume
    description: 職務経歴書のアップロードと添削
  - name: es
    description: エントリーシートの添削とリライト（未ログインでも使える）
  - name: schedule
    description: 選考スケジュール
  - name: google-calendar
    description: Google カレンダー連携
  - name: admin-companies
    description: 管理画面の企業カタログ・求人・面接質問
  - name: admin-crawl
    description: 管理画面のクロールとスクレイパ
  - name: admin-vector
    description: 管理画面のベクトルストア
  - name: admin-schools
    description: 管理画面の学校・企業承認・掲載申請
  - name: admin-organizations
    description: 管理画面の組織（テナント）
  - name: admin-users
    description: 管理画面の利用者
  - name: admin-analytics
    description: 管理画面のダッシュボード・選考・面接・監査
  - name: admin-score
    description: 管理画面のスコア検証とプロファイル再計算
  - name: admin-costs
    description: 管理画面のコスト可視化
  - name: admin-training
    description: ファインチューニング用の学習データ
  - name: release-notes
    description: リリースノート
  - name: companies
    description: 企業情報の投稿
  - name: ops
    description: 監視用（認証なし、またはトークン）
  - name: user
    description: 学生本人のプロフィール・希望条件・案内
  - name: applications
    description: 学生の応募と選考
  - name: hr
    description: 企業の採用担当向け（学生トークンで認証）
  - name: collective-insights
    description: 集合知レコメンド（匿名集計）
  - name: github
    description: GitHub 連携とスキル推定
  - name: company-auth
    description: 企業ポータルの認証
  - name: company-portal
    description: 企業ポータル（自社の求人・応募・学生検索）
components:
  securitySchemes:
    userToken:
      type: apiKey
      in: header
      name: X-User-Token
    adminAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: 併せて `X-Admin-Email` も必要。
    serviceSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
    companyCookie:
      type: apiKey
      in: cookie
      name: company_user_token

    metricsToken:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <token>`。トークン未設定なら公開しない。"
  responses:
    Unauthorized:
      description: 認証情報が無い、または無効
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 権限が足りない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: レート制限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            message: "Too Many Requests: お試し回数の上限に達しました。しばらく待ってから再試行してください。"

    PlatformAdminOnly:
      description: |
        **システム管理者専用。** 担当校を持つ教員・学園側管理者は 403。
        `EchoRequirePlatformAdmin` が担当校の有無で判定する。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CompanyOwnerOnly:
      description: |
        **企業ユーザーの `owner` のみ実行できる。** `member` は 403。
        ロールはコントローラ側で判定する。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    AuthResponse:
      type: object
      description: |
        ログイン・登録・リフレッシュの共通レスポンス。
        `token` は管理者のみ、`user_token` と `refresh_token` は全ユーザーに入る。
      required: [user_id, email, name, is_guest, target_level, is_admin, email_verified]
      properties:
        user_id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        is_guest: { type: boolean }
        target_level: { type: string, description: "新卒 / 中途" }
        school_name: { type: string }
        is_admin: { type: boolean }
        certifications_acquired: { type: string }
        certifications_in_progress: { type: string }
        avatar_url: { type: string }
        oauth_provider: { type: string, description: "google / github" }
        token: { type: string, description: 管理者トークン。管理者のみ }
        user_token: { type: string, description: ユーザー認証トークン（短TTL） }
        refresh_token: { type: string, description: "リフレッシュトークン（#616）" }
        email_verified: { type: boolean }
        requires_re_verification: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        name: { type: string }
        target_level: { type: string }
        school_name: { type: string }
        certifications_acquired: { type: string }
        certifications_in_progress: { type: string }
        registration_token: { type: string }
        promote_guest:
          type: boolean
          description: |
            ゲストの診断結果を引き継いで本登録するか。
            対象のゲストは `X-User-Token` から特定する。この値は意思表明にすぎず、
            誰を昇格するかの決定には使わない。

    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string }
        target_level: { type: string }
        school_name: { type: string }
        certifications_acquired: { type: string }
        certifications_in_progress: { type: string }

    UserWeightScore:
      type: object
      description: 10カテゴリの重みスコア。
      properties:
        id: { type: integer }
        user_id: { type: integer }
        session_id: { type: string }
        category:
          type: string
          enum:
            - technical_orientation
            - teamwork_orientation
            - leadership_orientation
            - creativity_orientation
            - stability_orientation
            - growth_orientation
            - work_life_balance
            - challenge_seeking
            - detail_orientation
            - communication_skill
        score: { type: integer, minimum: 0, maximum: 100 }

    PhaseProgress:
      type: object
      description: 診断4フェーズの進捗。
      properties:
        phase_name:
          type: string
          enum: [job_analysis, interest_analysis, aptitude_analysis, future_analysis]
        answered_questions: { type: integer }
        min_questions: { type: integer }
        is_complete: { type: boolean }

    ChatRequest:
      type: object
      required: [session_id, message]
      properties:
        user_id: { type: integer, description: サーバ側で X-User-Token から決まるため省略可 }
        session_id: { type: string }
        message: { type: string }
        industry_id: { type: integer }
        job_category_id: { type: integer }

    ChatResponse:
      type: object
      required: [response, is_complete, total_questions, answered_questions]
      properties:
        response: { type: string }
        question_weight_id: { type: integer }
        current_scores:
          type: array
          items: { $ref: "#/components/schemas/UserWeightScore" }
        current_phase: { $ref: "#/components/schemas/PhaseProgress" }
        all_phases:
          type: array
          items: { $ref: "#/components/schemas/PhaseProgress" }
        is_complete: { type: boolean }
        is_terminated:
          type: boolean
          description: 質問と無関係な回答が続いてチャットを終了した場合に true。
        suggest_restart: { type: boolean }
        invalid_answer_count: { type: integer }
        total_questions: { type: integer }
        answered_questions: { type: integer }
        evaluated_categories: { type: integer }
        total_categories: { type: integer }

    InterviewSession:
      type: object
      description: 面接セッション。モデルではなく専用DTOを返す。
      required: [id, user_id, status, language, interviewer_gender, estimated_cost_usd, template_version, created_at, updated_at]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        status: { type: string, description: "作成直後から終了までの状態" }
        language: { type: string, default: ja }
        interviewer_gender: { type: string, default: female }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        estimated_cost_usd: { type: number, format: double }
        template_version: { type: string, default: v1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScheduleEvent:
      type: object
      description: 選考スケジュールイベント。
      required: [id, user_id, company_name, stage, scheduled_at]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        company_name: { type: string }
        stage:
          type: string
          enum: [書類選考, 1次面接, 2次面接, 最終面接, 内定, その他]
        title: { type: string }
        scheduled_at: { type: string, format: date-time }
        notes: { type: string }
        google_calendar_event_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StarBreakdown:
      type: object
      description: STAR法の分解結果。
      properties:
        situation: { type: string }
        task: { type: string }
        action: { type: string }
        result: { type: string }

    ESRewriteRequest:
      type: object
      required: [original_text, question_type]
      properties:
        original_text: { type: string }
        question_type:
          type: string
          enum: [志望動機, 自己PR, 学チカ, その他]
        tech_stack: { type: string, description: 任意。使用技術スタック }
        company_name: { type: string, description: 任意。RAG が企業情報を参照する }
        char_limit: { type: integer, nullable: true, description: "設問の文字数上限（#1523）" }
        char_limit_mode: { type: string }

    ESRewriteResponse:
      type: object
      properties:
        rewritten_text: { type: string }
        star: { $ref: "#/components/schemas/StarBreakdown" }
        improved_text_length: { type: integer }
        char_limit_satisfied: { type: boolean, nullable: true }

    ESReviewRequest:
      type: object
      required: [es_text, question_type]
      properties:
        es_text: { type: string }
        question_type: { type: string }
        company_name: { type: string }
        char_limit: { type: integer, nullable: true }
        char_limit_mode: { type: string, description: "未指定は RAG 側の既定（上限なし / within）" }

    ESReviewResponse:
      type: object
      properties:
        improved_text: { type: string }
        improved_text_length: { type: integer }
        char_limit_satisfied: { type: boolean, nullable: true }
        star: { $ref: "#/components/schemas/StarBreakdown" }

    ResumeStatus:
      type: object
      description: "履歴書の対応要否（#1030）。リマインダー表示の判定に使う。"
      required: [has_document, needs_attention]
      properties:
        has_document: { type: boolean, description: 一度でもアップロードしているか }
        latest_score: { type: integer, nullable: true, minimum: 0, maximum: 100, description: 最新レビューのスコア。未生成なら null }
        needs_attention: { type: boolean, description: 学生に改善を促すべき状態か }

    Company:
      type: object
      description: |
        企業。`models/company.go` の GORM モデルをそのまま返す。
        企業カタログは全テナント共有で、学校ごとの承認は別テーブルで管理する。
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        name_reading: { type: string, description: 企業名の読み仮名 }
        description: { type: string }
        industry: { type: string }
        employee_count: { type: integer }
        employee_count_basis: { type: string, enum: [consolidated, standalone] }
        founded_year: { type: integer }
        location: { type: string }
        website_url: { type: string }
        logo_url: { type: string }
        corporate_number: { type: string, maxLength: 13, description: 法人番号 }
        source_type: { type: string, enum: [official, job_site, manual, scrape, web_search] }
        source_url: { type: string }
        source_fetched_at: { type: string, format: date-time }
        is_provisional: { type: boolean, default: true }
        is_guest_entry: { type: boolean, default: false }
        data_status: { type: string, enum: [draft, published], default: draft }
        gbiz_last_synced_at: { type: string, format: date-time }
        gbiz_sync_status: { type: string, enum: [success, failed] }
        gbiz_sync_message: { type: string }
        info_fetched_at: { type: string, format: date-time }
        jobs_fetched_at: { type: string, format: date-time }
        tech_fetched_at: { type: string, format: date-time }
        relations_fetched_at: { type: string, format: date-time }
        last_model_used: { type: string }
        last_fetch_confidence: { type: string, enum: [high, medium, low] }
        culture: { type: string }
        work_style: { type: string, description: "リモート / ハイブリッド / オフィス" }
        welfare_details: { type: string }
        tech_stack: { type: string, description: JSON文字列。言語・フレームワーク }
        infra_stack: { type: string, description: JSON文字列。AWS/GCP/Azure 等 }
        cicd_tools: { type: string, description: JSON文字列 }
        development_style: { type: string, description: スクラム / ウォーターフォール等 }
        main_business: { type: string }
        average_age: { type: number, format: double }
        female_ratio: { type: number, format: double, description: 女性比率（%） }
        is_active: { type: boolean, default: true }
        is_verified: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    CompanyUser:
      type: object
      description: 企業ポータルにログインできる担当者。
      properties:
        id: { type: integer }
        company_id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [owner, member] }
        disabled_at: { type: string, format: date-time, nullable: true }

    CompanyCandidate:
      type: object
      description: 企業名の検索候補。
      properties:
        name: { type: string, description: 正規化した企業名 }
        description: { type: string }
        source: { type: string, description: "`db` なら既存DB由来。それ以外は外部検索由来" }
        exists: { type: boolean }
        confidence: { type: string, enum: [high, medium, low] }
        company_id: { type: integer, nullable: true }

    Application:
      type: object
      description: 学生の応募と選考ステータス。
      properties:
        id: { type: integer }
        company_id: { type: integer }
        company_name: { type: string }
        company_industry: { type: string }
        match_id: { type: integer }
        status:
          type: string
          enum: [not_applied, applied, document_screening, document_passed,
                 interview_scheduled, interview_in_progress, offered, accepted,
                 withdrawn, rejected]
        notes: { type: string }
        applied_at: { type: string, format: date-time, nullable: true }
        status_updated_at: { type: string, format: date-time, nullable: true }
paths:
  # ── auth（認証不要）────────────────────────────────
  /api/auth/request-registration:
    post:
      tags: [auth]
      summary: 本登録の前に確認メールを送る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      security: []
      responses:
        "200": { description: 送信した }
        "400": { description: メールアドレスの形式が不正 }

  /api/auth/verify-registration:
    post:
      tags: [auth]
      summary: 確認メールのトークンを検証して registration_token を得る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      security: []
      responses:
        "200": { description: 検証に成功。registration_token を返す }
        "400": { description: トークンが無効か期限切れ }

  /api/auth/register:
    post:
      tags: [auth]
      summary: 本登録
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      security: []
      responses:
        "200":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { description: 入力が不正 }
        "409": { description: すでに登録済みのメールアドレス }

  /api/auth/login:
    post:
      tags: [auth]
      summary: ログイン
      description: IP 単位のレート制限がかかる。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      security: []
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/guest:
    post:
      tags: [auth]
      summary: ゲストユーザーを作る
      description: 登録せずに診断を試すための経路。後から promote_guest で引き継げる。
      security: []
      responses:
        "200":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }

  /api/auth/verify-email:
    get:
      tags: [auth]
      summary: メールアドレスの確認
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      security: []
      responses:
        "200": { description: 確認した }
        "400": { description: トークンが無効か期限切れ }

  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: パスワード再設定メールを送る
      description: IP 単位のレート制限がかかる。存在しないメールでも 200 を返す（存在を伏せる）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      security: []
      responses:
        "200": { description: 受け付けた }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: パスワードを再設定する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      security: []
      responses:
        "200": { description: 再設定した }
        "400": { description: トークンが無効か期限切れ }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: アクセストークンを更新する
      description: |
        リフレッシュトークン自体が認証情報なので `X-User-Token` は不要（#616）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      security: []
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: ログアウト（リフレッシュトークンを失効させる）
      security: []
      responses:
        "200": { description: ログアウトした }

  /api/auth/google:
    get:
      tags: [auth]
      summary: Google OAuth を開始する
      security: []
      responses:
        "302": { description: Google の認可画面へリダイレクト }

  /api/auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth のコールバック
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      security: []
      responses:
        "302": { description: フロントエンドへリダイレクト }

  /api/auth/github:
    get:
      tags: [auth]
      summary: GitHub OAuth を開始する
      security: []
      responses:
        "302": { description: GitHub の認可画面へリダイレクト }

  /api/auth/github/callback:
    get:
      tags: [auth]
      summary: GitHub OAuth のコールバック
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      security: []
      responses:
        "302": { description: フロントエンドへリダイレクト }

  # ── auth（認証必須）────────────────────────────────
  /api/auth/user:
    get:
      tags: [auth]
      summary: ログイン中のユーザーを取得する
      security: [{ userToken: [] }]
      responses:
        "200":
          description: 取得した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/profile:
    put:
      tags: [auth]
      summary: プロフィールを更新する
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: プロフィールを更新する（旧クライアント互換）
      description: PUT と同じ処理。古いクライアントのために残している。新規実装では PUT を使う。
      deprecated: true
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/account:
    delete:
      tags: [auth]
      summary: 退会する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 退会した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/me:
    delete:
      tags: [auth]
      summary: 退会する（明示的な本人退会パス）
      description: "`/api/auth/account` と同等（#613）。"
      security: [{ userToken: [] }]
      responses:
        "200": { description: 退会した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── chat ───────────────────────────────────────────
  /api/chat:
    post:
      tags: [chat]
      summary: 診断チャットに発言する
      description: |
        回答を受け取り、スコアを更新して次の質問を返す。
        質問と無関係な回答が続くと `is_terminated` が true になる。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: 応答
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/history:
    get:
      tags: [chat]
      summary: チャット履歴を取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          schema: { type: string }
      responses:
        "200": { description: 履歴 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/scores:
    get:
      tags: [chat]
      summary: 現在のスコアを取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          schema: { type: string }
      responses:
        "200":
          description: 10カテゴリのスコア
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserWeightScore" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/recommendations:
    get:
      tags: [chat]
      summary: スコアに基づく推薦企業を取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          schema: { type: string }
      responses:
        "200": { description: 推薦企業 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/analysis:
    get:
      tags: [chat]
      summary: 診断結果のサマリを取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          schema: { type: string }
      responses:
        "200": { description: サマリ }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/sessions:
    get:
      tags: [chat]
      summary: セッション一覧を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: セッション一覧 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/send-report:
    post:
      tags: [chat]
      summary: 診断結果をメールで送る
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string }
      responses:
        "200": { description: 送信した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/favorite:
    post:
      tags: [chat]
      summary: セッションのお気に入りを切り替える
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string }
      responses:
        "200": { description: 切り替えた }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── questions ──────────────────────────────────────
  /api/questions/generate:
    post:
      tags: [questions]
      summary: 質問を生成する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 生成した質問 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/questions/create:
    post:
      tags: [questions]
      summary: 質問を登録する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 登録した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/questions/list:
    get:
      tags: [questions]
      summary: カテゴリ別に質問を取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200": { description: 質問一覧 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── interviews ─────────────────────────────────────
  /api/interviews:
    get:
      tags: [interviews]
      summary: 面接セッション一覧
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - in: query
          name: all
          description: "`1` または `true` で全件（既定は自分の進行中のみ）"
          schema: { type: string }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/InterviewSession" }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [interviews]
      summary: 面接セッションを作る
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string, default: ja }
                interviewer_gender: { type: string }
      responses:
        "200":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/trend:
    get:
      tags: [interviews]
      summary: スコア推移
      description: "`/:id` より先に登録している（Echo のルーターが先に解決するため）。"
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        "200": { description: 推移 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}:
    get:
      tags: [interviews]
      summary: セッション詳細
      security: [{ userToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: role, schema: { type: string } }
      responses:
        "200": { description: 詳細 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 存在しない }

  /api/interviews/{id}/start:
    post:
      tags: [interviews]
      summary: 面接を開始する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/finish:
    post:
      tags: [interviews]
      summary: 面接を終了しレポート生成を予約する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 終了した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/start-turn:
    post:
      tags: [interviews]
      summary: 1ターンを開始する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 開始した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/turn:
    post:
      tags: [interviews]
      summary: 1ターンの応答を処理する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 次の質問 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/utterances:
    post:
      tags: [interviews]
      summary: 発話を記録する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 記録した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/report:
    get:
      tags: [interviews]
      summary: 面接レポートを取得する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: レポート }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: まだ生成されていない }

  /api/interviews/{id}/report/regenerate:
    post:
      tags: [interviews]
      summary: レポートを作り直す
      description: "生成ジョブが失われたレポートをユーザー操作で回復する経路（#1476）。"
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 再生成を予約した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/send-report:
    post:
      tags: [interviews]
      summary: レポートをメールで送る
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 送信した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/phrase-suggestions:
    get:
      tags: [interviews]
      summary: 言い回しの提案を取得する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 提案 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/upload-video:
    post:
      tags: [interviews]
      summary: 面接動画をアップロードする
      description: |
        このエンドポイントだけ本文上限が **512MB**（動画 500MB + multipart のオーバーヘッド）。
        他は全体設定の 32MB。
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: アップロードした }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: 512MB を超えた }

  /api/hr/interviews:
    get:
      tags: [interviews]
      summary: 企業オーナー向け面接一覧
      description: "企業の採用担当が自社の面接を見る（#1083）。`company_id` は必須。"
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: company_id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 一覧 }
        "400": { description: company_id が無い }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── realtime ───────────────────────────────────────
  /api/realtime/token:
    post:
      tags: [realtime]
      summary: リアルタイム音声セッションの一時トークンを発行する
      description: |
        `user_id` を body で受け取るが、`X-User-Token` の値と一致しない場合は拒否する。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer, description: 省略可。指定する場合はトークンの値と一致させる }
                interview_id: { type: integer }
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/realtime/session-info:
    get:
      tags: [realtime]
      summary: リアルタイムセッションの情報を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: セッション情報 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── resume ─────────────────────────────────────────
  /api/resume/upload:
    post:
      tags: [resume]
      summary: 職務経歴書をアップロードする
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: アップロードした }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: 32MB を超えた }

  /api/resume/review:
    post:
      tags: [resume]
      summary: 添削する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 添削結果 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/resume/review/stream:
    post:
      tags: [resume]
      summary: 添削する（ストリーミング）
      description: Server-Sent Events で逐次返す。
      security: [{ userToken: [] }]
      responses:
        "200":
          description: SSE ストリーム
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/resume/status:
    get:
      tags: [resume]
      summary: 履歴書の対応要否を取得する
      security: [{ userToken: [] }]
      responses:
        "200":
          description: 対応要否
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/resume/annotated:
    get:
      tags: [resume]
      summary: 注釈付きの履歴書を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 注釈付きデータ }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── es（認証なし。レート制限のみ）────────────────────
  /api/es/rewrite:
    post:
      tags: [es]
      summary: エントリーシートをリライトする
      description: |
        **未ログインでも使える。** 認証は付けず、コスト濫用はレート制限で止める（#1154）。
        生成は RAG の `/es/review` に一本化してあり、ここでプロンプトは組まない（#1533）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ESRewriteRequest" }
      security: []
      responses:
        "200":
          description: リライト結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ESRewriteResponse" }
        "400": { description: 本文が不正 }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/es/review:
    post:
      tags: [es]
      summary: エントリーシートを添削する
      description: "**未ログインでも使える。** 認証は付けず、レート制限のみ（#1154）。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ESReviewRequest" }
      security: []
      responses:
        "200":
          description: 添削結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ESReviewResponse" }
        "400": { description: 本文が不正 }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ── schedule ───────────────────────────────────────
  /api/schedule:
    get:
      tags: [schedule]
      summary: 選考スケジュール一覧
      description: "対象は `X-User-Token` から決まる（#983 で user_id クエリ認証を廃止）。"
      security: [{ userToken: [] }]
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [schedule]
      summary: 予定を作る
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleEvent" }
      responses:
        "200":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEvent" }
        "400": { description: 入力が不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/schedule/{id}:
    get:
      tags: [schedule]
      summary: 予定を取得する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 予定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 存在しない（他人の予定も 404 で伏せる） }
    put:
      tags: [schedule]
      summary: 予定を更新する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleEvent" }
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 存在しない }
    delete:
      tags: [schedule]
      summary: 予定を削除する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 削除した }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 存在しない }

  /api/schedule/export/ics:
    get:
      tags: [schedule]
      summary: iCalendar 形式で書き出す
      security: [{ userToken: [] }]
      responses:
        "200":
          description: ics ファイル
          content:
            text/calendar:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── google-calendar ────────────────────────────────
  /api/google-calendar/connect:
    get:
      tags: [google-calendar]
      summary: Google カレンダー連携を開始する
      security: [{ userToken: [] }]
      responses:
        "302": { description: Google の認可画面へリダイレクト }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/google-calendar/callback:
    get:
      tags: [google-calendar]
      summary: 連携のコールバック
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
      security: []
      responses:
        "302": { description: フロントエンドへリダイレクト }

  /api/google-calendar/status:
