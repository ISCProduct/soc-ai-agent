      description: |
        CI（GitHub Actions）からのマシン間呼び出しのため、共有シークレットのみで認証する（#861）。照合する値は `SERVICE_SECRET` で、管理者トークンのHMAC鍵 `ADMIN_SECRET` とは分けてある（#1158）。
      security: [{ serviceSecret: [] }]
      responses:
        "200":
          description: 成功
        "401": { $ref: "#/components/responses/Unauthorized" }

