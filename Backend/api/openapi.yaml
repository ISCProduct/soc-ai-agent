  /api/companies/{id}/correlation-map:
    get:
      tags: [companies]
      summary: 企業相関図（学生向け）データを取得
      description: |
        起点企業を中心に、資本関係（子会社/関連会社を区別）と取引関係を返す。
        カード用の短い事業説明・上場区分・出典、初期表示用の直接子会社リスト（読み仮名順）を含む。
        資本の鏡像行（A→B と B→A）は1本に畳む。取引の `direction_known` は現状常に false
        （from/to は取得起点→相手であり、提供側→利用側ではない）。
        各ノードの `business_tags` は登録済みの事業タグ（名前順）。初期表示で折りたたまれる企業も含め、
        返すノード全件に付く。タグがあれば `business_tags_status=available`、未登録・未確認なら
        `business_tags=[]`・`business_tags_status=unavailable`（業種などから推測して補わない）。
        採用情報は含めない。審査前のゲスト投稿企業と停止中（is_active=false）の企業はノードから除外する。

        レート制限は IP 単位 300回/10分（`CORRELATION_MAP_RATE_LIMIT_PER_IP`、compare と共通）。
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
        "404":
          description: 企業が見つからない
        "429":
          description: レート制限超過

  /api/companies/{id}/correlation-map/compare:
    get:
      tags: [companies]
      summary: 起点企業と選択企業の事業説明を並べて返す
      description: |
        組み合わせ専用の比較文は持たない。両社の short_business / main_business / description を返す。
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 起点企業ID
        - in: query
          name: with
          required: true
          schema:
            type: integer
          description: 選択企業ID
      responses:
        "200":
          description: 成功
        "400":
          description: with が無い
        "404":
          description: 企業が見つからない
        "429":
          description: レート制限超過

  /api/companies/web-search:
    get:
      tags: [companies]
      summary: 企業をWEB検索する
      description: |
        **認証なしで OpenAI Web Search を呼ぶ経路。** コストに直結するので扱いに注意。

        まず DB を名前で引き、**一致が1件でもあれば web_search は呼ばない**（`SearchCandidates` の `len(out) > 0` で早期 return）。DB に無い語でだけ外部検索が走る。

        レート制限は IP 単位 300回/10分 と**全体 1000回/時**の二段（`GUEST_AI_RATE_LIMIT_PER_IP` / `GUEST_AI_RATE_LIMIT_GLOBAL`、#1154）。

        返す各候補の `source` が `db` なら DB 由来、それ以外は外部検索由来。
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 候補一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyCandidate"
        "400":
          description: q が空
        "429": { $ref: "#/components/responses/TooManyRequests" }

