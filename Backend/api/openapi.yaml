        - { in: query, name: from, description: 期間の開始日（含む、YYYY-MM-DD、日本時間）, schema: { type: string, format: date } }
        - { in: query, name: to, description: 期間の終了日（含む、YYYY-MM-DD、日本時間）, schema: { type: string, format: date } }
