      description: |
        `Authorization: Bearer <token>` が必要。トークン未設定なら公開しない。
      security: [{ metricsToken: [] }]
      responses:
        "200":
          description: Prometheus 形式
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── 学生向け・企業ポータル ────────────────────────────
  /api/companies:
    get:
      tags: [companies]
      summary: 企業一覧
      security: []
      responses:
        "200":
          description: 成功

  /api/companies/search:
    get:
      tags: [companies]
      summary: 学生向けの企業検索（業界・地域・職種・名前で絞り込み）
      description: |
        SOCAIAGENT-612。並びは企業名順（推薦や課金で上位に固定しない）。有効で、審査前のゲスト投稿でない企業だけ。
        `prefecture` は都道府県名（`/api/companies/search-options` の一覧にあるもの）で、所在地に含まれるかで絞る。
        `job_category_id` は、その職種（または子の職種）の公開中の求人を持つ企業に絞る。
      security: []
      parameters:
        - { in: query, name: name, description: 企業名の部分一致（100字まで）, schema: { type: string } }
        - { in: query, name: industry, schema: { type: string } }
        - { in: query, name: prefecture, schema: { type: string } }
        - { in: query, name: job_category_id, schema: { type: integer } }
        - { in: query, name: limit, description: 既定20・上限100, schema: { type: integer } }
        - { in: query, name: offset, schema: { type: integer } }
      responses:
        "200": { description: "`companies`・`total`・`limit`・`offset`" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/companies/search-options:
    get:
      tags: [companies]
      summary: 企業検索の絞り込みの選択肢（業界・都道府県・職種）
      description: 業界は表示できる企業に付いているもの、職種は公開中の求人がある大分類だけ（SOCAIAGENT-612）。
      security: []
      responses:
        "200": { description: "`industries`・`prefectures`・`job_categories`" }

  /api/companies/search/favorites:
    get:
      tags: [companies]
      summary: 検索結果の企業のお気に入りの状態（本人の推薦にある企業だけ）
      description: |
        SOCAIAGENT-612。お気に入りは推薦（`user_company_matches`）に付くので、本人の最新の診断の推薦にある企業だけ
        `match_id` と `is_favorited` を返す。切り替えは `POST /api/chat/favorite`。`company_ids` は100件まで。
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: company_ids, description: カンマ区切りの企業 ID, schema: { type: string } }
      responses:
        "200": { description: "`favorites`" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

