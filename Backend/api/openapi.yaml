    get:
      tags: [admin-training]
      summary: 学習データの件数
      description: |
        件数しか返さず個人情報を含まないため、`X-Admin-Secret` によるサービス間認証にしている。運用から機械的に叩けるようにするためで、管理者になりすます形を避けている。照合する値は `SERVICE_SECRET`（`ADMIN_SECRET` とは別値、#1158）。
      security: [{ serviceSecret: [] }]
      responses:
        "200":
          description: 成功
        "401": { $ref: "#/components/responses/Unauthorized" }

