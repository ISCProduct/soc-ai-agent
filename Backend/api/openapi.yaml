  /api/admin/companies/{id}/verify:
    patch:
      tags: [admin-companies]
      summary: 学生検索の審査を完了する、または取り消す
      description: |
        `companies.is_verified` を更新する。公開（`data_status`）とは別で、重み付けプロファイルは不要。
        true になるまで企業ポータルの学生検索とスカウト送信は 403。システム管理者専用。
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified]
              properties:
                verified:
                  type: boolean
      responses:
        "200":
          description: 成功
        "400":
          description: verified が無い、または真偽値でない
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PlatformAdminOnly" }
        "404":
