  # ── admin: 企業管理・クロール・ベクトル ──────────────
  /api/admin/companies:
    get:
      tags: [admin-companies]
      summary: 企業一覧
      description: |
        `limit` は既定 50 / 上限 100。上限が無いと `limit=1000000` で DB と JSON 生成にタスクが詰まる（#1412）。

        `school_id` は**閲覧制限ではなく任意の絞り込み**（その学校が承認済みの企業だけ見る）。企業カタログは全テナント共有。
      security: [{ adminAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
          description: data_status での絞り込み
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: readiness
          schema:
            type: string
        - in: query
          name: order
          schema:
            type: string
        - in: query
          name: school_id
          schema:
            type: integer
      responses:
        "200":
          description: 一覧。絞り込み条件をそのまま返す
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  name:
                    type: string
                  status:
                    type: string
                  industry:
                    type: string
                  readiness:
                    type: string
                  order:
                    type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin-companies]
      summary: 企業を作る
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Company"
      responses:
        "200":
          description: 作成した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PlatformAdminOnly" }

