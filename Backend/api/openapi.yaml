                        link: { type: string }
                        read_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

