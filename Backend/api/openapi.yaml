        全企業で共通の事業タグ一覧（名前順）。登録時に既存のタグを選び、表記ゆれを防ぐために使う。
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: タグ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  business_tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/companies/{id}/business-tags:
    get:
      tags: [admin-companies]
      summary: 企業の事業タグを取得
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 企業の事業タグ（名前順。未登録なら空配列）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyBusinessTags"
        "404":
          description: 企業が存在しない
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin-companies]
      summary: 企業の事業タグを置き換える
      description: |
        システム管理者専用（担当校つき管理者・職員は 403）。送った一覧で丸ごと置き換え、空配列で全解除する。
        各名前は NFKC で全角・半角をそろえ、前後と連続の空白を整える。重複は1つにまとめ、
        一覧に無い名前は新しいタグとして作る。1件64文字・1社20件まで。
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_tags]
              properties:
                business_tags:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 64 }
              example:
                business_tags: [クラウド, 業務システム]
      responses:
        "200":
          description: 置き換え後の事業タグ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyBusinessTags"
        "400":
          description: business_tags が無い・上限超過
        "404":
          description: 企業が存在しない
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

