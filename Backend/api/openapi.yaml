                type: object
                properties:
                  school_id: { type: integer, nullable: true }
                  from: { type: string }
                  to: { type: string }
                  funnel:
                    type: object
                    properties:
                      students: { type: integer }
                      stages:
                        type: array
                        items:
                          type: object
                          properties:
                            stage: { type: string, enum: [diagnosis, interview, es, applied, offered] }
