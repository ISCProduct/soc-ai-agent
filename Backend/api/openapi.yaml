    post:
      tags: [github]
      summary: GitHub と同期する（完了まで待つ）
      description: |
        同期の完了を待って返す。タイムアウトがあるため、長い場合は `/sync` とポーリングを使う。
      security: [{ userToken: [] }]
      responses:
        "200":
          description: 成功
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/company-auth/register:
    post:
      tags: [company-auth]
      summary: 企業アカウントを自己登録する
      description: |
        審査前でもアカウントは作れる。学生検索とスカウトは `is_verified` が true になるまで使えない。
        IP 単位でログインと同じレート制限がかかる。
      security: []
      responses:
        "201":
          description: 登録した
        "400":
          description: 入力が不正
        "409":
          description: 同じメールアドレスが既にある
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/company-auth/login:
    post:
      tags: [company-auth]
      summary: 企業ポータルにログインする
      description: |
        **メールとパスワードのみ。** 学生側にある OAuth もゲスト利用も無い。

        判定の順序に意味がある。メール/パスワードが空でない → ユーザーが存在する → **パスワードが設定済み**（招待未受諾はここで落ちる）→ パスワードが一致する → アカウントが無効化されていない。

        無効化の判定を**パスワード照合より後ろ**に置いているのは、先に返すとパスワードを知らない相手にもアカウントの存在が伝わるため。

        1〜4 はすべて `401`。無効化だけが別に返る。IP 単位 20回/分。
      security: []
      responses:
        "200":
          description: ログインした。httpOnly Cookie 3本を設定する
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/company-auth/accept-invite:
    post:
      tags: [company-auth]
      summary: 招待を受諾してパスワードを決める
      description: |
        **初回はここから。** 招待トークンの有効期限は 24 時間で、DB にはハッシュだけ保存する。

        追加の担当者は学校側の管理者、または既存の owner からの招待で入る。企業自身の初回登録は `/register`。
      security: []
      responses:
        "200":
          description: 受諾した
        "400":
          description: 招待リンクが無効か期限切れ
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/company-auth/forgot-password:
    post:
      tags: [company-auth]
      summary: パスワード再設定メールを送る
      description: |
        総当たりとメール爆撃を防ぐためレート制限を掛けている（5回/時・IP単位、#1196）。
      security: []
      responses:
        "200":
          description: 受け付けた
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/company-auth/reset-password:
    post:
      tags: [company-auth]
      summary: パスワードを再設定する
      description: |
        再設定トークンの有効期限は 1 時間（学生側と同じ値に揃えてある）。
      security: []
      responses:
        "200":
          description: 再設定した
        "400":
          description: トークンが無効か期限切れ
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/company-auth/refresh:
    post:
      tags: [company-auth]
      summary: アクセストークンを更新する
      description: |
