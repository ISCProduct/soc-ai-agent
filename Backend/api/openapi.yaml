openapi: 3.0.3

# SOC AI Agent の HTTP API。
#
# これは手で書くファイル。生成しない。
# 実装に登録されている全エンドポイントの一覧は api/routes.txt（自動生成）にある。
#
# 全 276 本を記載済み（網羅率 100%）。
# 実装と spec は双方向で突き合わせており、どちらかに無いものがあると CI が落ちる。
# 網羅率は `cd Backend && go test ./internal/routes/ -v -run TestOpenAPIPaths` で出る。
#
# 実装に無いパスを書く / 実装にあるパスを書き忘れる、どちらも CI で落ちる
# （inventory_test.go の TestOpenAPIPathsExistInImplementation）。
# 体裁（summary・tags・security・responses の有無）は TestOpenAPILint が見る。

info:
  title: SOC AI Agent API
  version: "1.0.0"
  description: |
    採用支援 SaaS のバックエンド API。

    ## 認証

    方式が4つある。どれを使うかはエンドポイントごとの `security` を見ること。

    | 方式 | ヘッダ | 用途 |
    |---|---|---|
    | `userToken` | `X-User-Token` | 学生・教員。ログインで発行される短TTLのJWT |
    | `adminAuth` | `X-Admin-Email` + `X-Admin-Token` | 管理画面。管理者本人の認証 |
    | `serviceSecret` | `X-Admin-Secret` | CI・運用からのマシン間呼び出し。管理者になりすまさない。値は `SERVICE_SECRET`（`ADMIN_SECRET` とは別値） |
    | `companyCookie` | Cookie | 企業ポータル。httpOnly Cookie 3本 |

    テナントの切り替えが必要な場合は `X-Tenant-Slug` を併せて送る。

    ## エラー

    グローバルハンドラ（`internal/middleware/error_handler.go`）が全エラーを
    次の形に揃えて返す。`message` は返らない。

    ```json
    { "error": "...", "code": "...", "detail": "..." }
    ```

    `detail` は省略されることがある（`omitempty`）。

servers:
  - url: http://localhost:8080
    description: ローカル開発
  - url: https://stg.shukatsu-ai.jp
    description: staging

tags:
  - name: auth
    description: 学生・教員の認証とプロフィール
  - name: chat
    description: 診断チャットとスコア

  - name: interviews
    description: AI面接のセッション・発話・レポート
  - name: realtime
    description: 面接のリアルタイム音声セッション
  - name: resume
    description: 職務経歴書のアップロードと添削
  - name: assessments
    description: 適性検査の受検と結果（#1678）
  - name: es
    description: エントリーシートの添削とリライト（未ログインでも使える）
  - name: schedule
    description: 選考スケジュール
  - name: graduate-outcomes
    description: 卒業生の進路実績（学生向け、自分の学校の実績を人数で）
  - name: portfolio
    description: 自己分析ポートフォリオ（診断・面接・ES・適性検査のまとめ）
  - name: notifications
    description: アプリ内通知（締切・選考結果・スカウト・先生の案内）
  - name: google-calendar
    description: Google カレンダー連携
  - name: admin-companies
    description: 管理画面の企業カタログ・求人・面接質問
  - name: admin-crawl
    description: 管理画面のクロールとスクレイパ
  - name: admin-vector
    description: 管理画面のベクトルストア
  - name: admin-schools
    description: 管理画面の学校・企業承認・掲載申請
  - name: admin-organizations
    description: 管理画面の組織（テナント）
  - name: admin-users
    description: 管理画面の利用者
  - name: admin-analytics
    description: 管理画面のダッシュボード・選考・面接・監査
  - name: admin-score
    description: 管理画面のスコア検証とスコア再計算
  - name: admin-costs
    description: 管理画面のコスト可視化
  - name: admin-training
    description: ファインチューニング用の学習データ
  - name: release-notes
    description: リリースノート
  - name: companies
    description: 企業情報の投稿
  - name: ops
    description: 監視用（認証なし、またはトークン）
  - name: user
    description: 学生本人のプロフィール・希望条件・案内
  - name: applications
    description: 学生の応募と選考
  - name: hr
    description: 企業の採用担当向け（学生トークンで認証）
  - name: collective-insights
    description: 集合知レコメンド（匿名集計）
  - name: github
    description: GitHub 連携とスキル推定
  - name: company-auth
    description: 企業ポータルの認証
  - name: company-portal
    description: 企業ポータル（自社の求人・応募・学生検索）
components:
  securitySchemes:
    userToken:
      type: apiKey
      in: header
      name: X-User-Token
    adminAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: 併せて `X-Admin-Email` も必要。
    serviceSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: |
        ヘッダ名は歴史的に `X-Admin-Secret` だが、照合する値は `SERVICE_SECRET` であり
        管理者トークンのHMAC鍵 `ADMIN_SECRET` とは別値（#1158）。未設定なら 503 で拒否し、
        本文に `"code": "SERVICE_SECRET_NOT_CONFIGURED"` を入れる（ALB が healthy target
        ゼロで返す 503 と区別するため。CI がこのコードを見ている）。
    companyCookie:
      type: apiKey
      in: cookie
      name: company_user_token

    metricsToken:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <token>`。トークン未設定なら公開しない。"
  responses:
    Unauthorized:
      description: 認証情報が無い、または無効
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 権限が足りない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: 入力値が不正
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: レート制限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: "Too Many Requests: お試し回数の上限に達しました。しばらく待ってから再試行してください。"
            code: "TOO_MANY_REQUESTS"

    PlatformAdminOnly:
      description: |
        **システム管理者専用。** 担当校を持つ教員・学園側管理者は 403。
        `EchoRequirePlatformAdmin` が担当校の有無で判定する。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CompanyOwnerOnly:
      description: |
        **企業ユーザーの `owner` のみ実行できる。** `member` は 403。
        ロールはコントローラ側で判定する。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    CompanyBusinessTags:
      type: object
      properties:
        company_id: { type: integer }
        business_tags:
          type: array
          items: { type: string }
    Error:
      type: object
      description: |
        `internal/middleware/error_handler.go` の `APIErrorResponse`。
        全エラーがこの形で返る。
      required: [error, code]
      properties:
        error: { type: string, description: 表示用のメッセージ }
        code:
          type: string
          description: |
            `defaultCodeByStatus` が HTTP ステータスから決める。
            コントローラが明示したコードがあればそれが入る。
          enum:
            - BAD_GATEWAY
            - CONFLICT
            - FORBIDDEN
            - INTERNAL_ERROR
            - NOT_FOUND
            - SERVICE_UNAVAILABLE
            - TOO_MANY_REQUESTS
            - UNAUTHORIZED
            - VALIDATION_ERROR
        detail: { type: string, description: 補足。無い場合は省略される }

    TrainingConsent:
      type: object
      description: 学習利用の同意（`GET`/`PUT /api/user/training-consent`、#2167・#2168）
      required: [allow_training_use, updated_at]
      properties:
        allow_training_use: { type: boolean, description: 面接データを学習に使うことへの同意（初期値 false） }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: |
            本人が同意を最後に変更した日時（同意の履歴の最後の行）。一度も変更していなければ null。
            履歴の記録を始める前（20261117104108 の適用前）から同意していた人は、本人が操作するまでは 20261117104108 の適用時刻になる

    GrowthHistory:
      type: object
      description: スコアと診断フェーズの記録（SOCAIAGENT-601）。比較は新しい2件。値はシステムの見立て。
      required: [points, has_previous, categories, phase]
      properties:
        points:
          type: array
          description: 古い順。最大30件。
          items: { type: object }
        has_previous: { type: boolean, description: 比較できる1つ前の記録がある }
        categories:
          type: array
          items:
            type: object
            required: [category, change_label]
            properties:
              category: { type: string }
              previous: { type: integer, nullable: true }
              current: { type: integer, nullable: true }
              delta: { type: integer, nullable: true }
              change_label:
                type: string
                description: 伸びた / 落ちた / 変化なし / 新しく出た / 今回は出ていない
        phase:
          type: object
          required: [completed_previous, completed_current, change_label, newly_completed]
          properties:
            completed_previous: { type: integer }
            completed_current: { type: integer }
            change_label:
              type: string
              description: 進んだ / 戻った / 変化なし / 比較できない
            newly_completed:
              type: array
              items: { type: string }

    CompanyInterviewQuestionInput:
      type: object
      required: [category, question_text]
      properties:
        position: { type: string, maxLength: 100, description: 空欄は全職種共通 }
        category: { type: string, minLength: 1, maxLength: 100 }
        question_text: { type: string, minLength: 1, maxLength: 2000 }
        priority: { type: integer, minimum: 0, maximum: 999 }
        is_required: { type: boolean }

    CompanyInterviewQuestion:
      allOf:
        - $ref: "#/components/schemas/CompanyInterviewQuestionInput"
        - type: object
          required: [id, company_id]
          properties:
            id: { type: integer }
            company_id: { type: integer }

    AuthResponse:
      type: object
      description: |
        ログイン・登録・リフレッシュの共通レスポンス。
        `token`（管理者トークン）は管理者と職員（is_staff）に入る。
        `user_token` と `refresh_token` は全ユーザーに入る。
      required: [user_id, email, name, is_guest, target_level, is_admin, email_verified]
      properties:
        user_id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        is_guest: { type: boolean }
        target_level: { type: string, description: "新卒 / 中途" }
        school_name: { type: string }
        is_admin: { type: boolean }
        is_staff: { type: boolean, description: "学校職員（教員・キャリア担当）。ログイン後に /admin へ送る判定に使う" }
        certifications_acquired: { type: string }
        certifications_in_progress: { type: string }
        avatar_url: { type: string }
        oauth_provider: { type: string, description: "google / github" }
        token: { type: string, description: 管理者トークン。管理者と職員(is_staff)に発行 }
        user_token: { type: string, description: ユーザー認証トークン（短TTL） }
        refresh_token: { type: string, description: "リフレッシュトークン（#616）" }
        email_verified: { type: boolean }
        requires_re_verification: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        name: { type: string }
        target_level: { type: string }
        school_name: { type: string }
        certifications_acquired: { type: string }
        certifications_in_progress: { type: string }
        registration_token: { type: string }
        promote_guest:
          type: boolean
          description: |
            ゲストの診断結果を引き継いで本登録するか。
            対象のゲストは `X-User-Token` から特定する。この値は意思表明にすぎず、
            誰を昇格するかの決定には使わない。

    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string }
        target_level: { type: string }
        school_name: { type: string }
        certifications_acquired: { type: string }
        certifications_in_progress: { type: string }

    UserWeightScore:
      type: object
      description: |
        10カテゴリの重みスコア。

        **キーが Go のフィールド名のままになっている。**
        応答用の型 `models.UserWeightScoreResponse` を JSON 化しており、同型に json タグが
        無いため `id` や `user_id` ではなく `ID` / `UserID` が返る。
        snake_case を前提に生成したクライアントは値を取得できない。
      properties:
        ID: { type: integer }
        UserID: { type: integer }
        SessionID: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        WeightCategory:
          type: string
          enum:
            - technical_orientation
            - teamwork_orientation
            - leadership_orientation
            - creativity_orientation
            - stability_orientation
            - growth_orientation
            - work_life_balance
            - challenge_seeking
            - detail_orientation
            - communication_skill
        Score: { type: number, minimum: 0, maximum: 100, description: 小数第2位まで（DECIMAL(5,2)）。表示側で丸める }

    PhaseProgress:
      type: object
      description: 診断4フェーズの進捗（`services/chat.PhaseProgress`）。
      properties:
        phase_id: { type: integer }
        phase_name:
          type: string
          enum: [job_analysis, interest_analysis, aptitude_analysis, future_analysis]
        display_name: { type: string }
        questions_asked: { type: integer }
        valid_answers: { type: integer, description: 有効と判定された回答数 }
        completion_score: { type: number, format: double }
        is_completed: { type: boolean }
        min_questions: { type: integer }
        max_questions: { type: integer, description: 0 なら上限なし }

    ChatRequest:
      type: object
      required: [session_id, message]
      properties:
        user_id: { type: integer, description: サーバ側で X-User-Token から決まるため省略可 }
        session_id: { type: string }
        message: { type: string }
        industry_id: { type: integer }
        job_category_id: { type: integer }
        consult_intent:
          type: string
          enum: [find_job, learn_industry, how_to_proceed, organize_strengths, free]
          description: |
            ホームの「キャリア相談」で選んだ意図（任意。送らない既存のクライアントは従来どおり動く）。
            セッションの最初の回答でだけ使い、意図を保存して、次の質問で職種を聞く。
            free のときの message は 1〜1000 文字。知らない値・長すぎる自由記述は 400。

    ChatResponse:
      type: object
      required: [response, is_complete, total_questions, answered_questions]
      properties:
        response: { type: string }
        question_weight_id: { type: integer }
        current_scores:
          type: array
          items: { $ref: "#/components/schemas/UserWeightScore" }
        current_phase: { $ref: "#/components/schemas/PhaseProgress" }
        all_phases:
          type: array
          items: { $ref: "#/components/schemas/PhaseProgress" }
        is_complete: { type: boolean }
        is_terminated:
          type: boolean
          description: 質問と無関係な回答が続いてチャットを終了した場合に true。
        suggest_restart: { type: boolean }
        invalid_answer_count: { type: integer }
        total_questions: { type: integer }
        answered_questions: { type: integer }
        evaluated_categories: { type: integer }
        total_categories: { type: integer }
        judgment_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            判定の進み具合（%）。質問数は固定しないので、画面の進捗はこれを使う。
            判定できた（is_complete）ときだけ 100。
        suggest_provisional:
          type: boolean
          description: 目安の回答数（30）を超えても判定できていないとき true。画面は「いまの暫定の結果を見る」を出す（質問は続けられる）。

    InterviewSession:
      type: object
      description: 面接セッション。モデルではなく専用DTOを返す。
      required: [id, user_id, status, language, interviewer_gender, estimated_cost_usd, template_version, created_at, updated_at]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        status: { type: string, description: "作成直後から終了までの状態" }
        language: { type: string, default: ja }
        interviewer_gender: { type: string, default: female }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        estimated_cost_usd: { type: number, format: double }
        template_version: { type: string, default: v1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScheduleEvent:
      type: object
      description: 選考スケジュールイベント。
      required: [id, user_id, company_name, stage, scheduled_at]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        company_name: { type: string }
        stage:
          type: string
          enum: [書類選考, 1次面接, 2次面接, 最終面接, 内定, その他]
        title: { type: string }
        scheduled_at: { type: string, format: date-time }
        notes: { type: string }
        google_calendar_event_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StarBreakdown:
      type: object
      description: STAR法の分解結果。
      properties:
        situation: { type: string }
        task: { type: string }
        action: { type: string }
        result: { type: string }

    ESRewriteRequest:
      type: object
      required: [original_text, question_type]
      properties:
        original_text: { type: string }
        question_type:
          type: string
          enum: [志望動機, 自己PR, 学チカ, その他]
        tech_stack: { type: string, description: 任意。使用技術スタック }
        company_name: { type: string, description: 任意。RAG が企業情報を参照する }
        char_limit: { type: integer, nullable: true, description: "設問の文字数上限（#1523）" }
        char_limit_mode: { type: string }

    InterviewCompanyQuestionInput:
      type: object
      description: 企業別面接カスタム質問の作成・更新。作成では category と question_text が必須。更新は指定した項目だけを変える
      properties:
        position: { type: string, description: 対象職種。空文字は全職種共通 }
        category: { type: string }
        question_text: { type: string }
        priority: { type: integer, description: 小さいほど先に聞く }
        is_required: { type: boolean }
        evaluation_intent:
          type: string
          maxLength: 300
          description: |
            この質問で評価したい観点（#1092）。AI 面接官の system プロンプトへ、質問と同じ非信頼テキストの囲みの中で渡し、応募者には伝えないよう指示する。
            前後の空白は落とし、空文字は未設定（null）として保存する。更新で空文字を送ると消える。300字を超えると 400

    ResumeFormatFinding:
      description: |
        履歴書の形式チェックの指摘（#1530）。FormatFinding と同じ形で、page_hint と block_index を必ず含む（block_index は 0 から）。
        start/end は、そのブロックの text の中の位置（UTF-16）。
        画面はブロックの本文を持たないので、該当箇所の文字列を excerpt で返す。
      allOf:
        - $ref: "#/components/schemas/FormatFinding"
        - type: object
          required: [page_hint, block_index, excerpt]
          properties:
            excerpt:
              type: string
              description: 該当箇所の文字列（ブロックの text[start:end]、空白は1つにまとめる）。長いときは先頭を切り出して「…」を付ける

    FormatFinding:
      type: object
      description: |
        形式チェック（#1530）の指摘1件。LLM を使わずルールだけで判定する。
        位置 `start` / `end` は、リクエストで送った原文（trim 前）を UTF-16 のコード単位で数えた位置（`end` は含まない）。
        JavaScript の文字列の添字と同じ単位。
      required: [rule, severity, start, end, message, fix]
      properties:
        rule:
          type: string
          enum: [mixed_width, mixed_numeral, mixed_era, mixed_style, date_order, char_limit, spoken_language, blank_field]
          description: spoken_language は ES と履歴書、blank_field は履歴書だけで出る
        severity:
          type: string
          enum: [critical, warning, info]
          description: 履歴書の AI 指摘と同じ3値（重大 / 注意 / 情報）
        start: { type: integer }
        end: { type: integer }
        message: { type: string, description: 何が問題か }
        fix: { type: string, description: どう直すか }
        page_hint: { type: integer, description: 履歴書のみ。ES では省略される }
        block_index: { type: integer, description: 履歴書のみ。ES では省略される }

    ESRewriteResponse:
      type: object
      properties:
        rewritten_text: { type: string }
        star: { $ref: "#/components/schemas/StarBreakdown" }
        improved_text_length: { type: integer }
        char_limit_satisfied: { type: boolean, nullable: true }
        improved_length_satisfied:
          type: boolean
          nullable: true
          description: "改善文が目標レンジ（元の100〜130%）に入ったか。char_limit 指定時は null（#1606）"
        improved_length_issue:
          type: string
          nullable: true
          enum: [short, long]
          description: "外れた理由。short は元の100%未満、long は130%超え。範囲内と char_limit 指定時は null"
        format_findings:
          type: array
          description: 原文の形式チェック（#1530）。重要度順（同じなら出現位置順）。指摘が無いときは空配列
          items: { $ref: "#/components/schemas/FormatFinding" }

    ESReviewRequest:
      type: object
      required: [es_text, question_type]
      properties:
        es_text: { type: string }
        question:
          type: string
          maxLength: 500
          description: "設問文（任意 / #1531）。同一設問の前回結果と突き合わせるキー。種別だけだと「学チカ」と「ガクチカ」が別扱いになる"
        question_type: { type: string }
        company_name: { type: string }
        char_limit: { type: integer, nullable: true }
        char_limit_mode: { type: string, description: "未指定は RAG 側の既定（上限なし / within）" }

    ESReviewResponse:
      type: object
      properties:
        improved_text: { type: string }
        improved_text_length: { type: integer }
        char_limit_satisfied: { type: boolean, nullable: true }
        improved_length_satisfied:
          type: boolean
          nullable: true
          description: "改善文が目標レンジ（元の100〜130%）に入ったか。char_limit 指定時は null（#1606）"
        improved_length_issue:
          type: string
          nullable: true
          enum: [short, long]
          description: "外れた理由。short は元の100%未満、long は130%超え。範囲内と char_limit 指定時は null"
        format_findings:
          type: array
          description: 原文の形式チェック（#1530）。重要度順（同じなら出現位置順）。指摘が無いときは空配列。RAG の応答が想定外の形のときは付かず、RAG の応答をそのまま返す
          items: { $ref: "#/components/schemas/FormatFinding" }
        star: { $ref: "#/components/schemas/StarBreakdown" }
        feedback_items:
          type: array
          maxItems: 4
          description: 原文の該当箇所と評価根拠に結びついた指摘
          items:
            type: object
            required: [score_key, source_excerpt, issue, suggestion]
            properties:
              score_key:
                type: string
                enum: [specificity_score, star_score, company_fit_score, length_balance_score]
              source_excerpt: { type: string, maxLength: 120, description: 原文からの連続した引用 }
              issue: { type: string, maxLength: 80 }
              suggestion: { type: string, maxLength: 80 }
        previous:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ESReviewPrevious" }]
          description: "同一設問の前回の添削（#1531）。初回・未ログイン・設問未入力のときは付かない"

    ESReviewPrevious:
      type: object
      description: "前回の添削のうち差分表示に使う項目だけ（#1531）。本文は含めない"
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        question: { type: string }
        question_type: { type: string }
        specificity_score: { type: integer }
        star_score: { type: integer }
        length_balance_score: { type: integer }
        company_fit_score: { type: integer, nullable: true }

    ResumeStatus:
      type: object
      description: "履歴書の対応要否（#1030）。リマインダー表示の判定に使う。"
      required: [has_document, needs_attention]
      properties:
        has_document: { type: boolean, description: 一度でもアップロードしているか }
        latest_score: { type: integer, nullable: true, minimum: 0, maximum: 100, description: 最新レビューのスコア。未生成なら null }
        needs_attention: { type: boolean, description: 学生に改善を促すべき状態か }

    Company:
      type: object
      description: |
        企業。`models/company.go` の GORM モデルをそのまま返す。
        企業カタログは全テナント共有で、学校ごとの承認は別テーブルで管理する。
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        name_reading: { type: string, description: 企業名の読み仮名 }
        description: { type: string }
        industry: { type: string }
        employee_count: { type: integer }
        employee_count_basis: { type: string, enum: [consolidated, standalone] }
        founded_year: { type: integer }
        location: { type: string }
        website_url: { type: string }
        logo_url: { type: string }
        corporate_number: { type: string, maxLength: 13, description: 法人番号 }
        source_type: { type: string, enum: [official, job_site, manual, scrape, web_search] }
        source_url: { type: string }
        source_fetched_at: { type: string, format: date-time }
        is_provisional: { type: boolean, default: true }
        is_guest_entry: { type: boolean, default: false }
        data_status: { type: string, enum: [draft, published], default: draft }
        gbiz_last_synced_at: { type: string, format: date-time }
        gbiz_sync_status: { type: string, enum: [success, failed] }
        gbiz_sync_message: { type: string }
        info_fetched_at: { type: string, format: date-time }
        jobs_fetched_at: { type: string, format: date-time }
        tech_fetched_at: { type: string, format: date-time }
        relations_fetched_at: { type: string, format: date-time }
        last_model_used: { type: string }
        last_fetch_confidence: { type: string, enum: [high, medium, low] }
        info_prompt_version: { type: string, description: "企業情報の抽出に使ったプロンプトの版。AI を使っていなければ空" }
        culture: { type: string }
        work_style: { type: string, description: "リモート / ハイブリッド / オフィス" }
        welfare_details: { type: string }
        tech_stack: { type: string, description: JSON文字列。言語・フレームワーク }
        infra_stack: { type: string, description: JSON文字列。AWS/GCP/Azure 等 }
        cicd_tools: { type: string, description: JSON文字列 }
        development_style: { type: string, description: スクラム / ウォーターフォール等 }
        main_business: { type: string }
        average_age: { type: number, format: double }
        female_ratio: { type: number, format: double, description: 女性比率（%） }
        is_active: { type: boolean, default: true }
        is_verified: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    CompanyUser:
      type: object
      description: 企業ポータルにログインできる担当者。
      properties:
        id: { type: integer }
        company_id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [owner, member] }
        disabled_at: { type: string, format: date-time, nullable: true }

    CompanyCandidate:
      type: object
      description: 企業名の検索候補。
      properties:
        name: { type: string, description: 正規化した企業名 }
        description: { type: string }
        source: { type: string, description: "`db` なら既存DB由来。それ以外は外部検索由来" }
        exists: { type: boolean }
        confidence: { type: string, enum: [high, medium, low] }
        company_id: { type: integer, nullable: true }

    Application:
      type: object
      description: 学生の応募と選考ステータス。
      properties:
        id: { type: integer }
        company_id: { type: integer }
        company_name: { type: string }
        company_industry: { type: string }
        match_id: { type: integer }
        status:
          type: string
          enum: [not_applied, applied, document_screening, document_passed,
                 interview_scheduled, interview_in_progress, offered, accepted,
                 withdrawn, rejected]
        notes: { type: string }
        applied_at: { type: string, format: date-time, nullable: true }
        status_updated_at: { type: string, format: date-time, nullable: true }
paths:
  # ── auth（認証不要）────────────────────────────────
  /api/auth/request-registration:
    post:
      tags: [auth]
      summary: 本登録の前に確認メールを送る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      security: []
      responses:
        "200": { description: 送信した }
        "400": { description: メールアドレスの形式が不正 }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/verify-registration:
    post:
      tags: [auth]
      summary: 確認メールのトークンを検証して registration_token を得る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      security: []
      responses:
        "200": { description: 検証に成功。registration_token を返す }
        "400": { description: トークンが無効か期限切れ }

  /api/auth/register:
    post:
      tags: [auth]
      summary: 本登録
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      security: []
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { description: 入力が不正 }
        "409": { description: すでに登録済みのメールアドレス }

  /api/auth/login:
    post:
      tags: [auth]
      summary: ログイン
      description: IP 単位のレート制限がかかる。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      security: []
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/guest:
    post:
      tags: [auth]
      summary: ゲストユーザーを作る
      description: 登録せずに診断を試すための経路。後から promote_guest で引き継げる。
      security: []
      responses:
        "201":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/verify-email:
    get:
      tags: [auth]
      summary: メールアドレスの確認
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      security: []
      responses:
        "200": { description: 確認した }
        "400": { description: トークンが無効か期限切れ }

  /api/auth/resend-verification:
    post:
      tags: [auth]
      summary: メール認証のメールを再送する
      description: |
        メール認証の期限（24 時間）が切れた、またはメールが届かなかったときに、未認証のユーザーが新しいトークンを受け取る。
        新しいトークンを発行して、前のトークンは使えなくなる。
        アカウントの有無・認証済みか否かにかかわらず、常に同じ 200 を返す（存在を伏せる）。
        IP 単位とメールアドレス単位のレート制限がかかる。メールアドレス単位の上限を超えたときも 200 を返し、メールは送らない。
        メールアドレスの形式が不正、または 254 文字を超える場合も、200 を返し、何もしない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      security: []
      responses:
        "200": { description: 受け付けた（該当するアカウントがある場合だけ、メールが届く） }
        "400": { description: リクエストボディが不正 }
        "413": { description: リクエストボディが 4KB を超えている }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: パスワード再設定メールを送る
      description: IP 単位のレート制限がかかる。存在しないメールでも 200 を返す（存在を伏せる）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      security: []
      responses:
        "200": { description: 受け付けた }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: パスワードを再設定する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8, description: 8文字以上・72バイト以下 }
      security: []
      responses:
        "200": { description: 再設定した }
        "400": { description: トークンが無効か期限切れ、またはパスワードが8文字未満・72バイト超 }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: アクセストークンを更新する
      description: |
        リフレッシュトークン自体が認証情報なので `X-User-Token` は不要（#616）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      security: []
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: ログアウト（リフレッシュトークンを失効させる）
      description: |
        本文の `refresh_token` を失効させる。**本文を省略すると失効処理が
        空文字に対する no-op になり、200 は返るが既存のトークンは使い続けられる。**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      security: []
      responses:
        "200": { description: ログアウトした }

  /api/auth/google:
    get:
      tags: [auth]
      summary: Google OAuth を開始する
      parameters:
        - in: query
          name: bind
          description: FE が作った照合値（base64url の SHA-256、43文字）。コード交換時の verifier 検証に使う
          schema: { type: string }
      security: []
      responses:
        "302": { description: Google の認可画面へリダイレクト }

  /api/auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth のコールバック
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      security: []
      responses:
        "302": { description: フロントエンドへリダイレクト }

  /api/auth/oauth/exchange:
    post:
      tags: [auth]
      summary: OAuth 完了時の短命コードを認証情報と交換する
      description: |
        OAUTH_CODE_EXCHANGE=true のとき、OAuth コールバックはトークンを URL に載せず
        `/auth/callback?code=...` へ戻す。FE の Route Handler がこの API をサーバー間で呼び、
        結果を httpOnly Cookie にする。コードは60秒・1回限り。verifier はログインを始めた
        ブラウザだけが持つ値で、開始時の `bind`（base64url の SHA-256）と合わなければ拒否する。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code: { type: string }
                verifier: { type: string }
      responses:
        "200": { description: 認証情報（OAuth コールバックで従来 user= に載せていた内容） }
        "400": { description: リクエスト不正、またはコードが無効・使用済み・期限切れ・照合値不一致 }

  /api/auth/github:
    get:
      tags: [auth]
      summary: GitHub OAuth を開始する
      parameters:
        - in: query
          name: bind
          description: FE が作った照合値（base64url の SHA-256、43文字）。コード交換時の verifier 検証に使う
          schema: { type: string }
      security: []
      responses:
        "302": { description: GitHub の認可画面へリダイレクト }

  /api/auth/github/callback:
    get:
      tags: [auth]
      summary: GitHub OAuth のコールバック
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      security: []
      responses:
        "302": { description: フロントエンドへリダイレクト }

  # ── auth（認証必須）────────────────────────────────
  /api/auth/user:
    get:
      tags: [auth]
      summary: ログイン中のユーザーを取得する
      security: [{ userToken: [] }]
      responses:
        "200":
          description: 取得した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/profile:
    put:
      tags: [auth]
      summary: プロフィールを更新する
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: プロフィールを更新する（旧クライアント互換）
      description: PUT と同じ処理。古いクライアントのために残している。新規実装では PUT を使う。
      deprecated: true
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/account:
    delete:
      tags: [auth]
      summary: 退会する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 退会した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/me:
    delete:
      tags: [auth]
      summary: 退会する（明示的な本人退会パス）
      description: "`/api/auth/account` と同等（#613）。"
      security: [{ userToken: [] }]
      responses:
        "200": { description: 退会した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── chat ───────────────────────────────────────────
  /api/chat:
    post:
      tags: [chat]
      summary: 診断チャットに発言する
      description: |
        回答を受け取り、スコアを更新して次の質問を返す。
        質問と無関係な回答が続くと `is_terminated` が true になる。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: 応答
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/history:
    get:
      tags: [chat]
      summary: チャット履歴を取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 履歴 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/scores:
    get:
      tags: [chat]
      summary: 現在のスコアを取得する
      description: |
        チャット由来のスコア（適性検査を合流させる前の値）。推薦の計算・軸ごとの内訳と同じ合流後の値は
        `GET /api/chat/axis-scores` を使う（SOCAIAGENT-611）。
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 10カテゴリのスコア
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserWeightScore" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/recommendations:
    get:
      tags: [chat]
      summary: スコアに基づく推薦企業を取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 推薦企業 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/analysis:
    get:
      tags: [chat]
      summary: 診断結果のサマリを取得する
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: サマリ }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/sessions:
    get:
      tags: [chat]
      summary: セッション一覧を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: セッション一覧 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/send-report:
    post:
      tags: [chat]
      summary: 診断結果をメールで送る
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string }
      responses:
        "200": { description: 送信した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/favorite:
    post:
      tags: [chat]
      summary: 企業マッチのお気に入りを切り替える
      description: >
        対象は `match_id`（その診断の `UserCompanyMatch` 1行）。`session_id` では切り替わらない。
        診断をまたいで外すときは `/api/chat/favorites/remove` を使う。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_id]
              properties:
                match_id: { type: integer }
      responses:
        "200": { description: 切り替えた }
        "400": { description: match_id が無い }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/matches/{id}/axes:
    get:
      tags: [chat]
      summary: 推薦1件の、軸別のマッチの内訳（あなたのスコア・企業の重視度・一致度）
      description: |
        SOCAIAGENT-611。`id` は推薦の `match_id`（`UserCompanyMatch` の ID）。本人の推薦だけを返し、
        他人の推薦・存在しない推薦・企業のプロファイルが無い推薦は 404。
        10軸ごとに `user_score`（まだ診断で測れていない軸は null）・`company_weight`・`match`（100 - 差）を返す。
        `strengths`（あなたも企業も60以上で差が15以内）と `gaps`（企業が60以上で、あなたが20以上下回る）は
        決まった規則で作る文章で、それぞれ3件まで。推薦順位は変えない（自己理解のための説明）。
      security: [{ userToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 軸別の内訳 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 推薦が見つからない }

  /api/chat/axis-scores:
    get:
      tags: [chat]
      summary: 本人の診断の10軸のスコア（「あなたの10の傾向」）
      description: |
        SOCAIAGENT-611。`/api/chat/matches/{id}/axes` の `user_score` と同じ基準（その診断のスコアに適性検査を合流させ、整数に丸めた値）で返す。
        `/api/chat/scores` は合流前のチャット由来の値なので、同じ画面で内訳と並べると数値が食い違う。
        `axes` は10軸の並びで、まだ測れていない軸の `score` は null。本人のスコアだけを返す。
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: session_id, required: true, schema: { type: string } }
      responses:
        "200": { description: 10軸のスコア }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/chat/favorites:
    get:
      tags: [chat]
      summary: お気に入り企業を診断をまたいで1社1行で返す
      description: >
        同じ企業は、その診断のマッチが作られた時刻がいちばん新しい行を残す。
        閲覧や再計算で進む更新時刻では選ばない。並びは適合度の高い順。
        重みプロファイルの無い企業は件数を数える前に外す。
        `limit` は 1 以上 100 以下。未指定・0以下・数値でないときは 50。100 を超える指定は 100。
        `offset` は何社目から返すか。未指定・0以下・数値でないときは 0。末尾を超えても空の配列を返す。
        対象ユーザーは認証だけを見る。クエリの user_id では他人のお気に入りを読めない。
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          description: 何社目から返すか。0 が先頭。
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: お気に入り企業
          content:
            application/json:
              schema:
                type: object
                required: [recommendations]
                properties:
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: 企業ID }
                        match_id: { type: integer, description: 代表にした診断のマッチID }
                        category_name: { type: string }
                        score: { type: integer }
                        industry: { type: string }
                        job_title: { type: string }
                  total:
                    type: integer
                    description: ページを切る前の社数。0件のときは省略することがある。
                  favorite_company_ids:
                    type: array
                    description: ページに載らない企業も含めた、お気に入りの企業ID。適合度の高い順。
                    items: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: マッチングサービスが無い }

  /api/chat/favorites/remove:
    post:
      tags: [chat]
      summary: 企業のお気に入りを診断をまたいで外す
      description: >
        `company_id` の企業について、そのユーザーの全診断の `is_favorited` を外す。
        `/api/chat/favorite` は1診断の1行だけを切り替える。こちらは全診断が対象。
        もともと付いていなくても 200 を返す。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id]
              properties:
                company_id: { type: integer }
      responses:
        "200":
          description: 外した（対象が無くても成功）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { description: company_id が無い }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: マッチングサービスが無い }

  /api/chat/match-feedback:
    post:
      tags: [chat]
      summary: 推薦への「合う／合わない」を記録する
      description: |
        対象は `match_id`（`UserCompanyMatch` のID）。本人の推薦だけに付けられる。
        `verdict` は `fit`（合う）/ `unfit`（合わない）/ `none`（取り消し）。自由記述は受け付けない。
        精度の評価に使うため、押した時点の適合度・ずれる軸・職種の加点を写しで保存する。
        `GET /api/chat/recommendations` の各推薦に、本人の判定が `feedback` として付く。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_id, verdict]
              properties:
                match_id: { type: integer }
                verdict: { type: string, enum: [fit, unfit, none] }
      responses:
        "200": { description: 記録した }
        "400": { description: match_id・verdict が無い、または verdict が知らない値 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: 他人の推薦 }
        "404": { description: 推薦が無い }

  # ── interviews ─────────────────────────────────────
  /api/interviews:
    get:
      tags: [interviews]
      summary: 面接セッション一覧
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/InterviewSession" }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [interviews]
      summary: 面接セッションを作る
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string, default: ja }
                interviewer_gender: { type: string }
      responses:
        "200":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/trend:
    get:
      tags: [interviews]
      summary: スコア推移
      description: "`/:id` より先に登録している（Echo のルーターが先に解決するため）。"
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        "200": { description: 推移 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/axis-comparison:
    get:
      tags: [interviews]
      summary: 2回の面接の軸別差分
      description: |
        比較先のスコアから比較元を引く。本人のセッションだけ比較できる。
        `/:id` より先に登録している。
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: base, required: true, schema: { type: integer }, description: 比較元のセッションID }
        - { in: query, name: target, required: true, schema: { type: integer }, description: 比較先のセッションID }
      responses:
        "200": { description: 軸ごとの差分 }
        "400": { description: セッション指定が不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: セッションまたはレポートが無い }

  /api/interviews/{id}:
    get:
      tags: [interviews]
      summary: セッション詳細
      description: |
        report.teacher_report_json は職員・管理者にのみ含まれる（認証ユーザーの実ロールで決まる。#1814）。
        report.category_breakdown_json は質問の種類ごとの評価（SOCAIAGENT-610）。
        `[{category, score(0〜5), weakness, practice}]` の JSON 文字列で、カテゴリは面接の進め方の5種類と「企業別の質問」。
        この列を足す前のレポートは null。
      security: [{ userToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 詳細 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 存在しない }

  /api/interviews/{id}/start:
    post:
      tags: [interviews]
      summary: 面接を開始する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/finish:
    post:
      tags: [interviews]
      summary: 面接を終了しレポート生成を予約する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 終了した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/start-turn:
    post:
      tags: [interviews]
      summary: 1ターンを開始する
      description: "発話数・StartedAt からの経過時間・（フラグ有効時）予算の上限に達すると、AI を呼ばずに固定の締め文と limit_reached=true（limit_reason: utterances / duration / budget）を返す。クライアントは /finish で面接を終える。"
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 開始した（上限時は締め文と limit_reached） }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: 開始前（ready）のセッション }

  /api/interviews/{id}/turn:
    post:
      tags: [interviews]
      summary: 1ターンの応答を処理する
      description: "発話数・StartedAt からの経過時間・（フラグ有効時）予算の上限に達すると、AI を呼ばずに固定の締め文と limit_reached=true（limit_reason: utterances / duration / budget）を返す。クライアントは /finish で面接を終える。"
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 次の質問（上限時は締め文と limit_reached） }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: 開始前（ready）のセッション }

  /api/interviews/{id}/utterances:
    post:
      tags: [interviews]
      summary: 学生の発話を記録する
      description: "保存するのは role=user だけ。role=ai は保存せずに成功を返す。面接官の発話は /start-turn・/turn の中でサーバーが保存する（#1969）。"
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 記録した }
        "400": { description: 長さ・件数の上限を超えた }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/report:
    get:
      tags: [interviews]
      summary: 面接レポートを取得する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: レポート }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: まだ生成されていない }

  /api/interviews/{id}/report/regenerate:
    post:
      tags: [interviews]
      summary: レポートを作り直す
      description: "生成ジョブが失われたレポートをユーザー操作で回復する経路（#1476）。"
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 再生成を予約した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/send-report:
    post:
      tags: [interviews]
      summary: レポートをメールで送る
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 送信した }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/phrase-suggestions:
    get:
      tags: [interviews]
      summary: 言い回しの提案を取得する
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 提案 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/interviews/{id}/upload-video:
    post:
      tags: [interviews]
      summary: 面接動画をアップロードする
      description: |
        このエンドポイントだけ本文上限が **512MB**（動画 500MB + multipart のオーバーヘッド）。
        他は全体設定の 32MB。
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: アップロードした }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: 512MB を超えた }

  /api/interviews/{id}/videos:
    get:
      tags: [interviews]
      summary: 本人の面接録画と、発話を録画時刻へ合わせる目安
      description: |
        保存先のキーと恒久URLは返さない。時刻は面接開始からの目安で、録画は面接開始の直後から始まる。
      security: [{ userToken: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: 録画一覧と発話の目安時刻 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: セッションが無い }

  /api/interviews/{id}/videos/{video_id}/url:
    get:
      tags: [interviews]
      summary: 本人の面接録画の短時間再生URL
      description: セッションとユーザーが一致する完了済み録画だけ。有効期限は15分。
      security: [{ userToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: video_id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 再生URL }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 録画が無い、または本人のものではない }
        "422": { description: まだ再生できない }

  /api/hr/interviews:
    get:
      tags: [interviews]
      summary: 企業オーナー向け面接一覧
      description: "企業の採用担当が自社の面接を見る（#1083）。`company_id` は必須。"
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: company_id, required: true, schema: { type: integer } }
      responses:
        "200": { description: 一覧 }
        "400": { description: company_id が無い }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── realtime ───────────────────────────────────────
  /api/realtime/token:
    post:
      tags: [realtime]
      summary: リアルタイム音声セッションの一時トークンを発行する
      description: |
        `user_id` を body で受け取るが、`X-User-Token` の値と一致しない場合は拒否する。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer, description: 省略可。指定する場合はトークンの値と一致させる }
                interview_id: { type: integer }
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/realtime/session-info:
    get:
      tags: [realtime]
      summary: リアルタイムセッションの情報を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: セッション情報 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── assessments ────────────────────────────────────
  /api/assessments:
    get:
      tags: [assessments]
      summary: 受けられる検査と自分の受検状況を一覧する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 検査一覧（未受検が先） }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/assessments/{templateId}/sessions:
    post:
      parameters: [{ in: path, name: templateId, required: true, schema: { type: integer } }]
      tags: [assessments]
      summary: 受検を始める（受検中があればそれを返す）
      security: [{ userToken: [] }]
      responses:
        "200": { description: 受検セッションと問題 }
        "400": { description: 検査IDが不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 検査が無い }

  /api/assessments/sessions/{sessionId}:
    get:
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      tags: [assessments]
      summary: 受検セッションと保存済みの回答を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 受検セッション }
        "400": { description: セッションIDが不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 本人のセッションが無い }

  /api/assessments/sessions/{sessionId}/answers/{questionId}:
    put:
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: questionId, required: true, schema: { type: integer } }
      tags: [assessments]
      summary: 1問の回答を保存する（同じ問題は上書き）
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "204": { description: 保存した }
        "400": { description: 回答が1〜5の範囲外、またはIDが不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: セッションか問題が無い }
        "409": { description: 提出済み }

  /api/assessments/sessions/{sessionId}/submit:
    post:
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      tags: [assessments]
      summary: 提出してスコアを確定する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 提出した }
        "400": { description: 未回答の問題がある }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 本人のセッションが無い }
        "409": { description: 提出済み }

  /api/assessments/sessions/{sessionId}/result:
    get:
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      tags: [assessments]
      summary: 提出済みの結果を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: カテゴリ別スコア }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 未提出または本人のセッションが無い }

  # ── ability-assessments（能力検査 / 学生）─────────────────────
  # 性格検査（/api/assessments）とパスを分ける。採点方式も結果の意味も違い、
  # 能力検査の点数は user_weight_scores へ入れない（SOCAIAGENT-433）。
  # 受検中のレスポンスに正解（correct_choice）は含めない。採点はサーバ側のみ。
  /api/ability-assessments:
    get:
      tags: [assessments]
      summary: 受けられる能力検査と自分の受検状況を一覧する
      description: "受検中のまま制限時間を過ぎたものは `status: expired` で返す。"
      security: [{ userToken: [] }]
      responses:
        "200": { description: 能力検査の一覧（未受検が先） }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/ability-assessments/{templateId}/sessions:
    post:
      parameters: [{ in: path, name: templateId, required: true, schema: { type: integer } }]
      tags: [assessments]
      summary: 能力検査の受検を開始する（受検中があればそれを返す）
      description: |
        開始時に制限時間から締め切り（`deadline_at`）を凍結する。判定はサーバだけが行い、
        クライアントのタイマーは表示用。制限時間を過ぎた受検中は再開できない（410）。
      security: [{ userToken: [] }]
      responses:
        "200": { description: 問題（選択肢つき）・保存済みの回答・締め切り・残り秒 }
        "400": { description: 検査の指定が正しくない }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 検査が無い }
        "410": { description: 制限時間を過ぎている }

  /api/ability-assessments/sessions/{sessionId}:
    get:
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      tags: [assessments]
      summary: 受検の現在の状態を取得する
      description: 問題は `id` / `position` / `section` / `body` / `choices` だけを返す。正解は含めない。
      security: [{ userToken: [] }]
      responses:
        "200": { description: 問題と保存済みの回答 }
        "400": { description: 受検の指定が正しくない }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 本人の受検が無い }
        "410": { description: 制限時間を過ぎている }

  /api/ability-assessments/sessions/{sessionId}/answers/{questionId}:
    put:
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: questionId, required: true, schema: { type: integer } }
      tags: [assessments]
      summary: 1問の回答を保存する（自動保存・冪等）
      description: |
        `choice` は選択肢の 0 始まりの添字。0 を正当な値として受けるため、未指定とは区別する。
        締め切りを過ぎた回答は受け付けない（410）。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: integer, minimum: 0 }
      responses:
        "204": { description: 保存した }
        "400": { description: 選択肢の範囲外、または検査に無い問題 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 本人の受検が無い }
        "409": { description: すでに提出済み }
        "410": { description: 制限時間を過ぎている }

  /api/ability-assessments/sessions/{sessionId}/submit:
    post:
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      tags: [assessments]
      summary: 回答を採点して提出する
      description: |
        未回答は誤答扱いで、出題数には数える。締め切りを過ぎていても提出は受け付ける
        （弾くと時間切れで結果が一切出ない）。締め切り後の新しい回答は保存されないので点数は増えない。
      security: [{ userToken: [] }]
      responses:
        "200": { description: 提出した }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 本人の受検が無い }
        "409": { description: すでに提出済み }

  /api/ability-assessments/sessions/{sessionId}/result:
    get:
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      tags: [assessments]
      summary: 提出済みの結果を取得する
      description: section（verbal / numerical）別の正答数と出題数。偏差値・順位は返さない。
      security: [{ userToken: [] }]
      responses:
        "200": { description: section 別の正答数と出題数 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 未提出または本人の受検が無い }

  # ── assessments（学校側 / 先生） ─────────────────────
  /api/admin/assessment-templates:
    get:
      tags: [assessments]
      summary: 学校独自の検査テンプレートを一覧する
      description: |
        担当校スコープが掛かる（`school_id` 必須）。運営標準は含まない。学校独自の結果は「おすすめ企業の計算には使われない」。
      security: [{ adminAuth: [] }]
      parameters: [{ in: query, name: school_id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: テンプレート一覧 }
        "400": { description: school_id が無い・不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [assessments]
      summary: 学校独自の検査テンプレートを作る
      description: |
        カテゴリは正典10個から選ぶ。`is_standard` は常に false で、マッチングには合流しない。
        担当校・作成者は認証情報から決め、リクエスト本文の値は使わない。
      security: [{ adminAuth: [] }]
      parameters: [{ in: query, name: school_id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, questions]
              properties:
                title: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                due_at: { type: string, format: date-time, description: 受検期限。現在より後 }
                questions:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required: [body, weight_category]
                    properties:
                      body: { type: string, maxLength: 200 }
                      weight_category: { type: string }
                      reverse_scored: { type: boolean }
      responses:
        "201": { description: 作成した }
        "400": { description: 入力不正（メッセージは先生にそのまま見せられる） }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 学校が無い }

  /api/admin/assessment-templates/{id}/students:
    get:
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: school_id, required: true, schema: { type: integer } }
      tags: [assessments]
      summary: 学校独自テンプレートの受検状況（学生ごと）
      description: |
        期限超過 → 未受検 → 途中 → 完了の順。スコアの生値は返さず、上位カテゴリ名だけを返す。
        他校のテンプレートは 404。
      security: [{ adminAuth: [] }]
      responses:
        "200": { description: 学生ごとの受検状況 }
        "400": { description: IDまたは school_id が不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: この学校のテンプレートが無い }

  # ── resume ─────────────────────────────────────────
  /api/resume/upload:
    post:
      tags: [resume]
      summary: 職務経歴書をアップロードする
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: アップロードした }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: 32MB を超えた }

  /api/resume/review:
    post:
      tags: [resume]
      summary: 添削する
      security: [{ userToken: [] }]
      responses:
        "200":
          description: 添削結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  review: { type: object }
                  items: { type: array, items: { type: object } }
                  format_findings:
                    type: array
                    description: 形式チェックの指摘（#1530）。保存はしない（#1531）。
                    items: { $ref: "#/components/schemas/ResumeFormatFinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/resume/review/stream:
    post:
      tags: [resume]
      summary: 添削する（ストリーミング）
      description: Server-Sent Events で逐次返す。最後の `complete` イベントに review・items・annotated_available と、format_findings（ResumeFormatFinding の配列）を含む。
      security: [{ userToken: [] }]
      responses:
        "200":
          description: SSE ストリーム
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/resume/status:
    get:
      tags: [resume]
      summary: 履歴書の対応要否を取得する
      security: [{ userToken: [] }]
      responses:
        "200":
          description: 対応要否
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/resume/annotated:
    get:
      tags: [resume]
      summary: 注釈付きの履歴書を取得する
      security: [{ userToken: [] }]
      responses:
        "200": { description: 注釈付きデータ }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/resume/document:
    get:
      tags: [resume]
      summary: レビュー画面が描く、PDFに揃えた元の書類を取得する
      description: |
        DOCX・Google Docs もレビュー時に PDF へ変換してあるので、どれも PDF で返す。
        注釈PDFと違い、指摘の強調は入っていない（画面が番号つきで重ねる）。
        本人の書類だけ返し、共有キャッシュには残さない（`Cache-Control: private, no-store`）。
      security: [{ userToken: [] }]
      parameters:
        - { name: document_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { description: document_id が無い・不正 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: 他の利用者の書類 }
        "404": { description: レビュー前で、まだ書類が用意できていない }

  # ── es（認証なし。レート制限のみ）────────────────────
  /api/es/rewrite:
    post:
      tags: [es]
      summary: エントリーシートをリライトする
      description: |
        **未ログインでも使える。** 認証は付けず、コスト濫用はレート制限で止める（#1154）。
        生成は RAG の `/es/review` に一本化してあり、ここでプロンプトは組まない（#1533）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ESRewriteRequest" }
      security: []
      responses:
        "200":
          description: リライト結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ESRewriteResponse" }
        "400": { description: 本文が不正 }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/es/review:
    post:
      tags: [es]
      summary: エントリーシートを添削する
      description: |
        **未ログインでも使える。** 認証は必須にしない（必須にするとログイン前に試す導線が壊れる）。
        ただし `X-User-Token` があれば実行者として扱い、添削結果を履歴に残す（#1531）。
        壊れたトークン・退会済み・所属学園が確定しない場合も 401 にはせず、保存だけ行わない。
        コスト濫用はレート制限で止める（#1154）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ESReviewRequest" }
      security: []
      responses:
        "200":
          description: 添削結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ESReviewResponse" }
        "400": { description: 本文が不正 }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ── schedule ───────────────────────────────────────
  /api/user/consultations:
    get:
      tags: [schedule]
      summary: 自分の相談（先生からの案内と自分の質問）の一覧
      description: |
        #2028。新しく動いた順（`updated_at`, `id` の降順）。閉じた案内も含む（ホームの案内一覧とは別）。
        続きは、前のページの `next_cursor` を `cursor` に渡して取る（空なら最後のページ）。
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: limit, description: 件数（既定30・上限100）, schema: { type: integer } }
        - { in: query, name: cursor, description: 前のページの next_cursor, schema: { type: string } }
      responses:
        "200": { description: "`items`（スレッドごとの未読数を含む）と `next_cursor`" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [schedule]
      summary: 学生から先生への質問のスレッドを作る
      description: |
        #2028。学生は `X-User-Token` から決まる。本文は前後の空白を除いて1000文字（Unicode のコードポイント）まで。
        学生でない（ゲスト・管理者・職員）、または保存の直前に退会が確定していたなら 403。学校が未登録・学校の学園が本人と違うなら 400（どの先生にも届かないため）。
        先生がまだ答えていない質問が5件あれば 429。
        保存のあとのスレッドの読み直しに失敗しても 201 で `stale: true` を返す（再送で二重にしない）。
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 1000 } } }
      responses:
        "201": { description: 作成したスレッド }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/user/consultations/unread:
    get:
      tags: [schedule]
      summary: 自分のスレッドごとの、先生の未読の発言の数
      security: [{ userToken: [] }]
      responses:
        "200": { description: スレッドごとの未読の数と合計 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/user/consultations/{id}:
    get:
      tags: [schedule]
      summary: 自分のスレッド（案内または質問）と発言。表示した先生の発言を既読にする
      description: 他人の案内は 404。既読にするのは、この応答に含めた最後の発言の ID まで。
      security: [{ userToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: スレッド }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 相談が見つからない }

  /api/user/consultations/{id}/messages:
    post:
      tags: [schedule]
      summary: 自分のスレッドに返信する
      security: [{ userToken: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 1000 } } }
      responses:
        "201": { description: 返信後のスレッド }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 相談が見つからない }

  /api/admin/teacher/consultations:
    get:
      tags: [admin-analytics]
      summary: 先生の受信一覧（学生の発言があるスレッド）
      description: |
        担当校スコープが掛かる（#2028）。担当校を持つ管理者・職員は `school_id` が必須で、担当校以外は 403。
        学生（学生ロール・管理者でない・ゲストでない・退会していない）の相談だけを、最後の発言の新しい順に返す。
        続きは、前のページの `next_before_id` を `before_id` に渡して取る（無ければ最後のページ）。
      security: [{ adminAuth: [] }]
      parameters:
        - { in: query, name: school_id, schema: { type: integer } }
        - { in: query, name: limit, description: 件数（既定30・上限100）, schema: { type: integer } }
        - { in: query, name: before_id, description: 前のページの next_before_id, schema: { type: integer } }
      responses:
        "200": { description: "`items` と `next_before_id`" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/teacher/consultations/{id}:
    get:
      tags: [admin-analytics]
      summary: スレッドを見る（表示した学生の発言を既読にする）
      description: |
        スレッドの学生の学校が担当校でなければ、存在しない ID と同じく 404（他校の相談の有無を探らせない）。
        既読にするのは、この応答に含めた最後の発言の ID まで。
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: スレッド }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 相談が見つからない（担当校以外を含む） }

  /api/admin/teacher/consultations/{id}/messages:
    post:
      tags: [admin-analytics]
      summary: スレッドに先生が返信する
      description: |
        スレッドの学生の学校が担当校でなければ 404。`seen_message_ids`（返信を書いた画面に出ていた発言の ID）のうち
        学生の未読の発言を、返信と同じトランザクションで既読にする（省略・空なら既読にしない。1000 件を超えたら 400）。
        画面に出ていなかった発言は、ID が小さくても既読にしない。
        保存のあとのスレッドの読み直しに失敗しても 201 で `stale: true` を返す（再送で二重にしない）。
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 1000 }
                seen_message_ids:
                  type: array
                  maxItems: 1000
                  items: { type: integer }
      responses:
        "201": { description: 返信後のスレッド }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 相談が見つからない（担当校以外を含む） }
  /api/portfolio:
    get:
      tags: [portfolio]
      summary: 自分の自己分析ポートフォリオ
      description: |
        診断・面接・ES・適性検査をまとめて返す（#2030）。宛先は `X-User-Token` から決まり、user_id は受け取らない。
        面接は教員向けの詳細を含めず、学生向けの要約・スコア・強み・改善点だけを返す。`Cache-Control: no-store`。
      security: [{ userToken: [] }]
      parameters:
        - in: query
          name: sections
          description: 出力する内容（カンマ区切り）。空なら全部
          schema: { type: string, example: "diagnosis,interview,es,assessment" }
      responses:
        "200": { description: ポートフォリオ }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications:
    get:
      tags: [notifications]
      summary: 自分の通知の一覧（新しい順）
      description: "宛先は `X-User-Token` から決まり、user_id は受け取らない（#2033）。"
      security: [{ userToken: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, maximum: 50 } }
        - { in: query, name: before_id, description: この ID より古い通知だけ返す（続きの読み込み）, schema: { type: integer } }
        - { in: query, name: unread, description: 1 なら未読だけを返す（ホームのお知らせ用。before_id は使わない）, schema: { type: string, enum: ["1"] } }
        - { in: query, name: exclude_kind, description: unread=1 のとき、除く種類（複数可）, schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        "200":
          description: 一覧と未読の件数
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count: { type: integer }
                  notifications:
                    type: array
                    items:
                      type: object
