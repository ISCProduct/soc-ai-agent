        招待メールのトークンは**有効期限24時間**。DB にはハッシュだけ保存する。

        同じ相手を再招待するとトークンが再発行され、無効化されたアカウントも復帰する（`disabled_at` が消える）。ただしパスワード設定済みのアカウントは重複作成できない（`ErrEmailExists`）。その場合はパスワード再設定を使う（#1196）。
      security: [{ adminAuth: [] }]
