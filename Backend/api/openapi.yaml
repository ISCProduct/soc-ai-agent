      summary: 企業アカウントを自己登録する
      description: |
        審査前でもアカウントは作れる。学生検索とスカウトは `is_verified` が true になるまで使えない。
        IP 単位でログインと同じレート制限がかかる。
      security: []
      responses:
        "201":
          description: 登録した
        "400":
          description: 入力が不正
        "409":
          description: 同じメールアドレスが既にある
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/company-auth/login:
    post:
      tags: [company-auth]
      summary: 企業ポータルにログインする
      description: |
        **メールとパスワードのみ。** 学生側にある OAuth もゲスト利用も無い。

        判定の順序に意味がある。メール/パスワードが空でない → ユーザーが存在する → **パスワードが設定済み**（招待未受諾はここで落ちる）→ パスワードが一致する → アカウントが無効化されていない。

        無効化の判定を**パスワード照合より後ろ**に置いているのは、先に返すとパスワードを知らない相手にもアカウントの存在が伝わるため。

        1〜4 はすべて `401`。無効化だけが別に返る。IP 単位 20回/分。
      security: []
      responses:
        "200":
          description: ログインした。httpOnly Cookie 3本を設定する
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/company-auth/accept-invite:
    post:
      tags: [company-auth]
      summary: 招待を受諾してパスワードを決める
      description: |
        **初回はここから。** 招待トークンの有効期限は 24 時間で、DB にはハッシュだけ保存する。

        追加の担当者は学校側の管理者、または既存の owner からの招待で入る。企業自身の初回登録は `/register`。
      security: []
      responses:
        "200":
          description: 受諾した
        "400":
          description: 招待リンクが無効か期限切れ
        "429": { $ref: "#/components/responses/TooManyRequests" }

