    get:
      tags: [companies]
      summary: 企業をWEB検索する
      description: |
        **認証なしで OpenAI Web Search を呼ぶ経路。** コストに直結するので扱いに注意。

        まず DB を名前で引き、**一致が1件でもあれば web_search は呼ばない**（`SearchCandidates` の `len(out) > 0` で早期 return）。DB に無い語でだけ外部検索が走る。

        レート制限は IP 単位 300回/10分 と**全体 1000回/時**の二段（`GUEST_AI_RATE_LIMIT_PER_IP` / `GUEST_AI_RATE_LIMIT_GLOBAL`、#1154）。

        返す各候補の `source` が `db` なら DB 由来、それ以外は外部検索由来。
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 候補一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyCandidate"
        "400":
          description: q が空
        "429": { $ref: "#/components/responses/TooManyRequests" }

