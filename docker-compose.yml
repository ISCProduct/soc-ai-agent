# ============================================================
# staging (ECS on EC2) の EC2 ホスト用 Compose
#
# ローカル開発では使わない。ECR のイメージを pull して起動し、RDS 等の
# マネージドリソースに接続するため、ローカルで実行すると staging の
# リソースへ接続しにいく。ローカル開発は compose.yml を使うこと。
#
# 注意: このファイル自体は staging へ配布されない（#1477 のレビューで判明）。
# EC2 上の /opt/app/docker-compose.yml を書くのは
# infra/terraform/environments/staging/app_user_data.sh.tftpl で、
# .github/workflows/deployment.yml はそれを `docker compose pull && up -d` するだけ
# （scp するのは nginx 設定と ensure-edge-compose.sh のみ）。
# 実際に staging で動くサービスは user_data 側の定義が正であり、
# ここにしかない company-graph は staging / 本番のどちらでも起動していない。
# 構成を変えるときは app_user_data.sh.tftpl と infra/staging/ensure-edge-compose.sh を直すこと。
# 手順: docs/wiki/operations.md
# ============================================================
services:
  backend:
    image: 970835573274.dkr.ecr.ap-northeast-1.amazonaws.com/soc-backend:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: "3306"
      APP_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    image: 970835573274.dkr.ecr.ap-northeast-1.amazonaws.com/soc-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
      APP_ENV: production
      COMPANY_GRAPH_URL: http://company-graph:9100
    depends_on:
      - backend

  # Redis（#617: レート制限共有・永続ジョブキュー）。Backend とは別コンテナ。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # Resume review RAG (DuckDuckGo + CrewAI)
  rag-review:
    build: ./rag
    restart: unless-stopped
    ports:
      - "${RAG_REVIEW_PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_HINTS_MODEL: ${OPENAI_HINTS_MODEL:-gpt-4o-mini}
      OPENAI_HINTS_PARSE_MODEL: ${OPENAI_HINTS_PARSE_MODEL:-gpt-4o-mini}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      - chroma

  # Vector DB for RAG embeddings (#573)
  chroma:
    image: chromadb/chroma:0.6.3
    restart: unless-stopped
    ports:
      - "${CHROMA_HOST_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  # Company graph pipeline (マルチソース新卒採用データ × gBizINFO)
  company-graph:
    image: 970835573274.dkr.ecr.ap-northeast-1.amazonaws.com/soc-company-graph:latest
    restart: unless-stopped
    ports:
      - "${COMPANY_GRAPH_PORT:-9100}:9100"
    environment:
      GBIZINFO_API_KEY: ${GBIZINFO_API_KEY:-}
      GBIZINFO_BASE_URL: ${GBIZINFO_BASE_URL:-}

volumes:
  chroma_data:
  redis_data:
