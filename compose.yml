# ============================================================
# ローカル開発用 Compose（既定ファイル）
#
# `docker compose` は compose.yml を優先して読み込むため、ローカル開発では
# ファイル指定なしの `docker compose up -d` でこのファイルが使われる。
# ソースを build して起動し、DB は named volume mysql_data を使う。
#
# 同ディレクトリの docker-compose.yml は staging EC2 用（ECR イメージを pull）。
# ローカルで誤って指定しないこと。
# 手順: docs/wiki/getting-started.md
# ============================================================
services:
  # Backend API Server
  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: soc-ai-agent-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # 開発環境: ソースコードをマウント
      - ./Backend:/app
      - go_mod_cache_app:/home/app/go/pkg/mod
      - go_build_cache_app:/home/app/.cache/go-build
    # compose up 時に migrate → air の順で起動（スキーマ未適用で API が落ちないようにする）
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.dev.sh"]
    command: ["air", "-c", ".air.toml"]
    env_file:
      - ${ENV_FILE:-./Backend/.env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soc-ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - ANNOTATION_FONT_PATH=${ANNOTATION_FONT_PATH:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}
      - RAG_REVIEW_URL=${RAG_REVIEW_URL:-http://rag-review:9000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}

  # 明示的な migrate ワンショット（app 起動前にも実行可能: docker compose run --rm migrate）
  migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: soc-ai-migrate
    volumes:
      - ./Backend:/app
      - go_mod_cache_app:/home/app/go/pkg/mod
      - go_build_cache_app:/home/app/.cache/go-build
    working_dir: /app
    command: ["go", "run", "./cmd/migrate", "up"]
    env_file:
      - ${ENV_FILE:-./Backend/.env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - soc-ai-network
    restart: "no"
    profiles:
      - tools


  # MySQL Database
  db:
    image: mysql:8.0
    container_name: soc-ai-db
    restart: unless-stopped
    ports:
      # 他プロジェクトの MySQL とぶつかる場合は DB_HOST_PORT を変更（例: 3307）
      - "${DB_HOST_BIND:-127.0.0.1}:${DB_HOST_PORT:-3306}:3306"
    env_file:
      - ${ENV_FILE:-./Backend/.env}
    volumes:
      - ${DB_VOLUME_TYPE:-mysql_data}:/var/lib/mysql
      - ${MYSQL_CONF_DIR:-./mysql/conf.d}:/etc/mysql/conf.d:ro
    networks:
      soc-ai-network:
        aliases:
          - db
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # レート制限(#617)・asynqキューのバックエンド。未起動でもBackendはインメモリにフォールバックする
  redis:
    image: redis:7-alpine
    container_name: soc-ai-redis
    restart: unless-stopped
    networks:
      - soc-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-ai-agent-frontend
    restart: unless-stopped
    # 開発時の実行ユーザー。既定はイメージ同梱の node (uid 1000)。
    # Linux ホストで自分の UID が 1000 以外だと、bind mount した ./frontend に
    # next dev が next-env.d.ts（.gitignore 対象なのでクリーン checkout には無い）を
    # 書けず起動できない（#1477）。その場合は .env に
    #   FRONTEND_USER=1001:1001   # $(id -u):$(id -g)
    # を入れる。下の2ボリュームは node 所有で作られるので、併せて
    #   docker compose down && docker volume rm <project>_frontend_node_modules <project>_frontend_next
    # で作り直すこと（どちらもビルドキャッシュなので消して問題ない）。
    user: "${FRONTEND_USER:-node}"
    volumes:
      - ./frontend:/app
      # 匿名ボリューム（`- /app/node_modules`）にすると、root で動いていた旧コンテナが
      # 作ったボリュームが `up --build` の再作成でそのまま引き継がれ、非root化した
      # 途端に next dev がキャッシュを書けず EACCES になる（#1477）。
      # 名前付きにすると新しいボリュームがイメージの内容（node 所有）で初期化されるため、
      # 既存環境も次の `up` で自動的に移行する。旧ボリュームは残るだけで消えないので、
      # 気になれば `docker volume prune` で回収する。
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
      - BACKEND_URL=${BACKEND_URL:-http://app:8080}
      - COMPANY_GRAPH_URL=${COMPANY_GRAPH_URL:-http://company-graph:9100}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    depends_on:
      app:
        condition: service_started
    networks:
      - soc-ai-network

  # Company graph pipeline (マルチソース新卒採用データ × gBizINFO) - Go実装
  company-graph:
    build:
      context: ./tools/company-graph
      dockerfile: Dockerfile
    container_name: soc-ai-company-graph
    restart: unless-stopped
    ports:
      - "${COMPANY_GRAPH_PORT:-9100}:9100"
    environment:
      - GBIZINFO_API_KEY=${GBIZINFO_API_KEY:-}
      - GBIZINFO_BASE_URL=${GBIZINFO_BASE_URL:-}
    networks:
      - soc-ai-network

  # Resume review RAG
  rag-review:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: soc-ai-rag-review
    restart: unless-stopped
    ports:
      - "${RAG_REVIEW_PORT:-9000}:9000"
    env_file:
      - ./Backend/.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_HINTS_MODEL=${OPENAI_HINTS_MODEL:-gpt-4o-mini}
      - OPENAI_HINTS_PARSE_MODEL=${OPENAI_HINTS_PARSE_MODEL:-gpt-4o-mini}
      - CHROMA_HOST=${CHROMA_HOST:-chroma}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      # Phase 1B: Read 経路は既定で Search しない（admin 温存時のみ true）
      - RAG_ALLOW_WEB_SEARCH_FALLBACK=${RAG_ALLOW_WEB_SEARCH_FALLBACK:-false}
      - RAG_USE_DEEP_RESEARCH=${RAG_USE_DEEP_RESEARCH:-false}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - APP_ENV=${APP_ENV:-development}
    volumes:
      # 既定では使わない（CHROMA_HOST=chroma があるので PersistentClient を通らず、
      # RAG_CHROMA_DATA_DIR の既定も /app/chroma_db）。
      # RAG_CHROMA_DATA_DIR=/data/... へ切り替える場合（scripts/migrate_persistent_to_http.py）で、
      # かつ root で動いていた頃のデータが既にこのボリュームにあるなら、非root化後は
      # 書き込みが PermissionError になる。一度だけ所有権を移す（ファイルは消さない）:
      #   docker compose run --rm --user root rag-review chown -R 10001:10001 /data
      - rag_data:/data
    depends_on:
      - chroma
    networks:
      - soc-ai-network

  # Vector DB for RAG embeddings (#573 / #557)
  chroma:
    image: chromadb/chroma:0.6.3
    container_name: soc-ai-chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_HOST_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    networks:
      - soc-ai-network

volumes:
  mysql_data:
    driver: local
  # frontend のビルドキャッシュ。匿名にすると旧root所有のボリュームを引き継ぐため
  # 名前付きにしている（#1477。compose.yml の frontend のコメント参照）
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local
  rag_data:
    driver: local
  chroma_data:
    driver: local
  go_mod_cache_app:
    driver: local
  go_build_cache_app:
    driver: local

networks:
  soc-ai-network:
    driver: bridge
